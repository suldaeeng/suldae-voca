<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주니어 능률 VOCA 단어시험</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f5f5f3;
    margin: 0;
    padding: 0;
    color: #2c2c2a;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    min-height: 100vh;
    background: #fff;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 8px 0 4px;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: #888780;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: #f9f9f7;
    border: 1px solid #e5e4dd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #5f5e5a;
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type=text], select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #0F6E56;
    color: #fff;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button.secondary {
    background: #fff;
    color: #0F6E56;
    border: 1px solid #0F6E56;
  }
  .progress {
    font-size: 13px;
    color: #888780;
    text-align: center;
    margin-bottom: 10px;
  }
  .qbox {
    text-align: center;
    padding: 30px 10px;
  }
  .qword {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 6px;
    word-break: keep-all;
  }
  .qhint {
    font-size: 13px;
    color: #888780;
    margin-bottom: 24px;
  }
  #listen-screen .card {
    text-align: center;
    padding: 30px 16px;
  }
  #listen-screen .qhint {
    margin-bottom: 0;
  }
  #listen-screen button.secondary {
    margin-bottom: 0;
  }

  .answer-input {
    text-align: center;
    font-size: 20px;
    padding: 14px;
  }
  .feedback {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    margin: 10px 0;
    min-height: 24px;
  }
  .feedback.correct { color: #0F6E56; }
  .feedback.wrong { color: #993C1D; }
  .correct-answer {
    text-align: center;
    font-size: 14px;
    color: #5f5e5a;
    margin-bottom: 16px;
  }
  .result-summary {
    text-align: center;
    margin-bottom: 20px;
  }
  .result-score {
    font-size: 48px;
    font-weight: 700;
    color: #0F6E56;
    margin: 10px 0;
  }
  .wrong-list {
    margin-top: 16px;
  }
  .wrong-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #e5e4dd;
    font-size: 15px;
  }
  .wrong-item .w {
    font-weight: 600;
  }
  .wrong-item .k {
    color: #888780;
  }
  .hidden { display: none; }
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    min-height: 100px;
    font-family: monospace;
    margin-bottom: 10px;
  }
  .small-note {
    font-size: 12px;
    color: #888780;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
  .timer {
    text-align: center;
    font-size: 13px;
    color: #888780;
    margin-bottom: 10px;
  }
  .student-report-card {
    border: 1px solid #e5e4dd;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
  .student-report-card .name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .student-report-card .meta {
    font-size: 13px;
    color: #5f5e5a;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .student-report-card textarea {
    margin-bottom: 8px;
  }
  .student-report-card button {
    width: auto;
    display: inline-block;
    padding: 8px 14px;
    font-size: 13px;
  }

/* v7 stability: next buttons are not student controls */
#nextBtn,#nextButton,#next-btn{display:none!important}
</style>
</head>
<body>
<div class="container">
  <h1>설대영어 단어시험</h1>
  <div class="sub">주니어 능률 VOCA 기본 1200 · 표준채점 v7 전체안정화</div>
  <div style="text-align:right; margin-bottom:8px;">
    <a href="#" id="teacher-mode-link" style="font-size:12px; color:#888780;">선생님 모드</a>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="card">
      <label for="student-name">이름</label>
      <input type="text" id="student-name" placeholder="이름을 입력하세요">

      <label for="day-select">오늘의 단어 (DAY)</label>
      <select id="day-select"></select>

      <button id="listen-btn" class="secondary" type="button">🔊 단어 발음 듣기</button>
      <button id="start-btn">시험 시작</button>
    </div>
    <div class="small-note">
      각 단어마다 영어→한글 또는 한글→영어 문제가 무작위로 출제됩니다.<br>
      틀린 단어는 시험 마지막에 다시 풀게 됩니다.
    </div>
  </div>

  <!-- LISTEN SCREEN -->
  <div id="listen-screen" class="hidden">
    <div class="card">
      <div class="progress" id="listen-progress"></div>
      <div class="qword" id="listen-word"></div>
      <div class="qhint" id="listen-kor" style="margin-top:8px;"></div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button id="listen-prev-btn" class="secondary" type="button" style="flex:1;">◀ 이전</button>
        <button id="listen-replay-btn" class="secondary" type="button" style="flex:1;">🔊 다시 듣기</button>
        <button id="listen-next-btn" class="secondary" type="button" style="flex:1;">다음 ▶</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:12px;">
        <label for="listen-speed" style="font-size:13px; color:#888780; margin:0;">속도</label>
        <input type="range" id="listen-speed" min="0.5" max="1" step="0.1" value="0.8" style="flex:1;">
        <label style="font-size:13px; color:#888780; margin:0; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="listen-autoplay" checked style="width:auto; margin:0;"> 자동재생
        </label>
      </div>
    </div>
    <button id="listen-done-btn">단어 듣기 완료 → 돌아가기</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="progress" id="progress-text"></div>
    <div class="card qbox">
      <div class="qhint" id="q-hint"></div>
      <div class="qword" id="q-word"></div>
      <input type="text" class="answer-input" id="answer-input" placeholder="정답 입력" autocomplete="off">
      <div class="feedback" id="feedback"></div>
      <div class="correct-answer hidden" id="correct-answer"></div>
    </div>
    <button id="submit-btn">확인</button>
    <button id="next-btn" class="hidden secondary" style="margin-top:8px;">다음</button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="hidden">
    <div class="card result-summary">
      <div id="result-name"></div>
      <div class="result-score" id="result-score"></div>
      <div id="result-detail"></div>
    </div>
    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">선생님께 제출할 결과</div>
      <textarea id="result-text" readonly></textarea>
      <button id="copy-btn" class="secondary">결과복사 후 선생님에게 전송하기</button>
    </div>
    <div class="card wrong-list" id="wrong-list-container">
      <div style="font-weight:600; margin-bottom:8px;">틀렸던 단어</div>
      <div id="wrong-list"></div>
    </div>
    <button id="retry-btn">다시 시험 보기</button>
  </div>

  <!-- TEACHER DASHBOARD SCREEN -->
  <div id="teacher-screen" class="hidden">
    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">학생 시험 결과 (전체)</div>
      <div id="teacher-loading" style="font-size:13px; color:#888780;">불러오는 중...</div>
      <div id="teacher-table-wrap" style="overflow-x:auto;"></div>
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">학부모 주간 리포트 (최근 7일)</div>
      <div id="weekly-loading" style="font-size:13px; color:#888780;">불러오는 중...</div>
      <div id="weekly-report-wrap"></div>
    </div>

    <button id="back-to-setup-btn" class="secondary">학생 화면으로 돌아가기</button>
  </div>
</div>

<script>
/* Standalone/iPhone safe local storage shim */
if (!window.storage) {
  window.storage = {
    async set(key, value) { localStorage.setItem(key, value); return {key, value}; },
    async get(key) { const value = localStorage.getItem(key); return value === null ? null : {key, value}; },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || k.indexOf(prefix) === 0) keys.push(k);
      }
      return {keys};
    }
  };
}

let listenState = { day: null, idx: 0, words: [], autoplayTimer: null };

function speakWord(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  const speedEl = document.getElementById('listen-speed');
  utter.rate = speedEl ? parseFloat(speedEl.value) : 0.8;
  window.speechSynthesis.speak(utter);
}

function renderListenWord() {
  const w = listenState.words[listenState.idx];
  document.getElementById('listen-progress').textContent =
    (listenState.idx + 1) + ' / ' + listenState.words.length;
  document.getElementById('listen-word').textContent = w.eng;
  document.getElementById('listen-kor').textContent = w.kor;
  speakWord(w.eng);

  if (listenState.autoplayTimer) clearTimeout(listenState.autoplayTimer);
  const autoplay = document.getElementById('listen-autoplay').checked;
  if (autoplay) {
    listenState.autoplayTimer = setTimeout(() => {
      if (listenState.idx < listenState.words.length - 1) {
        listenState.idx++;
        renderListenWord();
      }
    }, 2200);
  }
}

document.getElementById('listen-btn').addEventListener('click', () => {
  const day = parseInt(daySelect.value);
  if (!day || !VOCA[day]) return;
  listenState.day = day;
  listenState.idx = 0;
  listenState.words = VOCA[day];
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('listen-screen').classList.remove('hidden');
  renderListenWord();
});

document.getElementById('listen-replay-btn').addEventListener('click', () => {
  if (listenState.autoplayTimer) clearTimeout(listenState.autoplayTimer);
  const w = listenState.words[listenState.idx];
  speakWord(w.eng);
  const autoplay = document.getElementById('listen-autoplay').checked;
  if (autoplay) {
    listenState.autoplayTimer = setTimeout(() => {
      if (listenState.idx < listenState.words.length - 1) {
        listenState.idx++;
        renderListenWord();
      }
    }, 2200);
  }
});

document.getElementById('listen-next-btn').addEventListener('click', () => {
  if (listenState.idx < listenState.words.length - 1) {
    listenState.idx++;
    renderListenWord();
  }
});

document.getElementById('listen-prev-btn').addEventListener('click', () => {
  if (listenState.idx > 0) {
    listenState.idx--;

function normalize(str) {
  return String(str || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

/* =========================================================
   설대영어 최신 채점 규칙 v3
   1) 괄호/밑줄/물결표/숫자/구두점/공백은 채점에서 제거
   2) / 또는 쉼표로 나뉜 여러 뜻 중 하나만 맞아도 정답
   3) 일반 단어는 최소 2글자 이상 부분 의미 인정
   4) to/up/out 등 짧은 전치사·부사 뜻은 1글자도 예외 인정
   5) 대명사는 격을 엄격히 구분: we=우리는, us=우리를, our=우리의
   6) 대괄호 선택형: 입다[신다, 쓰다] → 입다/신다/쓰다 모두 인정
   ========================================================= */

function cleanKor(str) {
  return String(str || '')
    .normalize('NFKC')
    .replace(/[(){}\[\]<>]/g, '')
    .replace(/[~_＿－—–-]/g, '')
    .replace(/[,.;:!?，。ㆍ·․…"'“”‘’]/g, '')
    .replace(/\s+/g, '')
    .trim();
}

function stripLeadingParticle(str) {
  const s = cleanKor(str);
  return s.replace(/^(을|를|이|가|은|는|에|에서|로|으로|와|과|의|도|만|까지|부터|에게|한테)/, '');
}

function splitTopLevel(text) {
  const result = [];
  let buf = '';
  let depth = 0;
  const s = String(text || '');
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '[' || ch === '(' || ch === '{') depth++;
    if (ch === ']' || ch === ')' || ch === '}') depth = Math.max(0, depth - 1);
    if ((ch === '/' || ch === ',' || ch === '，') && depth === 0) {
      if (buf.trim()) result.push(buf.trim());
      buf = '';
    } else {
      buf += ch;
    }
  }
  if (buf.trim()) result.push(buf.trim());
  return result;
}

function expandBracketAlternatives(text) {
  const original = String(text || '').trim();
  const open = original.indexOf('[');
  const close = original.indexOf(']', open + 1);
  if (open === -1 || close === -1) return [original];

  const beforeAll = original.slice(0, open);
  const inside = original.slice(open + 1, close);
  const after = original.slice(close + 1);

  // 바로 앞의 한글 동사/형용사 덩어리를 기본 대체어로 잡음
  const m = beforeAll.match(/([가-힣]+)$/);
  const base = m ? m[1] : '';
  const prefix = m ? beforeAll.slice(0, beforeAll.length - base.length) : beforeAll;

  const alts = splitTopLevel(inside);
  const results = new Set();

  if (base) results.add(prefix + base + after);
  alts.forEach(alt => results.add(prefix + alt + after));
  results.add(original.replace(/[\[\]]/g, ''));

  // 여러 개의 대괄호가 있으면 한 번 더 확장
  return Array.from(results).flatMap(v => {
    if (v.includes('[') && v.includes(']') && v !== original) return expandBracketAlternatives(v);
    return [v];
  });
}

function stripFillers(str) {
  return cleanKor(str)
    .replace(/^(을|를|이|가|은|는|에|에서|로|으로|와|과|의|도|만|까지|부터|에게|한테)/, '')
    .replace(/^(무엇을|무엇이|누구를|누구에게)/, '');
}

function buildKorCandidates(korFull, eng) {
  const candidates = new Set();
  const units = splitTopLevel(korFull);
  units.forEach(unit => {
    expandBracketAlternatives(unit).forEach(v => {
      [v, stripLeadingParticle(v)].forEach(x => {
        const c = cleanKor(x);
        if (c) candidates.add(c);
        const f = stripFillers(x);
        if (f) candidates.add(f);
      });
    });
  });

  // 숫자 단어는 숫자와 한글 표기를 모두 허용
  const n = numberCandidatesFromEnglish(eng);
  n.forEach(x => candidates.add(cleanKor(x)));

  return Array.from(candidates).filter(Boolean);
}

function isShortMeaningCandidate(str) {
  const s = cleanKor(str);
  // 조사/전치사/방향/숫자처럼 1글자도 답이 되는 후보만 정확 일치 허용
  const allowed = new Set(['로','에','위','아래','안','밖','전','후','옆','뒤','앞','속','내','외','중','끝','점','땀','뇌','암','약','법','길','열','줄','층','겹','힘','빛','숨','맛','상','표','쌍','짝','면','털','뿔','뼈','피','비','눈','손','발','팔','코','입','귀','목','배','위','돈','값','수','양','도','색','차','강','산','새','개','말','집','물','불','흙','별','달','해','공','영','일','이','삼','사','오','육','칠','팔','구','십']);
  return s.length === 1 || allowed.has(s) || /^\d+$/.test(s);
}

function isStrictPronoun(eng) {
  return Object.prototype.hasOwnProperty.call(STRICT_PRONOUN_KOR, normalize(eng));
}

function checkPronounKorAnswer(userAns, eng) {
  const key = normalize(eng);
  const userClean = cleanKor(userAns);
  return (STRICT_PRONOUN_KOR[key] || []).some(ans => cleanKor(ans) === userClean);
}

function korMeaningMatch(userAns, korFull, eng) {
  const userClean = stripFillers(userAns);
  if (!userClean) return false;

  // 대명사는 격 구분: 조사 제거·부분 일치 금지
  if (isStrictPronoun(eng)) {
    return checkPronounKorAnswer(userAns, eng);
  }

  const candidates = buildKorCandidates(korFull, eng);
  return candidates.some(candidate => {
    if (!candidate) return false;
    if (candidate === userClean) return true;

    // 숫자/짧은 뜻은 1글자도 허용하되 정확 일치만 인정
    if (isShortMeaningCandidate(userClean) || isShortMeaningCandidate(candidate)) {
      return candidate === userClean;
    }

    // 일반 단어: 최소 2글자 이상 부분 의미 인정
    if (userClean.length >= 2 && candidate.includes(userClean)) return true;
    if (candidate.length >= 2 && userClean.includes(candidate)) return true;
    return false;
  });
}

function synonymMatch(a, b) {
  const na = normalize(a), nb = normalize(b);

function sd22NormalizeEng(str){
  return String(str||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.…!?,;:~]/g,"").replace(/\s+/g," ").trim();
}
function sd22CleanKor(str){
  return String(str||"").toLowerCase()
    .replace(/\b\d+\s*\./g,"")
    .replace(/[()\[\]{}<>~ㆍ·,.;:!?…"“”‘’'`]/g,"")
    .replace(/\s+/g,"").trim();
}
function sd22StripParticles(str){
  var s=String(str||"");
  ["에서","에게","으로","부터","까지","처럼","을","를","이","가","은","는","의","에","로","와","과","도","만","만큼"].forEach(function(p){s=s.split(p).join("");});
  return s;
}
function sd22RegularizeKor(str){
  var s=sd22CleanKor(str);
  var out=new Set([s,sd22StripParticles(s)]);
  Array.from(out).forEach(function(x){
    out.add(x.replace(/말을하다/g,"말하다").replace(/잠을자다/g,"잠자다").replace(/춤을추다/g,"춤추다").replace(/수다를떨다/g,"수다떨다").replace(/길을잃/g,"길잃"));
  });
  Array.from(out).forEach(function(x){out.add(sd22StripParticles(x));});
  return Array.from(out).filter(Boolean);
}
function sd22SplitMeaningParts(full){
  var raw=String(full||""); var parts=new Set([raw]); var m; var bracketRe=/[\[\(]([^\]\)]+)[\]\)]/g;
  while((m=bracketRe.exec(raw))) parts.add(m[1]);
  raw.replace(/[\[\(]/g,", ").replace(/[\]\)]/g,", ").split(/[\/;,，、]|\d+\s*\./).forEach(function(x){if(x.trim())parts.add(x.trim());});
  return Array.from(parts);
}
function sd22KorCandidates(full, eng){
  var set=new Set(); var e=sd22NormalizeEng(eng);
  sd22SplitMeaningParts(full).forEach(function(part){
    sd22RegularizeKor(part).forEach(function(v){
      if(v) set.add(v);
      if(v && v.length>=2){ set.add(v.replace(/하다$/,"")); set.add(v.replace(/되다$/,"")); set.add(v.replace(/있는$/,"")); }
    });
  });
  var text=sd22CleanKor(full);
  if(/입|신|쓰|끼|걸치/.test(text)) ["입다","신다","쓰다","끼다","걸치다","입고","신고","쓰고","끼고"].forEach(function(x){set.add(x);});
  if(text.includes("수다")) ["수다떨다","수다"].forEach(function(x){set.add(x);});
  if(text.includes("담소")) ["담소나누다","담소"].forEach(function(x){set.add(x);});
  if(text.includes("길") && text.includes("잃")) ["길잃은","길잃다","잃은"].forEach(function(x){set.add(x);});
  if(!SD22_BLOCKLIST.has(e) && SD22_SYNONYM_KOR[e]) SD22_SYNONYM_KOR[e].forEach(function(k){sd22RegularizeKor(k).forEach(function(v){set.add(v);});});
  if(SD22_NUMBER_EQUIV[e]) SD22_NUMBER_EQUIV[e].forEach(function(n){set.add(sd22CleanKor(n));});
  return Array.from(set).filter(Boolean);
}
function gradeAnswerV22(opts){
  var direction=opts.direction||opts.type; var userAnswer=opts.userAnswer||opts.answer||""; var eng=opts.eng||""; var korFull=opts.korFull||opts.kor_full||"";
  var e=sd22NormalizeEng(eng);
  if(direction==="k2e"){
    var u=sd22NormalizeEng(userAnswer);
    if(!u) return {correct:false, reason:"blank", label:"미입력"};
    if(u===e) return {correct:true, reason:"exact", label:"정답"};
    if(SD22_BLOCKLIST.has(e)) return {correct:false, reason:"strict-word-wrong", label:"엄격채점 오답"};
    for(var i=0;i<SD22_ENG_SYNONYM_GROUPS.length;i++){
      var g=SD22_ENG_SYNONYM_GROUPS[i].map(sd22NormalizeEng);
      if(g.includes(u) && g.includes(e)) return {correct:true, reason:"english-synonym", label:"영어 유의어 인정"};
    }
    return {correct:false, reason:"wrong", label:"오답"};
  }
  var userVars=sd22RegularizeKor(userAnswer);
  if(!userVars.length) return {correct:false, reason:"blank", label:"미입력"};
  if(SD22_STRICT_PRONOUNS[e]){
    var allowed=[]; SD22_STRICT_PRONOUNS[e].forEach(function(x){sd22RegularizeKor(x).forEach(function(v){allowed.push(v);});});
    var ok=userVars.some(function(u){return allowed.includes(u);});
    return {correct:ok, reason:ok?"strict-pronoun":"strict-pronoun-wrong", label:ok?"대명사 엄격 정답":"대명사 엄격 오답"};
  }
  var cands=sd22KorCandidates(korFull, eng);
  var syns=(SD22_SYNONYM_KOR[e]||[]).map(sd22CleanKor);
  for(var a=0;a<userVars.length;a++){
    var u=userVars[a];
    for(var b=0;b<cands.length;b++){
      var c=cands[b]; if(!u||!c) continue;
      if(u===c){return {correct:true, reason:syns.includes(c)?"similar-wordbook":"exact", label:syns.includes(c)?"유사어 인정":"정답"};}
      if(u.length===1 || c.length===1){ if(u===c && SD22_ONE_CHAR_OK.has(u)) return {correct:true, reason:"one-char-approved", label:"짧은 뜻 인정"}; continue; }
      if(!SD22_BLOCKLIST.has(e) && u.length>=2 && c.length>=2 && (c.includes(u)||u.includes(c))) return {correct:true, reason:"partial-meaning", label:"부분 의미 인정"};
    }
  }
  return {correct:false, reason:"wrong", label:"오답"};
}
function korMeaningMatch(userAns, full, eng){
  var r=gradeAnswerV22({direction:"e2k", userAnswer:userAns, korFull:full, eng:eng}); SEOLDAE_LAST_GRADE=r; return !!r.correct;
}
function synonymMatch(a,b){
  var r=gradeAnswerV22({direction:"k2e", userAnswer:a, eng:b}); SEOLDAE_LAST_GRADE=r; return !!r.correct;
}
function gradeAnswer(opts){ var r=gradeAnswerV22(opts); SEOLDAE_LAST_GRADE=r; return r; }
function gradingReasonLabel(reason){
  var labels={exact:"정답","partial-meaning":"부분 의미 인정","similar-wordbook":"유사어 인정","english-synonym":"영어 유의어 인정","strict-pronoun":"대명사 엄격 정답","one-char-approved":"짧은 뜻 인정",wrong:"오답",blank:"미입력"};
  return labels[reason]||reason;
}

function buildQueue(day) {
  const words = VOCA[day];
  const queue = [];
  words.forEach(w => {
    const direction = Math.random() < 0.5 ? 'e2k' : 'k2e';
    queue.push({eng: w.eng, kor: w.kor, korFull: w.kor_full, direction: direction, isRetry: false});
  });
  // shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function nextQuestion() {
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('correct-answer').classList.add('hidden');
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('submit-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  state.answered = false;
  state.locked = false;
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('answer-input').readOnly = false;

  if (state.queue.length === 0) {
    showResult();
    return;
  }

  state.current = state.queue.shift();
  const completed = state.total - state.queue.length - 1;
  const retryCount = state.queue.filter(q => q.isRetry).length + (state.current.isRetry ? 1 : 0);

  document.getElementById('progress-text').textContent =
    `DAY ${String(state.day).padStart(2,'0')}  ·  ${completed + 1} / ${state.total}` +
    (state.current.isRetry ? '  (오답 재시험)' : '');

  if (state.current.direction === 'e2k') {
    document.getElementById('q-hint').textContent = '뜻을 한글로 쓰세요';
    document.getElementById('q-word').textContent = state.current.eng;
    setTimeout(() => { try { speakWord(state.current.eng); } catch(e) {} }, 160);
  } else {
    document.getElementById('q-hint').textContent = '영어 단어를 쓰세요';
    document.getElementById('q-word').textContent = state.current.kor;
  }
  document.getElementById('answer-input').focus();
}

function checkAnswer() {
  if (state.answered || state.locked) return;
  const answerEl = document.getElementById('answer-input');
  const userAns = answerEl.value;
  if (!String(userAns || '').trim()) {
    const feedbackEl = document.getElementById('feedback');
    const correctEl = document.getElementById('correct-answer');
    if (feedbackEl) { feedbackEl.textContent = '정답을 입력한 뒤 확인을 눌러주세요.'; feedbackEl.className = 'feedback'; }
    if (correctEl) { correctEl.textContent = ''; correctEl.classList.add('hidden'); }
    if (answerEl) answerEl.focus();
    return;
  }
  state.locked = true;
  document.getElementById('submit-btn').disabled = true;
  answerEl.readOnly = true;
  const c = state.current;
  const correctDisplay = (c.direction === 'e2k') ? c.korFull : c.eng;
  const grade = gradeAnswer({direction: c.direction, userAnswer: userAns, eng: c.eng, korFull: c.korFull});
  const isCorrect = !!grade.correct;

  state.answered = true;
  if (!state.attemptLog) state.attemptLog = [];
  state.attemptLog.push({eng: c.eng, direction: c.direction, userAnswer: userAns, correct: isCorrect, reason: grade.reason, label: gradingReasonLabel(grade.reason), isRetry: !!c.isRetry});

  const feedbackEl = document.getElementById('feedback');
  const correctEl = document.getElementById('correct-answer');

  if (isCorrect) {
    feedbackEl.textContent = grade.label && grade.label !== '정답' ? '정답입니다! (' + grade.label + ')' : '정답입니다!';
    feedbackEl.className = 'feedback correct';
    if (!c.isRetry) state.correctCount++;
  } else {
    feedbackEl.textContent = '오답입니다.';
    feedbackEl.className = 'feedback wrong';
    correctEl.innerHTML = '정답: ' + correctDisplay + '<br><span style="font-size:12px;color:#aaa;">(다른 단어를 썼다면 의미는 맞을 수 있어도, 이 단어장에서는 위 단어를 외워주세요)</span>';
    correctEl.classList.remove('hidden');
    const key = c.eng + '|' + c.kor;
    if (!state.wrongWords.some(w => w.key === key)) {
      state.wrongWords.push({key: key, eng: c.eng, kor: c.korFull});
    }
    state.queue.push({...c, isRetry: true});
    state.total++;
  }

  if (isCorrect && c.isRetry) {
    const key = c.eng + '|' + c.kor;
    state.wrongWords = state.wrongWords.filter(w => w.key !== key);
  }

  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  const delay = isCorrect ? 700 : 1400;
  setTimeout(() => {
    if (state.answered) nextQuestion();
  }, delay);
}

document.getElementById('submit-btn').addEventListener('click', checkAnswer);

function buildStudyRecommendation(wrongWords, attemptLog, day, percent) {
  const wrongList = (wrongWords || []).map(w => w.eng || w).filter(Boolean);
  const firstWrong = (attemptLog || []).filter(a => !a.isRetry && a.correct === false).map(a => a.eng).filter(Boolean);
  const seen = new Set();
  const reviewWords = [];
  firstWrong.concat(wrongList).forEach(w => {
    if (w && !seen.has(w)) { seen.add(w); reviewWords.push(w); }
  });
  const similarCount = (attemptLog || []).filter(a => a.reason === 'similar-wordbook').length;
  const partialCount = (attemptLog || []).filter(a => a.reason === 'partial-meaning').length;
  const strictWrongCount = (attemptLog || []).filter(a => String(a.reason || '').indexOf('strict') >= 0 && a.correct === false).length;
  let lines = '\n[추천복습]\n';
  if (reviewWords.length > 0) {
    lines += '1순위 오답 복습: ' + reviewWords.slice(0, 12).join(', ') + '\n';
    if (reviewWords.length > 12) lines += '추가 오답: ' + reviewWords.slice(12).join(', ') + '\n';
    lines += '추천 DAY: DAY ' + String(day).padStart(2,'0') + ' 다시 복습\n';
  } else {
    lines += '1순위 오답 복습: 없음\n';
    lines += '추천 DAY: 다음 DAY 진행 가능\n';
  }
  if (percent < 70) lines += '학습 권장: 오늘 DAY 전체를 다시 암기한 뒤 재시험\n';
  else if (percent < 90) lines += '학습 권장: 오답 단어 중심으로 5분 복습 후 재시험\n';
  else lines += '학습 권장: 오답만 짧게 확인하고 다음 DAY 진행\n';
  lines += '선생님 확인: 유사어 인정 ' + similarCount + '개 / 부분의미 인정 ' + partialCount + '개 / 대명사·엄격오답 ' + strictWrongCount + '개\n';
  return lines;
}

function showResult() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const originalTotal = VOCA[state.day].length;
  const score = state.correctCount;
  const percent = Math.round((score / originalTotal) * 100);

  document.getElementById('result-name').textContent = state.studentName + ' 학생';
  document.getElementById('result-score').textContent = score + ' / ' + originalTotal;
  document.getElementById('result-detail').textContent =
    `DAY ${String(state.day).padStart(2,'0')} 단어시험  ·  정답률 ${percent}%  ·  ` +
    (state.wrongWords.length > 0 ? `최종 오답 ${state.wrongWords.length}개` : '전부 통과!');

  // Wrong list
  const wrongListEl = document.getElementById('wrong-list');
  const wrongContainer = document.getElementById('wrong-list-container');
  if (state.wrongWords.length === 0) {
    wrongContainer.classList.add('hidden');
  } else {
    wrongContainer.classList.remove('hidden');
    wrongListEl.innerHTML = '';
    state.wrongWords.forEach(w => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<span class="w">${w.eng}</span><span class="k">${w.kor}</span>`;
      wrongListEl.appendChild(div);
    });
  }

  // Build report text
  const now = new Date();
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  let report = `[설대영어 단어시험 결과]\n`;
  report += `이름: ${state.studentName}\n`;
  report += `날짜: ${dateStr}\n`;
  report += `DAY: ${String(state.day).padStart(2,'0')}\n`;
  report += `점수: ${score} / ${originalTotal} (${percent}%)\n`;
  if (state.wrongWords.length > 0) {
    report += `오답 단어: ` + state.wrongWords.map(w => w.eng).join(', ') + `\n`;
  } else {
    report += `오답 없음 - 완벽합니다!\n`;
  }
  report += buildStudyRecommendation(state.wrongWords, state.attemptLog || [], state.day, percent);
  document.getElementById('result-text').value = report;

  // 자동 기록: shared storage에 저장
  saveResultToStorage({
    name: state.studentName,
    day: state.day,
    date: dateStr,
    timestamp: now.toISOString(),
    score: score,
    total: originalTotal,
    percent: percent,
    wrongWords: state.wrongWords.map(w => w.eng),
    attemptLog: state.attemptLog || [],
    engineVersion: SEOLDAE_ENGINE_VERSION
  });
}

async function saveResultToStorage(record) {
  try {
    const key = 'result:' + record.name + ':' + record.timestamp;
    await window.storage.set(key, JSON.stringify(record), true);
  } catch (e) {
    console.error('결과 저장 실패', e);
  }
}

async function loadTeacherDashboard() {
  const loadingEl = document.getElementById('teacher-loading');
  const wrapEl = document.getElementById('teacher-table-wrap');
  loadingEl.textContent = '불러오는 중...';
  wrapEl.innerHTML = '';

  try {
    const listResult = await window.storage.list('result:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];

    if (keys.length === 0) {
      loadingEl.textContent = '아직 기록된 시험 결과가 없습니다.';
      return;
    }

    const records = [];
    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (res && res.value) {
          records.push(JSON.parse(res.value));
        }
      } catch (err) {
        // skip broken entries
      }
    }

    // 최신순 정렬
    records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    loadingEl.textContent = `총 ${records.length}건의 시험 기록`;

    // 테이블 생성
    let html = '<table style="width:100%; font-size:13px; border-collapse:collapse;">';
    html += '<tr style="border-bottom:2px solid #e5e4dd; text-align:left;">' +
            '<th style="padding:6px 4px;">날짜</th>' +
            '<th style="padding:6px 4px;">이름</th>' +
            '<th style="padding:6px 4px;">DAY</th>' +
            '<th style="padding:6px 4px;">점수</th>' +
            '<th style="padding:6px 4px;">정답률</th>' +
            '<th style="padding:6px 4px;">오답 단어</th>' +
            '</tr>';
    records.forEach(r => {
      const pctColor = r.percent >= 90 ? '#0F6E56' : (r.percent >= 70 ? '#854F0B' : '#A32D2D');
      html += '<tr style="border-bottom:1px solid #f0efe9;">' +
              `<td style="padding:6px 4px; white-space:nowrap;">${r.date || ''}</td>` +
              `<td style="padding:6px 4px; font-weight:600;">${escapeHtml(r.name)}</td>` +
              `<td style="padding:6px 4px;">DAY ${String(r.day).padStart(2,'0')}</td>` +
              `<td style="padding:6px 4px;">${r.score}/${r.total}</td>` +
              `<td style="padding:6px 4px; color:${pctColor}; font-weight:600;">${r.percent}%</td>` +
              `<td style="padding:6px 4px; color:#888780;">${(r.wrongWords||[]).join(', ') || '-'}</td>` +
              '</tr>';
    });
    html += '</table>';
    wrapEl.innerHTML = html;

  } catch (e) {
    loadingEl.textContent = '결과를 불러오는 중 오류가 발생했습니다.';
    console.error(e);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 학부모 주간 리포트 =====
async function loadWeeklyReport() {
  const loadingEl = document.getElementById('weekly-loading');
  const wrapEl = document.getElementById('weekly-report-wrap');
  loadingEl.textContent = '불러오는 중...';
  wrapEl.innerHTML = '';

  try {
    const listResult = await window.storage.list('result:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];

    if (keys.length === 0) {
      loadingEl.textContent = '아직 기록된 시험 결과가 없습니다.';
      return;
    }

    const records = [];
    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (res && res.value) {
          records.push(JSON.parse(res.value));
        }
      } catch (err) {}
    }

    // 최근 7일 필터
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    const recent = records.filter(r => new Date(r.timestamp) >= weekAgo);

    if (recent.length === 0) {
      loadingEl.textContent = '최근 7일간 시험 기록이 없습니다.';
      return;
    }

    // 학생별 그룹화
    const byStudent = {};
    recent.forEach(r => {
      if (!byStudent[r.name]) byStudent[r.name] = [];
      byStudent[r.name].push(r);
    });

    loadingEl.textContent = `${Object.keys(byStudent).length}명의 학생 (최근 7일)`;

    const dateRangeStr = `${formatDate(weekAgo)} ~ ${formatDate(now)}`;

    let html = '';
    Object.keys(byStudent).sort().forEach(name => {
      const studentRecords = byStudent[name].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const totalTests = studentRecords.length;
      const avgPercent = Math.round(studentRecords.reduce((sum, r) => sum + r.percent, 0) / totalTests);
      const days = studentRecords.map(r => 'DAY ' + String(r.day).padStart(2, '0')).join(', ');

      // 공통 오답 단어 (2회 이상 틀린 단어)
      const wrongCount = {};
      studentRecords.forEach(r => {
        (r.wrongWords || []).forEach(w => {
          wrongCount[w] = (wrongCount[w] || 0) + 1;
        });
      });
      const repeatedWrong = Object.keys(wrongCount).filter(w => wrongCount[w] >= 2);

      // 리포트 텍스트 생성
      let report = `[설대영어 주간 학습 리포트]\n`;
      report += `학생: ${name}\n`;
      report += `기간: ${dateRangeStr}\n`;
      report += `이번 주 단어시험: 총 ${totalTests}회 (${days})\n`;
      report += `평균 정답률: ${avgPercent}%\n`;
      if (repeatedWrong.length > 0) {
        report += `반복적으로 어려워하는 단어: ${repeatedWrong.join(', ')}\n`;
      }
      report += `\n`;
      if (avgPercent >= 90) {
        report += `한 주간 단어 암기를 매우 꾸준히, 성실하게 해주었습니다. 칭찬해 주세요!`;
      } else if (avgPercent >= 70) {
        report += `전반적으로 잘 따라오고 있습니다. 반복 단어들을 한 번 더 봐주시면 좋겠습니다.`;
      } else {
        report += `이번 주 단어 암기가 다소 부족했습니다. 가정에서 격려와 확인 부탁드립니다.`;
      }

      const cardId = 'report-' + name.replace(/[^a-zA-Z0-9가-힣]/g, '');
      html += `<div class="student-report-card">`;
      html += `<div class="name">${escapeHtml(name)} 학생</div>`;
      html += `<div class="meta">시험 ${totalTests}회 · 평균 정답률 ${avgPercent}% · ${escapeHtml(days)}</div>`;
      html += `<textarea id="${cardId}" readonly>${report}</textarea>`;
      html += `<button onclick="copyReport('${cardId}', this)">리포트 복사</button>`;
      html += `</div>`;
    });

    wrapEl.innerHTML = html;

  } catch (e) {
    loadingEl.textContent = '리포트를 불러오는 중 오류가 발생했습니다.';
    console.error(e);
  }
}

function formatDate(d) {
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function copyReport(textareaId, btn) {
  const textarea = document.getElementById(textareaId);
  textarea.select();
  document.execCommand('copy');
  const original = btn.textContent;
  btn.textContent = '복사 완료!';
  setTimeout(() => { btn.textContent = original; }, 1500);
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const textarea = document.getElementById('result-text');
  textarea.select();
  document.execCommand('copy');
  const btn = document.getElementById('copy-btn');
  const original = btn.textContent;
  btn.textContent = '복사 완료!';
  setTimeout(() => { btn.textContent = original; }, 1500);
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
});
