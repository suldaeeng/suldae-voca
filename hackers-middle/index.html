<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta charset="UTF-8">
<title>해커스 보카 중학 필수 단어시험 - 표준채점</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f5f5f3;
    margin: 0;
    padding: 0;
    color: #2c2c2a;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    min-height: 100vh;
    background: #fff;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 8px 0 4px;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: #888780;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: #f9f9f7;
    border: 1px solid #e5e4dd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #5f5e5a;
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type=text], select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #0F6E56;
    color: #fff;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button.secondary {
    background: #fff;
    color: #0F6E56;
    border: 1px solid #0F6E56;
  }
  .progress {
    font-size: 13px;
    color: #888780;
    text-align: center;
    margin-bottom: 10px;
  }
  .qbox {
    text-align: center;
    padding: 30px 10px;
  }
  .qword {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 6px;
    word-break: keep-all;
  }
  .qhint {
    font-size: 13px;
    color: #888780;
    margin-bottom: 24px;
  }

  #listen-screen .card {
    text-align: center;
    padding: 30px 16px;
  }
  #listen-screen .qhint {
    margin-bottom: 0;
  }
  #listen-screen button.secondary {
    margin-bottom: 0;
  }
  .answer-input {
    text-align: center;
    font-size: 20px;
    padding: 14px;
  }
  .feedback {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    margin: 10px 0;
    min-height: 24px;
  }
  .feedback.correct { color: #0F6E56; }
  .feedback.wrong { color: #993C1D; }
  .correct-answer {
    text-align: center;
    font-size: 14px;
    color: #5f5e5a;
    margin-bottom: 16px;
  }
  .result-summary {
    text-align: center;
    margin-bottom: 20px;
  }
  .result-score {
    font-size: 48px;
    font-weight: 700;
    color: #0F6E56;
    margin: 10px 0;
  }
  .wrong-list {
    margin-top: 16px;
  }
  .wrong-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #e5e4dd;
    font-size: 15px;
  }
  .wrong-item .w {
    font-weight: 600;
  }
  .wrong-item .k {
    color: #888780;
  }
  .hidden { display: none; }
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    min-height: 100px;
    font-family: monospace;
    margin-bottom: 10px;
  }
  .small-note {
    font-size: 12px;
    color: #888780;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
  .timer {
    text-align: center;
    font-size: 13px;
    color: #888780;
    margin-bottom: 10px;
  }
  .student-report-card {
    border: 1px solid #e5e4dd;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
  .student-report-card .name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .student-report-card .meta {
    font-size: 13px;
    color: #5f5e5a;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .student-report-card textarea {
    margin-bottom: 8px;
  }
  .student-report-card button {
    width: auto;
    display: inline-block;
    padding: 8px 14px;
    font-size: 13px;
  }

/* Seoldae mobile distribution safety patch */
.browser-guide{position:relative;background:#fff8e8;border:1px solid #f0b429;color:#7a5b00;border-radius:12px;padding:9px 34px 9px 12px;margin:12px 0 14px;font-weight:700;font-size:12.5px;line-height:1.5}
.browser-guide.hidden{display:none!important}
.guide-close{position:absolute;top:5px;right:5px;width:24px;height:24px;padding:0;margin:0;border-radius:7px;background:transparent;color:#9a7a1a;font-size:13px;font-weight:900;line-height:24px;border:none;cursor:pointer}
.guide-close:active{background:rgba(0,0,0,.06)}
.day-trigger{width:100%;padding:13px;border:1px solid #cbd9d4;border-radius:12px;font-size:17px;background:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#1f2a25;font-weight:700}
.day-trigger:after{content:'▾';color:#0f6e56;font-size:14px;margin-left:8px}
.day-modal{position:fixed;inset:0;background:rgba(15,30,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9999}
.day-modal.hidden{display:none!important}
.day-modal-inner{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:72vh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.day-modal-header{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:16px;margin:0 2px 10px}
.day-modal-header button{width:auto;padding:7px 14px;margin:0;background:#f2f2ee;color:#33443c;font-size:13px;border-radius:9px;font-weight:800}
.day-list{overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:2px}
.day-list button{padding:11px 2px;border-radius:9px;border:1px solid #e5e4dd;background:#f9f9f7;font-weight:800;font-size:12.5px;color:#2c2c2a;cursor:pointer;line-height:1.3}
.day-list button.active{background:#0f6e56;color:#fff;border-color:#0f6e56}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{overscroll-behavior-y:contain}input,textarea,select{font-size:16px!important;-webkit-user-select:text;user-select:text}button,a{-webkit-tap-highlight-color:rgba(15,110,86,.18);touch-action:manipulation}
@supports(padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}}

</style>

<style>
.sd-wrong-speak{
  width:auto!important; min-width:92px!important; flex:0 0 auto!important;
  margin:0 0 0 8px!important; padding:7px 9px!important;
  border-radius:9px!important; font-size:12px!important; line-height:1.15!important;
  white-space:nowrap!important;
}
.wrong-item{align-items:center!important}
</style>
</head>
<body>
<div class="container">
  <h1>설대영어 단어시험</h1>
  <div class="sub">해커스 보카 중학 필수 (DAY 01~40) · 표준채점 v4.1</div>

<div class="browser-guide" id="browserGuide"><button id="guideClose" class="guide-close" aria-label="닫기">✕</button>📌 카카오톡 미리보기·문서뷰어에서는 저장/발음이 불안정할 수 있어요. Chrome·Safari로 열어주세요.</div>

  <div style="text-align:right; margin-bottom:8px;">
    <a href="#" id="teacher-mode-link" style="font-size:12px; color:#888780;">선생님 모드</a>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="card">
      <label for="student-name">이름</label>
      <input type="text" id="student-name" placeholder="이름을 입력하세요">

      <label for="day-select">오늘의 단어 (DAY)</label>
      <input type="hidden" id="day-select" value="">
      <button type="button" id="dayBtn" class="day-trigger">DAY 선택</button>

      <label for="mode-select">시험 방식</label>
      <select id="mode-select">
        <option value="mix">영어→한글 / 한글→영어 랜덤</option>
        <option value="e2k">영어→한글만</option>
        <option value="k2e">한글→영어만</option>
        <option value="wrong">저장된 오답만</option>
      </select>

      <button id="listen-btn" class="secondary" type="button">🔊 단어 발음 듣기</button>
      <button id="start-btn">시험 시작</button>
    </div>
    <div class="small-note">
      선택한 시험 방식에 따라 영어→한글 또는 한글→영어 문제가 출제됩니다.<br>
      틀린 단어는 시험 마지막에 다시 풀게 됩니다.
    </div>
  </div>

  <div id="dayModal" class="day-modal hidden"><div class="day-modal-inner"><div class="day-modal-header"><span>DAY 선택</span><button type="button" id="dayModalClose">닫기</button></div><div id="dayList" class="day-list"></div></div></div>


  <!-- LISTEN SCREEN -->
  <div id="listen-screen" class="hidden">
    <div class="card">
      <div class="progress" id="listen-progress"></div>
      <div class="qword" id="listen-word"></div>
      <div class="qhint" id="listen-kor" style="margin-top:8px;"></div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button id="listen-prev-btn" class="secondary" type="button" style="flex:1;">◀ 이전</button>
        <button id="listen-replay-btn" class="secondary" type="button" style="flex:1;">🔊 다시 듣기</button>
        <button id="listen-next-btn" class="secondary" type="button" style="flex:1;">다음 ▶</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:12px;">
        <label for="listen-speed" style="font-size:13px; color:#888780; margin:0;">속도</label>
        <input type="range" id="listen-speed" min="0.5" max="1" step="0.1" value="0.8" style="flex:1;">
        <label style="font-size:13px; color:#888780; margin:0; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="listen-autoplay" checked style="width:auto; margin:0;"> 자동재생
        </label>
      </div>
    </div>
    <button id="listen-done-btn">단어 듣기 완료 → 돌아가기</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="progress" id="progress-text"></div>
    <div class="card qbox">
      <div class="qhint" id="q-hint"></div>
      <div class="qword" id="q-word"></div>
      <input type="text" class="answer-input" id="answer-input" placeholder="정답 입력" autocomplete="off">
      <div class="feedback" id="feedback"></div>
      <div class="correct-answer hidden" id="correct-answer"></div>
    </div>
    <button id="submit-btn">확인</button>
    <button id="next-btn" class="hidden secondary" style="margin-top:8px;">다음</button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="hidden">
    <div class="card result-summary">
      <div id="result-name"></div>
      <div class="result-score" id="result-score"></div>
      <div id="result-detail"></div>
    </div>
    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">선생님께 제출할 결과</div>
      <textarea id="result-text" readonly></textarea>
      <button id="copy-btn" class="secondary">결과복사 후 선생님에게 전송하기</button>
    </div>
    <div class="card wrong-list" id="wrong-list-container">
      <div style="font-weight:600; margin-bottom:8px;">틀렸던 단어</div>
      <div id="wrong-list"></div>
    </div>
    <button id="retry-btn">다시 시험 보기</button>
  </div>

  <!-- TEACHER DASHBOARD SCREEN -->
  <div id="teacher-screen" class="hidden">
    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">학생 시험 결과 (전체)</div>
      <div id="teacher-loading" style="font-size:13px; color:#888780;">불러오는 중...</div>
      <div id="teacher-table-wrap" style="overflow-x:auto;"></div>
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;">학부모 주간 리포트 (최근 7일)</div>
      <div id="weekly-loading" style="font-size:13px; color:#888780;">불러오는 중...</div>
      <div id="weekly-report-wrap"></div>
    </div>

    <button id="back-to-setup-btn" class="secondary">학생 화면으로 돌아가기</button>
  </div>
</div>

// Populate day picker (전체 옵션 포함)
const daySelect = document.getElementById('day-select');
function dayLabel(d) {
  if (d === 'all') return '전체';
  if (d === 'wrong') return '오답복습';
  return 'DAY ' + String(d).padStart(2, '0');
}
function wrongbankKey() { return 'seoldae_wrongbank_hackers_jh_pilsu'; }
function getWrongbank() {
  try { return JSON.parse(localStorage.getItem(wrongbankKey()) || '[]'); } catch (e) { return []; }
}
function saveToWrongbank(words) {
  try {
    let bank = getWrongbank();
    words.forEach(w => {
      if (!bank.some(b => b.eng === w.eng)) bank.push({eng: w.eng, kor: w.kor, kor_full: w.kor_full || w.kor});
    });
    bank = bank.slice(-160);
    localStorage.setItem(wrongbankKey(), JSON.stringify(bank));
  } catch (e) {}
}
(function(){
  const list = document.getElementById('dayList');
  let firstDay = null;
  let totalWords = 0;
  for (let d = 1; d <= 40; d++) {
    if (VOCA[d] && VOCA[d].length > 0) {
      if (firstDay === null) firstDay = d;
      totalWords += VOCA[d].length;
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'DAY ' + String(d).padStart(2, '0');
      b.dataset.day = d;
      b.onclick = () => selectDay(d);
      list.appendChild(b);
    }
  }
  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.textContent = '전체\n' + totalWords + '개';
  allBtn.dataset.day = 'all';
  allBtn.onclick = () => selectDay('all');
  list.appendChild(allBtn);
  if (firstDay !== null) selectDay(firstDay);
})();
function selectDay(d) {
  daySelect.value = d;
  const count = d === 'all' ? Object.values(VOCA).flat().length : (VOCA[d] ? VOCA[d].length : 0);
  document.getElementById('dayBtn').textContent = dayLabel(d) + ' (' + count + '개)';
  document.querySelectorAll('#dayList button').forEach(btn => btn.classList.toggle('active', btn.dataset.day == d));
  closeDayModal();
}
function openDayModal() {
  document.getElementById('dayModal').classList.remove('hidden');
  const active = document.querySelector('#dayList button.active');
  if (active && active.scrollIntoView) active.scrollIntoView({block: 'center'});
}
function closeDayModal() {
  document.getElementById('dayModal').classList.add('hidden');
}
document.getElementById('dayBtn').addEventListener('click', openDayModal);
document.getElementById('dayModalClose').addEventListener('click', closeDayModal);
document.getElementById('dayModal').addEventListener('click', (e) => { if (e.target.id === 'dayModal') closeDayModal(); });


// ===== 단어 듣기 (TTS) =====
let listenState = { day: null, idx: 0, words: [], autoplayTimer: null };

function speakWord(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  const speedEl = document.getElementById('listen-speed');
  utter.rate = speedEl ? parseFloat(speedEl.value) : 0.8;
  window.speechSynthesis.speak(utter);
}

function renderListenWord() {
  const w = listenState.words[listenState.idx];
  if (!w) return;
  document.getElementById('listen-progress').textContent =
    (listenState.idx + 1) + ' / ' + listenState.words.length;
  document.getElementById('listen-word').textContent = w.eng;
  document.getElementById('listen-kor').textContent = w.kor;
  speakWord(w.eng);

  if (listenState.autoplayTimer) clearTimeout(listenState.autoplayTimer);
  const autoplay = document.getElementById('listen-autoplay').checked;
  if (autoplay) {
    listenState.autoplayTimer = setTimeout(() => {
      if (listenState.idx < listenState.words.length - 1) {
        listenState.idx++;
        renderListenWord();
      }
    }, 2200);
  }
}

function resetListenTimerForCurrent() {
  if (listenState.autoplayTimer) clearTimeout(listenState.autoplayTimer);
  const autoplay = document.getElementById('listen-autoplay').checked;
  if (autoplay) {
    listenState.autoplayTimer = setTimeout(() => {
      if (listenState.idx < listenState.words.length - 1) {
        listenState.idx++;
        renderListenWord();
      }
    }, 2200);
  }
}

document.getElementById('listen-btn').addEventListener('click', () => {
  const day = parseInt(daySelect.value);
  if (!day || !VOCA[day]) return;
  listenState.day = day;
  listenState.idx = 0;
  listenState.words = VOCA[day];
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('listen-screen').classList.remove('hidden');
  renderListenWord();
});

document.getElementById('listen-replay-btn').addEventListener('click', () => {
  const w = listenState.words[listenState.idx];
  if (!w) return;
  speakWord(w.eng);
  resetListenTimerForCurrent();
});

document.getElementById('listen-next-btn').addEventListener('click', () => {
  if (listenState.idx < listenState.words.length - 1) {
    listenState.idx++;
    renderListenWord();
  }
});

document.getElementById('listen-prev-btn').addEventListener('click', () => {
  if (listenState.idx > 0) {
    listenState.idx--;
    renderListenWord();
  }
});

document.getElementById('listen-done-btn').addEventListener('click', () => {
  if (listenState.autoplayTimer) clearTimeout(listenState.autoplayTimer);
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.getElementById('listen-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
});

function addKorSynonyms(set, value) {
  const v = cleanBasicKor(value);
  if (!v) return;
  for (const group of KOR_SYNONYM_GROUPS) {
    const cleaned = group.map(cleanBasicKor);
    if (cleaned.includes(v)) cleaned.forEach(x => set.add(x));
  }
}

function synonymMatch(a, b) {
  const na = normEng(a), nb = normEng(b);
  if (na === nb) return true;
  for (const group of SYNONYM_GROUPS) if (group.includes(na) && group.includes(nb)) return true;
  return false;
}
function cleanBasicKor(str) {
  return String(str || '')
    .toLowerCase()
    .replace(/[\(\)\[\]\{\}<>~.,·…;:!?"“”‘’'`]/g, '')
    .replace(/[0-9]+\s*\.?/g, '')
    .replace(/\s+/g, '')
    .trim();
}
function stripParticles(str) {
  let s = String(str || '');
  const particles = ['에서','에게','으로','부터','까지','처럼','을','를','이','가','은','는','의','에','로','와','과','도','만'];
  particles.forEach(p => { s = s.split(p).join(''); });
  return s;
}
function regularizeKorPhrase(str) {
  let s = cleanBasicKor(str);
  const out = new Set([s, stripParticles(s)]);
  Array.from(out).forEach(x => {
    out.add(x.replace(/말을하다/g,'말하다').replace(/잠을자다/g,'잠자다').replace(/춤을추다/g,'춤추다').replace(/수다를떨다/g,'수다떨다').replace(/길을잃/g,'길잃'));
  });
  Array.from(out).forEach(x => out.add(stripParticles(x)));
  return Array.from(out).filter(Boolean);
}
function splitMeaningParts(full) {
  const raw = String(full || '');
  const parts = new Set([raw]);
  const bracketRe = /[\[\(]([^\]\)]+)[\]\)]/g;
  let m;
  while ((m = bracketRe.exec(raw))) parts.add(m[1]);
  raw.replace(/[\[\(]/g, ',').replace(/[\]\)]/g, ',')
     .split(/[\/;,，、]|\d+\s*\./)
     .forEach(x => { if (x.trim()) parts.add(x.trim()); });
  return Array.from(parts);
}
function korCandidates(full, eng) {
  const set = new Set();
  splitMeaningParts(full).forEach(part => {
    regularizeKorPhrase(part).forEach(v => {
      if (v) set.add(v);
      if (v.length >= 2) {
        set.add(v.replace(/하다$/,''));
        set.add(v.replace(/되다$/,''));
        set.add(v.replace(/있는$/,''));
      }
    });
  });
  const text = cleanBasicKor(full);
  if (/입|신|쓰|끼|걸치/.test(text)) ['입다','신다','쓰다','끼다','걸치다','입고','신고','쓰고','끼고'].forEach(x=>set.add(x));
  if (text.includes('수다')) ['수다떨다','수다'].forEach(x=>set.add(x));
  if (text.includes('담소')) ['담소나누다','담소'].forEach(x=>set.add(x));
  if (text.includes('길') && text.includes('잃')) ['길잃은','길잃다','잃은'].forEach(x=>set.add(x));
  const e = normEng(eng);
  if (NUMBER_WORDS[e]) NUMBER_WORDS[e].forEach(x => set.add(cleanBasicKor(x)));
  Array.from(set).forEach(v => addKorSynonyms(set, v));
  addEngSpecificKorSynonyms(set, eng);
  return Array.from(set).filter(Boolean);
}
function korMeaningMatch(userAns, full, eng) {
  const e = normEng(eng);
  const userVars = regularizeKorPhrase(userAns);
  if (!userVars.length) return false;
  if (STRICT_PRONOUNS[e]) {
    const allowed = STRICT_PRONOUNS[e].map(cleanBasicKor);
    return userVars.some(u => allowed.includes(u));
  }
  const cands = korCandidates(full, eng);
  for (const u of userVars) {
    for (const c of cands) {
      if (!u || !c) continue;
      if (u === c) return true;
      if (u.length === 1 || c.length === 1) {
        if (u === c && ONE_CHAR_OK.has(u)) return true;
        continue;
      }
      if (u.length >= 2 && c.length >= 2 && (c.includes(u) || u.includes(c))) return true;
    }
  }
  return false;
}
function checkKor(input, full, eng) { return korMeaningMatch(input, full, eng || ''); }

function gradeAnswerV22(opts){

function gradingReasonLabel(reason){

function buildQueue(day, mode) {
  let words;
  if (mode === 'wrong') {
    words = getWrongbank();
  } else if (day === 'all') {
    words = Object.values(VOCA).flat();
  } else {
    words = VOCA[day];
  }
  const queue = [];
  (words || []).forEach(w => {
    const direction = mode === 'e2k' ? 'e2k' : mode === 'k2e' ? 'k2e' : (Math.random() < 0.5 ? 'e2k' : 'k2e');
    queue.push({eng: w.eng, kor: w.kor, korFull: w.kor_full, direction: direction, isRetry: false});
  });
  // shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function nextQuestion() {
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('correct-answer').classList.add('hidden');
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('submit-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  state.answered = false;

  if (state.queue.length === 0) {
    showResult();
    return;
  }

  state.current = state.queue.shift();
  const completed = state.total - state.queue.length - 1;
  const retryCount = state.queue.filter(q => q.isRetry).length + (state.current.isRetry ? 1 : 0);

  document.getElementById('progress-text').textContent =
    `${dayLabel(state.day)}  ·  ${completed + 1} / ${state.total}` +
    (state.current.isRetry ? '  (오답 재시험)' : '');

  if (state.current.direction === 'e2k') {
    document.getElementById('q-hint').textContent = '뜻을 한글로 쓰세요';
    document.getElementById('q-word').textContent = state.current.eng;
    try{__sdSpeak(state.current.eng,.78)}catch(e){}
  } else {
    document.getElementById('q-hint').textContent = '영어 단어를 쓰세요';
    document.getElementById('q-word').textContent = state.current.kor;
  }
  document.getElementById('answer-input').focus();
}

function checkAnswer() {
  if (state.answered) return;
  const userAns = document.getElementById('answer-input').value;
  const c = state.current;
  const correctDisplay = (c.direction === 'e2k') ? c.korFull : c.eng;
  const grade = gradeAnswer({direction: c.direction, userAnswer: userAns, eng: c.eng, korFull: c.korFull});
  const isCorrect = !!grade.correct; const sdPosMismatch = (grade.reason==='pos-mismatch');
  try{document.getElementById('answer-input')?.blur()}catch(e){};try{window.__sdPrimeAudio&&window.__sdPrimeAudio();window.__sdSpeakNow(c.eng,.86)}catch(e){};

  state.answered = true;
  if (!state.attemptLog) state.attemptLog = [];
  state.attemptLog.push({eng: c.eng, direction: c.direction, userAnswer: userAns, correct: isCorrect, reason: grade.reason, label: gradingReasonLabel(grade.reason), isRetry: !!c.isRetry});

  const feedbackEl = document.getElementById('feedback');
  const correctEl = document.getElementById('correct-answer');

  if (isCorrect) {
    feedbackEl.textContent = grade.label && grade.label !== '정답' ? '정답입니다! (' + grade.label + ')' : '정답입니다!';
    feedbackEl.className = 'feedback correct';
    if (!c.isRetry) state.correctCount++;
  } else {
    feedbackEl.textContent = '오답입니다.';
    feedbackEl.className = 'feedback wrong';
    correctEl.innerHTML = '정답: ' + correctDisplay + '<br><span style="font-size:12px;color:#aaa;">(다른 단어를 썼다면 의미는 맞을 수 있어도, 이 단어장에서는 위 단어를 외워주세요)</span>';
    correctEl.classList.remove('hidden');
    const key = c.eng + '|' + c.kor;
    if (!state.wrongWords.some(w => w.key === key)) {
      state.wrongWords.push({key: key, eng: c.eng, kor: c.korFull});
    }
    if (!state.everWrong) state.everWrong = [];
    if (!state.everWrong.some(w => w.eng === c.eng)) {
      state.everWrong.push({eng: c.eng, kor: c.korFull});
    }
    state.queue.push({...c, isRetry: true});
    state.total++;
  }

  if (isCorrect && c.isRetry) {
    const key = c.eng + '|' + c.kor;
    state.wrongWords = state.wrongWords.filter(w => w.key !== key);
  }

  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');

  const delay = isCorrect ? 700 : 1400;
  setTimeout(() => {
    if (state.answered) nextQuestion();
  }, delay);
}

function buildStudyRecommendation(wrongWords, attemptLog, day, percent) {
  const wrongList = (wrongWords || []).map(w => w.eng || w).filter(Boolean);
  const firstWrong = (attemptLog || []).filter(a => !a.isRetry && a.correct === false).map(a => a.eng).filter(Boolean);
  const seen = new Set();
  const reviewWords = [];
  firstWrong.concat(wrongList).forEach(w => {
    if (w && !seen.has(w)) { seen.add(w); reviewWords.push(w); }
  });
  const similarCount = (attemptLog || []).filter(a => a.reason === 'similar-wordbook').length;
  const partialCount = (attemptLog || []).filter(a => a.reason === 'partial-meaning').length;
  const strictWrongCount = (attemptLog || []).filter(a => String(a.reason || '').indexOf('strict') >= 0 && a.correct === false).length;
  let lines = '\n[추천복습]\n';
  if (reviewWords.length > 0) {
    lines += '1순위 오답 복습: ' + reviewWords.slice(0, 12).join(', ') + '\n';
    if (reviewWords.length > 12) lines += '추가 오답: ' + reviewWords.slice(12).join(', ') + '\n';
    lines += '추천 DAY: ' + dayLabel(day) + ' 다시 복습\n';
  } else {
    lines += '1순위 오답 복습: 없음\n';
    lines += '추천 DAY: 다음 DAY 진행 가능\n';
  }
  if (percent < 70) lines += '학습 권장: 오늘 DAY 전체를 다시 암기한 뒤 재시험\n';
  else if (percent < 90) lines += '학습 권장: 오답 단어 중심으로 5분 복습 후 재시험\n';
  else lines += '학습 권장: 오답만 짧게 확인하고 다음 DAY 진행\n';
  lines += '선생님 확인: 유사어 인정 ' + similarCount + '개 / 부분의미 인정 ' + partialCount + '개 / 대명사·엄격오답 ' + strictWrongCount + '개\n';
  return lines;
}

function showResult() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const originalTotal = state.originalTotal;
  const score = state.correctCount;
  const percent = Math.round((score / originalTotal) * 100);

  document.getElementById('result-name').textContent = state.studentName + ' 학생';
  document.getElementById('result-score').textContent = score + ' / ' + originalTotal;
  document.getElementById('result-detail').textContent =
    `${dayLabel(state.day)} 단어시험  ·  정답률 ${percent}%  ·  ` +
    (state.wrongWords.length > 0 ? `최종 오답 ${state.wrongWords.length}개` : '전부 통과!');

  // Wrong list
  const wrongListEl = document.getElementById('wrong-list');
  const wrongContainer = document.getElementById('wrong-list-container');
  if (state.wrongWords.length === 0) {
    wrongContainer.classList.add('hidden');
  } else {
    wrongContainer.classList.remove('hidden');
    wrongListEl.innerHTML = '';
    state.wrongWords.forEach(w => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<span class="w">${w.eng}</span><span class="k">${w.kor}</span>`;
      wrongListEl.appendChild(div);
    });
  }

  // Build report text
  const now = new Date();
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  let report = `[설대영어 단어시험 결과]\n`;
  report += `이름: ${state.studentName}\n`;
  report += `날짜: ${dateStr}\n`;
  report += `DAY: ${dayLabel(state.day)}\n`;
  report += `점수: ${score} / ${originalTotal} (${percent}%)\n`;
  if (state.wrongWords.length > 0) {
    report += `오답 단어: ` + state.wrongWords.map(w => w.eng).join(', ') + `\n`;
  } else {
    report += `오답 없음 - 완벽합니다!\n`;
  }
  report += buildStudyRecommendation(state.wrongWords, state.attemptLog || [], state.day, percent);
  document.getElementById('result-text').value = report;

  // "저장된 오답만" 모드를 위한 로컬 오답 누적 저장 (세션 중 한 번이라도 틀린 단어 전체)
  if (state.everWrong && state.everWrong.length > 0) saveToWrongbank(state.everWrong);

  // 자동 기록: shared storage에 저장
  saveResultToStorage({
    name: state.studentName,
    day: state.day,
    date: dateStr,
    timestamp: now.toISOString(),
    score: score,
    total: originalTotal,
    percent: percent,
    wrongWords: state.wrongWords.map(w => w.eng),
    attemptLog: state.attemptLog || [],
    engineVersion: SEOLDAE_ENGINE_VERSION
  });
}

async function loadWeeklyReport() {
  const loadingEl = document.getElementById('weekly-loading');
  const wrapEl = document.getElementById('weekly-report-wrap');
  loadingEl.textContent = '불러오는 중...';
  wrapEl.innerHTML = '';

  try {
    const listResult = await window.storage.list('result:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];

    if (keys.length === 0) {
      loadingEl.textContent = '아직 기록된 시험 결과가 없습니다.';
      return;
    }

    const records = [];
    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (res && res.value) {
          records.push(JSON.parse(res.value));
        }
      } catch (err) {}
    }

    // 최근 7일 필터
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    const recent = records.filter(r => new Date(r.timestamp) >= weekAgo);

    if (recent.length === 0) {
      loadingEl.textContent = '최근 7일간 시험 기록이 없습니다.';
      return;
    }

    // 학생별 그룹화
    const byStudent = {};
    recent.forEach(r => {
      if (!byStudent[r.name]) byStudent[r.name] = [];
      byStudent[r.name].push(r);
    });

    loadingEl.textContent = `${Object.keys(byStudent).length}명의 학생 (최근 7일)`;

    const dateRangeStr = `${formatDate(weekAgo)} ~ ${formatDate(now)}`;

    let html = '';
    Object.keys(byStudent).sort().forEach(name => {
      const studentRecords = byStudent[name].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const totalTests = studentRecords.length;
      const avgPercent = Math.round(studentRecords.reduce((sum, r) => sum + r.percent, 0) / totalTests);
      const days = studentRecords.map(r => dayLabel(r.day)).join(', ');

      // 공통 오답 단어 (2회 이상 틀린 단어)
      const wrongCount = {};
      studentRecords.forEach(r => {
        (r.wrongWords || []).forEach(w => {
          wrongCount[w] = (wrongCount[w] || 0) + 1;
        });
      });
      const repeatedWrong = Object.keys(wrongCount).filter(w => wrongCount[w] >= 2);

      // 리포트 텍스트 생성

    });

(function(){
  let seq=0, voice=null, lastText='', lastAt=0;

  function clean(t){
    return String(t||'').replace(/[~…]/g,' ').replace(/\s+/g,' ').trim();
  }
  function pickVoice(){
    try{
      if(!('speechSynthesis' in window))return null;
      const vs=window.speechSynthesis.getVoices()||[];
      const pref=['Google US English','Samsung English (United States)','Samantha','Ava','Allison','Susan','Karen','Moira','Microsoft Aria','Microsoft Jenny','English United States'];
      voice=vs.find(v=>/^en-US/i.test(v.lang)&&pref.some(n=>String(v.name).toLowerCase().includes(n.toLowerCase())))
        ||vs.find(v=>/^en-US/i.test(v.lang))
        ||vs.find(v=>/^en-/i.test(v.lang))
        ||vs.find(v=>/^en/i.test(v.lang))
        ||null;
      return voice;
    }catch(e){return null}
  }
  function reset(){
    try{
      if(!('speechSynthesis' in window))return;
      const s=window.speechSynthesis;
      try{s.cancel()}catch(e){}
      try{s.resume()}catch(e){}
    }catch(e){}
  }
  function robustSpeak(text,rate){
    try{
      if(!('speechSynthesis' in window))return false;
      const s=window.speechSynthesis, t=clean(text);
      if(!t)return false;
      const now=Date.now();
      if(t===lastText && now-lastAt<450)return true; // 중복 이벤트의 이중 발음 방지
      lastText=t; lastAt=now;
      const my=++seq;
      pickVoice();
      try{
        if(s.speaking||s.pending||s.paused)s.cancel();
        s.resume();
      }catch(e){}
      let began=false;
      function make(){
        const u=new SpeechSynthesisUtterance(t);
        u.lang='en-US'; u.rate=Number(rate)||.80; u.pitch=1; u.volume=1;
        const v=voice||pickVoice(); if(v)u.voice=v;
        u.onstart=()=>{if(my===seq)began=true;};
        u.onerror=()=>{
          if(my!==seq)return;
          setTimeout(()=>{
            if(my!==seq)return;
            try{reset();pickVoice();s.speak(make())}catch(e){}
          },140);
        };
        return u;
      }
      s.speak(make());
      [300,900].forEach(ms=>setTimeout(()=>{
        if(my!==seq||began)return;
        try{
          if(!s.speaking&&!s.pending){
            try{s.resume()}catch(e){}
            pickVoice(); s.speak(make());
          }
        }catch(e){}
      },ms));
      return true;
    }catch(e){return false}
  }

  window.__sdSpeak=robustSpeak;
  window.__sdTtsReset=reset;
  window.__sdTtsPrime=pickVoice;

  try{
    if(typeof window.speak==='function')window.speak=t=>robustSpeak(t,.80);
    if(typeof window.speakEnglish==='function')window.speakEnglish=t=>robustSpeak(t,.78);

        const e=document.getElementById('listen-speed')||document.getElementById('speed');

    };
  }catch(e){}

  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.onvoiceschanged=pickVoice;

    }
  }catch(e){}

/* === SEOLDAE SOUND CHECK BOOST v4 ===
   SpeechSynthesis volume is fixed at the browser maximum (1.0).
   A longer, clearer phrase is used so students can verify media volume.
*/
(function(){
  function sdRunLoudSoundCheck(btn,diag){
    try{
      if(!('speechSynthesis' in window)){
        if(diag)diag.textContent='이 기기에서는 음성 기능을 사용할 수 없습니다. Chrome · Safari · Samsung Internet에서 다시 열어주세요.';
        return;
      }
      try{ if(window.__sdTtsReset) window.__sdTtsReset(); }catch(e){}
      if(diag)diag.textContent='소리를 확인하는 중입니다. 작게 들리면 휴대폰의 미디어 음량을 올려주세요.';
      if(btn)btn.disabled=true;
      setTimeout(function(){
        try{
          if(window.__sdSpeak) window.__sdSpeak('Hello! Hello! Sound check.',.92);
          else {
            const u=new SpeechSynthesisUtterance('Hello! Hello! Sound check.');
            u.lang='en-US'; u.rate=.92; u.pitch=1.0; u.volume=1.0;
            window.speechSynthesis.speak(u);
          }
        }catch(e){}
      },60);
      setTimeout(function(){
        if(btn)btn.disabled=false;
        if(diag)diag.textContent='Hello가 잘 들렸다면 준비 완료입니다. 소리가 작으면 기기의 미디어 음량을 더 올려주세요.';
      },1750);
    }catch(e){
      if(btn)btn.disabled=false;
      if(diag)diag.textContent='소리 재생에 실패했습니다. 브라우저를 다시 열고 확인해 주세요.';
    }
  }

  function installSoundCheck(){
    let old=document.getElementById('soundTestBtn');
    if(old){
      /* 기존 버튼의 오래된 이벤트를 제거하기 위해 같은 모양의 새 버튼으로 교체 */
      const fresh=old.cloneNode(true);
      fresh.textContent='🔊 소리 확인';
      old.parentNode.replaceChild(fresh,old);
      let diag=document.getElementById('soundDiag');
      if(!diag){
        diag=document.createElement('div');
        diag.id='soundDiag';
        diag.className='small';
        diag.style.marginTop='7px';
        fresh.insertAdjacentElement('afterend',diag);
      }
      fresh.addEventListener('click',function(){sdRunLoudSoundCheck(fresh,diag)});
      return;
    }

    const setup=document.getElementById('setup')||document.getElementById('setup-screen');
    if(!setup)return;
    const card=setup.querySelector('.card')||setup;
    const wrap=document.createElement('div');
    wrap.className='sd-sound-check-wrap';
    wrap.style.marginTop='12px';

    const btn=document.createElement('button');
    btn.type='button';
    btn.id='soundTestBtn';
    btn.className='secondary light';
    btn.textContent='🔊 소리 확인';
    btn.style.width='100%';

    const diag=document.createElement('div');
    diag.id='soundDiag';
    diag.className='small';
    diag.style.marginTop='7px';
    diag.textContent='시험 전 소리가 잘 들리는지 확인하세요.';

    wrap.appendChild(btn);
    wrap.appendChild(diag);
    card.appendChild(wrap);

/* === SEOLDAE POST-ANSWER AUDIO GUARANTEE v5 ===
   iPhone/Safari 대응:
   1) 답 제출 탭 이벤트 안에서 즉시 TTS 실행
   2) 다음 문제로 넘어가기 전 발음 시간을 충분히 확보
   3) 제출 후 '🔊 정답 발음' 버튼을 보여 수동 재생도 가능
*/
(function(){
  function activeEnglish(){
    try{
      if(typeof appState!=='undefined' && appState && appState.queue && typeof appState.idx==='number'){
        const q=appState.queue[appState.idx]; if(q){const it=q.item||q; return it.eng||q.eng||'';}
      }
    }catch(e){}
    try{
      if(typeof state!=='undefined' && state && state.current){
        return (state.current.item&&state.current.item.eng)||state.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof app!=='undefined' && app && app.current){
        return (app.current.item&&app.current.item.eng)||app.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof current!=='undefined' && current){
        return (current.item&&current.item.eng)||current.eng||'';
      }
    }catch(e){}
    return '';
  }

  function answerSubmitted(){
    try{
      if(typeof appState!=='undefined' && appState) return !!appState.answered;
      if(typeof state!=='undefined' && state) return !!state.answered;
      if(typeof app!=='undefined' && app) return !!app.answered;
      if(typeof answered!=='undefined') return !!answered;
    }catch(e){}
    return false;
  }

  function ensure(){
    let b=document.getElementById('sdAnswerSpeakBtn');
    if(b)return b;
    b=document.createElement('button');
    b.id='sdAnswerSpeakBtn';
    b.type='button';
    b.textContent='🔊 정답 발음';
    b.style.cssText='display:none;margin:10px auto 0;padding:9px 14px;border-radius:10px;font-size:14px;width:auto;min-width:110px;';
    b.addEventListener('click',function(ev){
      ev.preventDefault(); ev.stopPropagation();
      const eng=activeEnglish();
      if(eng){try{window.__sdSpeak(eng,.86)}catch(e){}}
    });
    const fb=document.getElementById('feedback')||document.getElementById('fb');
    if(fb&&fb.parentNode)fb.parentNode.insertBefore(b,fb.nextSibling);
    else document.body.appendChild(b);
    return b;
  }

  function refresh(){
    const b=ensure();
    const eng=activeEnglish();
    b.style.display=(answerSubmitted()&&eng)?'block':'none';
  }

  function install(){
    refresh();
    const mo=new MutationObserver(refresh);
    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','disabled','readonly']});
    document.addEventListener('click',function(){setTimeout(refresh,0)},true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();








/* === SEOLDAE TTS CORE v13 — FAST START / STALL RECOVERY ===
   목적:
   - therapist처럼 평범한 단어도 음성이 늦게 시작되거나 무음이 되는 현상 방지
   - 가능하면 기기 내장(localService) 영어 음성을 우선 사용
   - pending 상태가 오래 걸리면 자동으로 stale queue를 정리하고 재시도
   - 괄호/대괄호가 있는 학습용 표제어는 실제 발음형으로 변환
*/
(function(){
  if(!('speechSynthesis' in window)) return;

  const synth = window.speechSynthesis;
  let voice = null;
  let held = [];
  let seq = 0;

  function spokenHeadword(raw){
    let s=String(raw||'').trim();
    if(!s) return s;

    /* judg(e)ment -> judgement */
    s=s.replace(/([A-Za-z])\(([A-Za-z]+)\)(?=[A-Za-z])/g,'$1$2');

    /* 선택 요소는 자연스러운 대표형으로 */
    s=s.replace(/\(to\)/gi,' to ')
       .replace(/\(with\)/gi,' with ')
       .replace(/\(for\)/gi,' for ')
       .replace(/\(up\)/gi,' up ')
       .replace(/\(also\)/gi,' also ');

    /* arrive at[in] -> arrive at / until[up to] now -> until now */
    s=s.replace(/([A-Za-z]+)\[([A-Za-z ]+)\]/g,'$1');

    /* 학습용 기호 정리 */
    s=s.replace(/[()[\]]/g,' ')
       .replace(/[~…]/g,' ')
       .replace(/\s+/g,' ')
       .trim();
    return s;
  }

  function pickVoice(){
    try{
      const vs=synth.getVoices()||[];
      const english=vs.filter(v=>/^en(?:-|$)/i.test(v.lang||''));
      const local=english.filter(v=>v.localService===true);

      voice =
        local.find(v=>/^en-US$/i.test(v.lang) && /Samantha|Ava|Siri|Microsoft|English/i.test(v.name)) ||
        local.find(v=>/^en-US/i.test(v.lang)) ||
        local[0] ||
        english.find(v=>/^en-US$/i.test(v.lang) && /Samantha|Ava|Siri|Google|Microsoft|English/i.test(v.name)) ||
        english.find(v=>/^en-US/i.test(v.lang)) ||
        english[0] ||
        null;
    }catch(e){ voice=null; }
    return voice;
  }

  function hold(u){
    held.push(u);
    if(held.length>18) held=held.slice(-18);
    const done=function(){
      const i=held.indexOf(u);
      if(i>=0) held.splice(i,1);
    };
    u.onend=done;
    u.onerror=done;
  }

  function makeUtt(text,rate,useVoice){
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';
    u.rate=Number(rate)||0.86;
    u.pitch=1.0;
    u.volume=1.0;
    if(useVoice){
      const v=voice||pickVoice();
      if(v) u.voice=v;
    }
    hold(u);
    return u;
  }

  function prime(){
    try{
      synth.resume();
      pickVoice();
      if(!synth.speaking && !synth.pending){
        const u=new SpeechSynthesisUtterance('');
        u.lang='en-US'; u.rate=1; u.volume=1;
        hold(u);
        synth.speak(u);
      }
      return true;
    }catch(e){ return false; }
  }

  function launch(text,rate,mySeq,useVoice,retryLevel){
    if(mySeq!==seq) return false;
    let started=false;
    let u;
    try{
      synth.resume();
      u=makeUtt(text,rate,useVoice);
      const oldEnd=u.onend, oldErr=u.onerror;

      u.onstart=function(){ started=true; };
      u.onend=function(ev){ started=true; if(oldEnd) oldEnd.call(this,ev); };
      u.onerror=function(ev){ if(oldErr) oldErr.call(this,ev); };

      synth.speak(u);
    }catch(e){ return false; }

    const wait = retryLevel===0 ? 420 : 900;
    setTimeout(function(){
      if(mySeq!==seq) return;

      /* 실제로 시작했거나 현재 말하고 있으면 건드리지 않는다. */
      if(started || synth.speaking) return;

      /* pending만 오래 지속되는 경우가 therapist 같은 '한참 뒤 발음'의 핵심 원인 */
      try{ synth.cancel(); }catch(e){}
      try{ synth.resume(); }catch(e){}

      if(retryLevel===0){
        /* 첫 재시도: 짧게 비운 뒤 같은 로컬 영어 음성 */
        setTimeout(function(){
          if(mySeq!==seq) return;
          launch(text,rate,mySeq,true,1);
        },110);
      }else if(retryLevel===1){
        /* 두 번째 재시도: 특정 voice 지정 없이 브라우저 기본 영어 TTS 사용 */
        setTimeout(function(){
          if(mySeq!==seq) return;
          launch(text,rate,mySeq,false,2);
        },130);
      }
    },wait);
    return true;
  }

  function speakNow(raw,rate){
    const text=spokenHeadword(raw);
    if(!text) return false;
    const mySeq=++seq;
    try{
      /* v17: 모바일 Safari에서는 사용자 탭 이벤트 안에서 speak()가 즉시 호출되어야 한다.
         cancel() 뒤 setTimeout으로 미루면 사용자 활성화가 풀려 무음이 될 수 있다. */
      synth.resume();
      pickVoice();
      try{ synth.cancel(); }catch(e){}
      const u=makeUtt(text,rate,true);
      let started=false;
      u.onstart=function(){ started=true; };
      synth.speak(u);
      /* 드문 stalled queue만 보조 재시도. 정상 재생 중이면 절대 취소하지 않는다. */
      setTimeout(function(){
        if(mySeq!==seq || started || synth.speaking) return;
        try{ synth.cancel(); synth.resume(); }catch(e){}
        try{ synth.speak(makeUtt(text,rate,false)); }catch(e){}
      },700);
      return true;
    }catch(e){ return false; }
  }

  function reset(){
    seq++;
    try{
      if(synth.pending && !synth.speaking) synth.cancel();
      synth.resume();
      pickVoice();
    }catch(e){}
  }

  window.__sdSpokenHeadword=spokenHeadword;
  window.__sdPrimeAudio=prime;
  window.__sdSpeak=speakNow;
  window.__sdSpeakNow=speakNow;
  window.__sdSpeakFresh=speakNow;
  window.__sdTtsReset=reset;
  window.__sdTtsPrime=pickVoice;
  window.SEOLDAE_TTS_VERSION='13-fast-start';

  try{
    synth.onvoiceschanged=pickVoice;
    pickVoice();
    setTimeout(pickVoice,80);
    setTimeout(pickVoice,400);
    setTimeout(pickVoice,1200);
  }catch(e){}

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) reset();
  });
  window.addEventListener('pageshow',reset);

  /* 시험 시작/확인/다시듣기 등의 실제 터치 순간 TTS 세션을 미리 깨운다. */
  document.addEventListener('pointerdown',function(ev){
    const b=ev.target&&ev.target.closest?ev.target.closest('button'):null;
    if(!b) return;
    const txt=(b.textContent||'').trim();
    if(/확인|제출|시험 시작|시작|다시 듣기|정답 발음|소리 확인/.test(txt) ||
       /submit|start|sound|speak/i.test(b.id||'')){
      prime();
    }
  },true);

  /* 오답 다시 듣기 */
  document.addEventListener('click',function(ev){
    const b=ev.target&&ev.target.closest?ev.target.closest('.sd-wrong-speak'):null;
    if(!b) return;
    ev.preventDefault();
    ev.stopPropagation();
    const eng=(b.dataset.eng||'').trim();
    if(eng){
      try{
        const a=document.activeElement;
        if(a&&/INPUT|TEXTAREA/.test(a.tagName)) a.blur();
      }catch(e){}
      prime();
      speakNow(eng,0.86);
    }
  },true);

    ['꾸준한','일관된','한결같은','변함없는','지속적인'],
    ['증가','증대','늘어남'],
    ['감소','감축','줄어듦'],
    ['허용','용인'],
    ['관대한','너그러운','아량있는'],
    ['사례','경우','보기','예'],
    ['곤경','고통','괴로움','고난'],
    ['설립','설치','창립','설정'],
    ['엄격하게','엄하게','철저하게'],
    ['강렬하게','격렬하게','강하게'],
    ['근처','인근','가까운곳','가까이','주변'],
    ['해외','외국'],
    ['아픔','통증','고통'],
    ['고치다','수리하다','수선하다'],
    ['도움','도움이되다','유익','유익하다','이롭다'],
    ['계속하다','지속하다','이어가다'],
    ['건너뛰다','생략하다','거르다'],
    ['증가하다','늘다','늘어나다','증대하다'],
    ['감소하다','줄다','줄어들다','감축하다']
  ];

  const ENG_GROUPS = [
    ['begin','start'],['big','large','huge','giant'],['small','little','tiny'],
    ['fast','quick','rapid'],['happy','glad','pleased'],['sad','unhappy'],
    ['buy','purchase'],['show','display'],['talk','speak','chat'],['answer','reply','respond'],
    ['finish','end','complete'],['gift','present'],['kid','child'],['scared','afraid','frightened'],
    ['angry','mad'],['choose','select','pick'],['fix','repair'],['ill','sick'],
    ['shop','store'],['photo','picture'],['trip','travel','journey']
  ];

  function normEng(s){
    return String(s||'').toLowerCase().normalize('NFKC')
      .replace(/[’‘]/g,"'").replace(/[~…]/g,' ')
      .replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  }
  function cleanKor(s){
    return String(s||'').toLowerCase().normalize('NFKC')
      .replace(/\b\d+\s*\./g,'')
      .replace(/[(){}\[\]<>~_＿－—–\-ㆍ·․….,;:!?，。"'“”‘’`]/g,'')
      .replace(/\s+/g,'').trim();
  }

  function dropInnerParticles(s){
    let x=cleanKor(s);
    PARTICLES.forEach(p=>{
      const re=new RegExp(p+'(?=[가-힣])','g');
      x=x.replace(re,'');
    });
    return x;
  }

  /* [ ]를 두 가지 실제 표현으로 펼친다.
     감명[감동]을 받은 -> 감명을 받은 / 감동을 받은
     해외에[로] -> 해외에 / 해외로
     외국에[으로] -> 외국에 / 외국으로
     소비[소모]하다 -> 소비하다 / 소모하다 */
  function expandSquare(raw){
    let out=[String(raw||'')];
    for(let guard=0;guard<10;guard++){
      let changed=false, next=[];
      out.forEach(str=>{
        const m=str.match(/\[([^\]]+)\]/);
        if(!m){ next.push(str); return; }
        changed=true;
        const idx=m.index, whole=m[0], inside=m[1];
        const before=str.slice(0,idx), after=str.slice(idx+whole.length);
        const alts=inside.split(/[\/,，;、]/).map(x=>x.trim()).filter(Boolean);
        /* 원래 표기(괄호 부분 삭제) */
        next.push(before+after);

        const wm=before.match(/([가-힣]+)$/);
        const word=wm?wm[1]:'';
        const prefix=wm?before.slice(0,before.length-word.length):before;
        alts.forEach(alt=>{
          let repl;
          if(word && alt.length<=2 && PARTICLE_LAST.has(word.slice(-1))){
            repl=word.slice(0,-1)+alt;              // 해외에[로]
          }else if(word && alt==='으로' && word.endsWith('에')){
            repl=word.slice(0,-1)+alt;              // 외국에[으로]
          }else if(word){
            repl=alt;                               // 감명[감동], 소비[소모]
          }else{
            repl=alt;
          }
          next.push(prefix+repl+after);
        });
      });
      out=[...new Set(next)];
      if(!changed) break;
    }
    return out;
  }

  function stripParenNotes(s){
    /* 괄호 안은 보충설명인 경우가 많으므로 '있는 버전/없는 버전'을 모두 만든다. */
    const raw=String(s||'');
    const a=raw.replace(/\([^)]*\)/g,' ');
    const b=raw.replace(/[()]/g,' ');
    return [a,b];
  }

  function splitMeanings(full){
    let set=new Set();
    expandSquare(full).forEach(v=>{
      stripParenNotes(v).forEach(x=>{
        if(x.trim()) set.add(x.trim());
        x.split(/[\/,;,，、]|\d+\s*\./).forEach(p=>{
          p=p.trim(); if(!p) return; set.add(p);
          /* OCR/원자료에서 품사 뜻 사이 구분자가 빠진 경우:
             '쑤시다 아픔', '나가다 출구'처럼 -다 뒤 새 뜻을 분리한다. */
          const m=p.match(/^(.+?다)\s+(.+)$/);
          if(m){ set.add(m[1].trim()); set.add(m[2].trim()); }
        });
      });
    });
    return [...set];
  }

  function posOfKor(raw){
    const s=cleanKor(raw);
    if(!s) return null;
    if(/(하다|되다|시키다|주다|받다|먹다|가다|오다|보다|듣다|읽다|쓰다|말하다|돕다|잃다|얻다|만들다)$/.test(s)) return 'verb';
    if(/(받은|되는|된|하는|한|있는|없는|로운|스러운|적인|같은|많은|적은|좋은|나쁜|큰|작은|긴|짧은|높은|낮은|빠른|느린|의)$/.test(s)) return 'adj';
    if(/(하게|히|없이|도록|적으로|에서|으로|로|에)$/.test(s)) return 'adv';
    return 'noun';
  }

  function forms(raw){
    const c=cleanKor(raw);
    const set=new Set();
    if(!c) return [];
    set.add(c);
    set.add(dropInnerParticles(c));
    /* 한국어 의미어근 후보:
       근처의 / 근처에 / 근처에서 → 근처
       해외의 / 해외에 / 해외로 → 해외
       단, 최종 판정에서는 기존 품사 안전장치를 유지한다. */
    let stem=c;
    for(const pt of PARTICLES){
      if(stem.length>pt.length+1 && stem.endsWith(pt)){
        stem=stem.slice(0,-pt.length);
        break;
      }
    }
    if(stem.length>=2) set.add(stem);
    set.add(c.replace(/(을|를)(?=받은|하는|하다|되다|된|시키다)/g,''));
    set.add(c.replace(/(이|가|은|는)(?=있는|없는|되는|된|하다|하는)/g,''));
    /* 하다류는 명사어근도 후보로 보존하되, 최종 판정에서 품사를 확인한다. */
    if(c.length>=3){
      set.add(c.replace(/하다$/,''));
      set.add(c.replace(/되다$/,''));
      set.add(c.replace(/시키다$/,''));
      /* 활용형 표면문자열이 달라도 핵심 의미어근을 후보로 보존 */
      set.add(c.replace(/(받은|되는|된|하는|한|있는|없는|로운|스러운|적인|같은|많은|적은|좋은|나쁜|큰|작은|긴|짧은|높은|낮은|빠른|느린)$/,''));
    }
    return [...set].filter(Boolean);
  }

  function canonKor(s){
    let x=dropInnerParticles(s);
    for(let i=0;i<KOR_GROUPS.length;i++){
      const g=KOR_GROUPS[i];
      for(let j=0;j<g.length;j++){
        const k=cleanKor(g[j]);
        if(x===k) return '#g'+i;
        if(k.length>=2 && x.indexOf(k)>=0) return x.replace(k,'#g'+i);
      }
    }
    return x;
  }

  function meaningCandidates(full,eng){
    const set=new Set();
    splitMeanings(full).forEach(part=>forms(part).forEach(v=>set.add(v)));
    const e=normEng(eng);
    if(NUMS[e]) NUMS[e].forEach(v=>set.add(cleanKor(v)));

    /* 기존 앱에 이미 구축된 보조 유의어 사전도 가져오되,
       4.0의 동일한 정규화 규칙을 거친다. */
    try{
      const dicts=[
        (typeof SD22_SYNONYM_KOR!=='undefined'?SD22_SYNONYM_KOR:null),
        (typeof KOR_SYNONYMS!=='undefined'?KOR_SYNONYMS:null),
        (typeof EXACT_KOR_EXTRA!=='undefined'?EXACT_KOR_EXTRA:null),
        (typeof SD_EXTRA_KOR_SYNONYMS_V8!=='undefined'?SD_EXTRA_KOR_SYNONYMS_V8:null),
        (typeof SD_CROSSBOOK_KOR!=='undefined'?SD_CROSSBOOK_KOR:null),
        (typeof SD41_CROSSBOOK_KOR!=='undefined'?SD41_CROSSBOOK_KOR:null),
        (typeof SD41_APPROVED_KOR!=='undefined'?SD41_APPROVED_KOR:null)
      ].filter(Boolean);
      dicts.forEach(d=>{
        const arr=d[e]||[];
        (Array.isArray(arr)?arr:[arr]).forEach(v=>forms(v).forEach(x=>set.add(x)));
      });
    }catch(e){}
    return [...set].filter(Boolean);
  }

  function posSetFromMeaning(full){
    const set=new Set();
    splitMeanings(full).forEach(x=>{
      const p=posOfKor(x);
      if(p) set.add(p);
    });
    return set;
  }

  function koreanGrade(userAnswer,full,eng){
    const userForms=forms(userAnswer);
    if(!userForms.length) return {correct:false,reason:'blank',label:'미입력'};

    const e=normEng(eng);
    if(STRICT_PRONOUNS[e]){
      const allowed=[];
      STRICT_PRONOUNS[e].forEach(v=>forms(v).forEach(x=>allowed.push(x)));
      const ok=userForms.some(u=>allowed.includes(u));
      return {correct:ok,reason:ok?'strict-pronoun':'strict-pronoun-wrong',label:ok?'정답':'대명사 형태가 다릅니다'};
    }

    const candidates=meaningCandidates(full,eng);

    /* 1. 정확/조사·띄어쓰기 차이 */
    for(const u of userForms){
      for(const c of candidates){
        if(!u||!c) continue;
        if(u===c) return {correct:true,reason:'exact',label:'정답'};
      }
    }

    /* 2. 의미군 동의어. 품사가 맞을 때만 인정 */
    const userPos=posOfKor(userAnswer);
    const targetPos=posSetFromMeaning(full);
    for(const u of userForms){
      const cu=canonKor(u);
      for(const c of candidates){
        if(!c) continue;
        if(cu===canonKor(c) && (!userPos || targetPos.size===0 || targetPos.has(userPos))){
          return {correct:true,reason:'semantic-synonym',label:'유사한 뜻 정답'};
        }
      }
    }

    /* 3. 너무 짧은 어근의 무분별한 부분일치는 금지.
          3글자 이상이고 품사가 맞는 경우에만 자연스러운 포함관계 인정 */
    for(const u of userForms){
      for(const c of candidates){
        if(!u||!c) continue;
        if(u.length>=3 && c.length>=3 && (u.includes(c)||c.includes(u))){
          if(!userPos || targetPos.size===0 || targetPos.has(userPos)){
            return {correct:true,reason:'meaning-contained',label:'의미 정답'};
          }
        }
        if(SHORT_OK.has(u) && u===c) return {correct:true,reason:'short-exact',label:'정답'};
      }
    }

    /* 4. 학생이 쓴 답의 품사와 원뜻의 품사가 명백히 다르면 따로 안내 */
    if(userPos && targetPos.size===1 && !targetPos.has(userPos)){
      return {correct:false,reason:'pos-mismatch',label:'품사가 다릅니다'};
    }

    return {correct:false,reason:'wrong',label:'오답'};
  }

  function englishGrade(userAnswer,eng){
    const u=normEng(userAnswer), e=normEng(eng);
    if(!u) return {correct:false,reason:'blank',label:'미입력'};
    if(u===e) return {correct:true,reason:'exact',label:'정답'};
    for(const g of ENG_GROUPS){
      const gg=g.map(normEng);
      if(gg.includes(u)&&gg.includes(e)) return {correct:true,reason:'english-synonym',label:'영어 유의어 정답'};
    }
    return {correct:false,reason:'wrong',label:'오답'};
  }

  function grade(opts){
    opts=opts||{};
    const direction=opts.direction||opts.type||'';
    if(direction==='k2e') return englishGrade(opts.userAnswer||opts.answer||'',opts.eng||'');
    return koreanGrade(opts.userAnswer||opts.answer||'',opts.korFull||opts.kor_full||opts.kor||'',opts.eng||'');
  }

  window.SEOLDAE_ENGINE_VERSION='4.1';
  window.SEOLDAE_GRADE_V41=grade;
  window.SEOLDAE_KOR_CANDIDATES_V41=meaningCandidates;
})();


function gradeAnswer(opts){ return window.SEOLDAE_GRADE_V41(opts); }





</script>
