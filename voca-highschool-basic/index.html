const $=id=>document.getElementById(id);let state={day:'1',mode:'mix',count:'all',queue:[],current:null,originalTotal:0,firstTry:0,wrongWords:[],everWrong:[],name:'',locked:false,listenList:[],listenIdx:0};
const LS_GUIDE='sd_voca_guide_dismissed_v1', LS_WRONG='sd_voca_wrongbank_ne_high_basic_v1';
function show(id){['setup','listen','quiz','result','teacher'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function dayLabel(d){return d==='all'?'전체 DAY':(d==='wrong'?'저장된 오답':'DAY '+String(d).padStart(2,'0'));}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function baseWords(){if(state.day==='all')return Object.keys(VOCA).sort((a,b)=>+a-+b).flatMap(d=>VOCA[d].map(w=>({...w,day:d})));return (VOCA[state.day]||[]).map(w=>({...w,day:state.day}));}
function getWrongBank(){try{return JSON.parse(localStorage.getItem(LS_WRONG)||'[]');}catch(e){return[];}}
function saveWrongBank(items){let old=getWrongBank();let map=new Map(old.map(x=>[x.eng.toLowerCase(),x]));items.forEach(x=>map.set(x.eng.toLowerCase(),{eng:x.eng,kor:x.kor,kor_full:x.kor_full,day:x.day}));localStorage.setItem(LS_WRONG,JSON.stringify(Array.from(map.values()).slice(-160)));}
function buildQueue(){let words=state.mode==='wrong'?getWrongBank():baseWords(); if(!words.length)return []; let q=[]; words.forEach(w=>{let t=state.mode==='mix'?(Math.random()<.5?'e2k':'k2e'):(state.mode==='wrong'?(Math.random()<.5?'e2k':'k2e'):state.mode); q.push({...w,type:t,isRetry:false});}); shuffle(q); if(state.count!=='all')q=q.slice(0,Math.min(+state.count,q.length)); return q;}
function normEng(s){return String(s||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function normKor(s){return String(s||'').toLowerCase().replace(/[()\[\]{}<>~·•]/g,' ').replace(/[.,;:!?"'“”‘’]/g,' ').replace(/\s+/g,'').replace(/(을|를|이|가|은|는|의|에|에서|에게|으로|로|와|과|도|만|까지|부터)$/,'').replace(/자격이있다/g,'자격있다').replace(/수다를떨다/g,'수다떨다').replace(/말을하다/g,'말하다').replace(/잠을자다/g,'잠자다').replace(/춤을추다/g,'춤추다');}
function splitKor(s){let t=String(s||'').replace(/\([^)]*\)/g,' ').replace(/[\[\]]/g,',').replace(/[;\/]/g,',').replace(/ 또는 | 혹은 | 및 /g,',');return t.split(',').map(x=>normKor(x)).filter(Boolean);}

(function(){

    try{

        ||vs.find(v=>/^en-US/i.test(v.lang))
        ||vs.find(v=>/^en-/i.test(v.lang))
        ||vs.find(v=>/^en/i.test(v.lang))
        ||null;
      return voice;
    }catch(e){return null}
  }
  function reset(){
    try{
      if(!('speechSynthesis' in window))return;
      const s=window.speechSynthesis;
      try{s.cancel()}catch(e){}
      try{s.resume()}catch(e){}
    }catch(e){}
  }
  function robustSpeak(text,rate){
    try{
      if(!('speechSynthesis' in window))return false;
      const s=window.speechSynthesis, t=clean(text);
      if(!t)return false;

      if(t===lastText && now-lastAt<450)return true; // 중복 이벤트의 이중 발음 방지
      lastText=t; lastAt=now;
      const my=++seq;
      pickVoice();
      try{
        if(s.speaking||s.pending||s.paused)s.cancel();
        s.resume();
      }catch(e){}

        u.lang='en-US'; u.rate=Number(rate)||.80; u.pitch=1; u.volume=1;
        const v=voice||pickVoice(); if(v)u.voice=v;

          if(my!==seq)return;

            if(my!==seq)return;
            try{reset();pickVoice();s.speak(make())}catch(e){}
          },140);
        };

      }

        if(my!==seq||began)return;

          if(!s.speaking&&!s.pending){

          }

      const b=document.createElement('button');
      b.type='button';
      b.className='sd-wrong-speak';
      b.textContent='🔊 다시 듣기';
      b.setAttribute('aria-label',eng+' 발음 다시 듣기');
      b.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        try{window.__sdSpeak(eng,.78)}catch(e){}
      });
      row.appendChild(b);
    });
  }

  function install(){
    const submitIds=['submitBtn','submit-btn','checkBtn','check-btn'];
    submitIds.forEach(function(id){
      const b=document.getElementById(id);
      if(b&&!b.dataset.sdPronHook){
        b.dataset.sdPronHook='1';
        b.addEventListener('click',postSubmitPronounce);
      }
    });
    decorateWrongItems(document);
    const obs=new MutationObserver(function(ms){
      let need=false;
      ms.forEach(m=>{if(m.addedNodes&&m.addedNodes.length)need=true});
      if(need)decorateWrongItems(document);
    });
    obs.observe(document.body,{childList:true,subtree:true});
    document.querySelectorAll('#dayList button,#day-list button,[data-day]').forEach(function(b){
      b.addEventListener('click',function(){try{window.__sdTtsReset()}catch(e){}});
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();

/* === SEOLDAE SOUND CHECK BOOST v4 ===
   SpeechSynthesis volume is fixed at the browser maximum (1.0).
   A longer, clearer phrase is used so students can verify media volume.
*/
(function(){
  function sdRunLoudSoundCheck(btn,diag){
    try{
      if(!('speechSynthesis' in window)){
        if(diag)diag.textContent='이 기기에서는 음성 기능을 사용할 수 없습니다. Chrome · Safari · Samsung Internet에서 다시 열어주세요.';
        return;
      }
      try{ if(window.__sdTtsReset) window.__sdTtsReset(); }catch(e){}
      if(diag)diag.textContent='소리를 확인하는 중입니다. 작게 들리면 휴대폰의 미디어 음량을 올려주세요.';
      if(btn)btn.disabled=true;
      setTimeout(function(){
        try{
          if(window.__sdSpeak) window.__sdSpeak('Hello! Hello! Sound check.',.92);
          else {
            const u=new SpeechSynthesisUtterance('Hello! Hello! Sound check.');
            u.lang='en-US'; u.rate=.92; u.pitch=1.0; u.volume=1.0;
            window.speechSynthesis.speak(u);
          }
        }catch(e){}
      },60);
      setTimeout(function(){
        if(btn)btn.disabled=false;
        if(diag)diag.textContent='Hello가 잘 들렸다면 준비 완료입니다. 소리가 작으면 기기의 미디어 음량을 더 올려주세요.';
      },1750);
    }catch(e){
      if(btn)btn.disabled=false;
      if(diag)diag.textContent='소리 재생에 실패했습니다. 브라우저를 다시 열고 확인해 주세요.';
    }
  }

  function installSoundCheck(){
    let old=document.getElementById('soundTestBtn');
    if(old){
      /* 기존 버튼의 오래된 이벤트를 제거하기 위해 같은 모양의 새 버튼으로 교체 */
      const fresh=old.cloneNode(true);
      fresh.textContent='🔊 소리 확인';
      old.parentNode.replaceChild(fresh,old);
      let diag=document.getElementById('soundDiag');
      if(!diag){
        diag=document.createElement('div');
        diag.id='soundDiag';
        diag.className='small';
        diag.style.marginTop='7px';
        fresh.insertAdjacentElement('afterend',diag);
      }
      fresh.addEventListener('click',function(){sdRunLoudSoundCheck(fresh,diag)});
      return;
    }

    const setup=document.getElementById('setup')||document.getElementById('setup-screen');
    if(!setup)return;
    const card=setup.querySelector('.card')||setup;
    const wrap=document.createElement('div');
    wrap.className='sd-sound-check-wrap';
    wrap.style.marginTop='12px';

    const btn=document.createElement('button');
    btn.type='button';
    btn.id='soundTestBtn';
    btn.className='secondary light';
    btn.textContent='🔊 소리 확인';
    btn.style.width='100%';

    const diag=document.createElement('div');
    diag.id='soundDiag';
    diag.className='small';
    diag.style.marginTop='7px';
    diag.textContent='시험 전 소리가 잘 들리는지 확인하세요.';

    wrap.appendChild(btn);
    wrap.appendChild(diag);
    card.appendChild(wrap);
    btn.addEventListener('click',function(){sdRunLoudSoundCheck(btn,diag)});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installSoundCheck);
  else installSoundCheck();
})();



/* === SEOLDAE POST-ANSWER AUDIO GUARANTEE v5 ===
   iPhone/Safari 대응:
   1) 답 제출 탭 이벤트 안에서 즉시 TTS 실행
   2) 다음 문제로 넘어가기 전 발음 시간을 충분히 확보
   3) 제출 후 '🔊 정답 발음' 버튼을 보여 수동 재생도 가능
*/
(function(){
  function activeEnglish(){
    try{
      if(typeof appState!=='undefined' && appState && appState.queue && typeof appState.idx==='number'){
        const q=appState.queue[appState.idx]; if(q){const it=q.item||q; return it.eng||q.eng||'';}
      }
    }catch(e){}
    try{
      if(typeof state!=='undefined' && state && state.current){
        return (state.current.item&&state.current.item.eng)||state.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof app!=='undefined' && app && app.current){
        return (app.current.item&&app.current.item.eng)||app.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof current!=='undefined' && current){
        return (current.item&&current.item.eng)||current.eng||'';
      }
    }catch(e){}
    return '';
  }

  function answerSubmitted(){
    try{
      if(typeof appState!=='undefined' && appState) return !!appState.answered;
      if(typeof state!=='undefined' && state) return !!state.answered;
      if(typeof app!=='undefined' && app) return !!app.answered;
      if(typeof answered!=='undefined') return !!answered;
    }catch(e){}
    return false;
  }

  function ensure(){
    let b=document.getElementById('sdAnswerSpeakBtn');
    if(b)return b;
    b=document.createElement('button');
    b.id='sdAnswerSpeakBtn';
    b.type='button';
    b.textContent='🔊 정답 발음';
    b.style.cssText='display:none;margin:10px auto 0;padding:9px 14px;border-radius:10px;font-size:14px;width:auto;min-width:110px;';
    b.addEventListener('click',function(ev){
      ev.preventDefault(); ev.stopPropagation();
      const eng=activeEnglish();
      if(eng){try{window.__sdSpeak(eng,.86)}catch(e){}}
    });
    const fb=document.getElementById('feedback')||document.getElementById('fb');
    if(fb&&fb.parentNode)fb.parentNode.insertBefore(b,fb.nextSibling);
    else document.body.appendChild(b);
    return b;
  }

  function refresh(){
    const b=ensure();
    const eng=activeEnglish();
    b.style.display=(answerSubmitted()&&eng)?'block':'none';
  }

  function install(){
    refresh();
    const mo=new MutationObserver(refresh);
    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','disabled','readonly']});
    document.addEventListener('click',function(){setTimeout(refresh,0)},true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();



/* === SEOLDAE RESULT WRONG-WORD MANUAL AUDIO FIX v6 ===
   결과화면 '다시 듣기'는 반드시 학생의 실제 탭 이벤트 안에서
   브라우저 SpeechSynthesis를 직접 호출한다.
*/
(function(){
  function sdPickManualVoice(){
    try{
      const vs=window.speechSynthesis.getVoices()||[];
      return vs.find(v=>/^en-US/i.test(v.lang))
        ||vs.find(v=>/^en-/i.test(v.lang))
        ||vs.find(v=>/^en/i.test(v.lang))
        ||null;
    }catch(e){return null}
  }

  function sdManualSpeak(text){
    const t=String(text||'').replace(/[~…]/g,' ').replace(/\s+/g,' ').trim();
    if(!t)return false;
    try{
      if(!('speechSynthesis' in window))return false;
      const s=window.speechSynthesis;
      try{s.cancel()}catch(e){}
      try{s.resume()}catch(e){}
      const u=new SpeechSynthesisUtterance(t);
      u.lang='en-US';
      u.rate=.86;
      u.pitch=1.0;
      u.volume=1.0;
      const v=sdPickManualVoice();
      if(v)u.voice=v;
      s.speak(u);
      return true;
    }catch(e){
      try{
        if(window.__sdSpeak)return window.__sdSpeak(t,.86);
      }catch(x){}
      return false;
    }
  }
  window.__sdManualSpeak=sdManualSpeak;

  function getWrongEnglish(btn){
    const row=btn.closest('.wrong-item');
    if(!row)return '';
    const el=row.querySelector('.w')||row.querySelector('b')||row.querySelector('strong');
    return el ? String(el.textContent||'').trim() : '';
  }

  /* 기존 v2 버튼의 이벤트보다 먼저 잡아서 직접 재생 */
  document.addEventListener('click',function(ev){
    const btn=ev.target && ev.target.closest ? ev.target.closest('.sd-wrong-speak') : null;
    if(!btn)return;
    ev.preventDefault();
    ev.stopPropagation();
    if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();
    const eng=getWrongEnglish(btn);
    sdManualSpeak(eng);
  },true);

  /* 결과화면이 다시 그려질 때 버튼이 빠진 경우를 즉시 보완 */
  function ensureWrongButtons(){
    document.querySelectorAll('.wrong-item').forEach(function(row){
      let b=row.querySelector('.sd-wrong-speak');
      if(!b){
        const word=row.querySelector('.w')||row.querySelector('b')||row.querySelector('strong');
        if(!word || !/[A-Za-z]/.test(String(word.textContent||'')))return;
        b=document.createElement('button');
        b.type='button';
        b.className='sd-wrong-speak';
        b.textContent='🔊 다시 듣기';
        row.appendChild(b);
      }
    });
  }

  function install(){
    ensureWrongButtons();
    const mo=new MutationObserver(function(){ensureWrongButtons()});
    mo.observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();
