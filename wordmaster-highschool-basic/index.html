function grade(o){o=o||{};const d=o.direction||o.type||'e2k',u0=String(o.userAnswer||'').trim(),e=nEng(o.eng||'');if(!u0)return{correct:false,blank:true,label:'정답을 입력한 뒤 확인을 눌러주세요.',reason:'blank'};if(d==='k2e'){const u=nEng(u0).replace(/[.?!,;:]+$/g,'');if(u===e)return{correct:true,label:'정답',reason:'exact_eng'};if(!strict(e)&&typeof V14_ENG_SYNONYMS!=='undefined')for(const q of V14_ENG_SYNONYMS){const g=q.map(nEng);if(g.includes(u)&&g.includes(e))return{correct:true,label:'정답',reason:'approved_eng_synonym'}}return{correct:false,label:'오답',reason:'eng_mismatch'}}const us=new Set;expand(u0).forEach(x=>forms(x).forEach(y=>us.add(y)));const cs=new Set(candidates(e,o.korFull,o.kor));for(const u of us)if(cs.has(u))return{correct:true,label:'정답',reason:'normalized_exact'};if(strict(e))return{correct:false,label:'오답',reason:'strict_mismatch'};for(const u of us)for(const c of cs)if(u&&c&&Math.min(u.length,c.length)>=2&&(u.includes(c)||c.includes(u)))return{correct:true,label:'정답',reason:'broad_partial'};return{correct:false,label:'오답',reason:'kor_mismatch'}}
function speakE2K(word){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(word||'').replace(/~/g,'').trim());u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
return{version:'16.0',grade,nEng,forms,expand,candidates,speakE2K};})();
