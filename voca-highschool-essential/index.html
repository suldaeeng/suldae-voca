<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>능률VOCA 고교필수편 단어시험</title>
<style>
:root{--main:#0f6e56;--bg:#f2f6f4;--card:#f8fbfa;--danger:#c0392b;--warn:#b8860b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1a2b26;touch-action:manipulation;}
body{padding-bottom:env(safe-area-inset-bottom,0);}
input,textarea,select,button{font-size:16px!important;}
.hidden{display:none!important;}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0));}
h1{font-size:19px;margin:4px 0 2px;color:var(--main);}
h2{font-size:15px;margin:0 0 16px;color:#5a6b66;font-weight:500;}
.card{background:var(--card);border:1px solid #e1e9e6;border-radius:14px;padding:18px;margin-bottom:14px;}
label{display:block;font-size:13px;color:#5a6b66;margin-bottom:6px;font-weight:600;}
input[type=text]{width:100%;padding:12px 14px;border:1px solid #cfd9d6;border-radius:10px;background:#fff;}
input[type=text]:focus{outline:2px solid var(--main);border-color:var(--main);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.seg{display:flex;background:#e9f1ee;border-radius:10px;padding:4px;gap:4px;}
.seg button{flex:1;padding:9px 6px;border:none;background:transparent;border-radius:8px;color:#5a6b66;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--main);color:#fff;}
button.big{width:100%;padding:14px;border:none;border-radius:12px;background:var(--main);color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:6px;}
button.big:disabled{opacity:.45;cursor:default;}
button.secondary{background:#e1e9e6;color:#2c3e3a;}
button.light{background:#fff;border:1px solid #cfd9d6;color:var(--main);}
.day-trigger{width:100%;padding:14px;border:1px solid #cfd9d6;border-radius:10px;background:#fff;text-align:left;font-weight:600;color:#1a2b26;cursor:pointer;}
.progress{height:6px;background:#dde8e4;border-radius:4px;overflow:hidden;margin-bottom:14px;}
.progress-bar{height:100%;background:var(--main);transition:width .25s;}
.qcard{background:#fff;border-radius:16px;padding:26px 20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;}
.word{font-size:26px;font-weight:800;color:#1a2b26;margin-bottom:8px;word-break:break-word;}
.kor{font-size:18px;color:#3c4a46;}
.direction-badge{display:inline-block;font-size:12px;background:#e9f1ee;color:var(--main);padding:3px 10px;border-radius:20px;margin-bottom:10px;font-weight:700;}
.feedback{min-height:22px;font-size:14px;text-align:center;margin:8px 0;font-weight:600;}
.feedback.good{color:var(--main);}
.feedback.bad{color:var(--danger);}
.answer-row{display:flex;gap:8px;}
.answer-row input{flex:1;}
.answer-row button{padding:12px 18px;border:none;border-radius:10px;background:var(--main);color:#fff;font-weight:700;}
.answer-row button:disabled{opacity:.45;}
.score-big{font-size:44px;font-weight:800;color:var(--main);text-align:center;margin:6px 0;}
.score-sub{text-align:center;color:#5a6b66;margin-bottom:18px;}
.wrong-list{max-height:220px;overflow-y:auto;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.wrong-item{padding:8px 0;border-bottom:1px solid #eef2f0;font-size:14px;}
.wrong-item:last-child{border-bottom:none;}
.wrong-item b{color:#1a2b26;}
textarea.resultbox{width:100%;min-height:150px;padding:12px;border:1px solid #cfd9d6;border-radius:10px;font-family:monospace;font-size:13px;background:#fff;}
.browser-guide{position:relative;background:#fff8e1;border:1px solid #f0dca0;color:#6b5a1e;font-size:12.5px;padding:10px 34px 10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.5;}
.guide-close{position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;color:#6b5a1e;cursor:pointer;padding:4px 8px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:999;}
.modal.hidden{display:none;}
.modal-inner{background:#fff;width:100%;max-height:78vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #eef2f0;font-weight:700;}
.modal-header button{background:none;border:none;font-size:15px;color:var(--main);font-weight:700;}
.modal-body{overflow-y:auto;padding:14px 18px 24px;}
.day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.day-grid button{padding:12px 4px;border:1px solid #dde8e4;background:#f8fbfa;border-radius:10px;font-weight:600;color:#1a2b26;cursor:pointer;}
.day-grid button.special{grid-column:span 4;background:#e9f1ee;color:var(--main);}
.day-grid button.sel{background:var(--main);color:#fff;border-color:var(--main);}
.footer-link{text-align:center;margin-top:16px;font-size:12.5px;color:#8fa39c;cursor:pointer;text-decoration:underline;}
table.teacher-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px;}
table.teacher-table th,table.teacher-table td{border:1px solid #e1e9e6;padding:6px 5px;text-align:center;}
table.teacher-table th{background:#e9f1ee;}
.score-good{color:var(--main);font-weight:700;}
.score-mid{color:var(--warn);font-weight:700;}
.score-bad{color:var(--danger);font-weight:700;}
.speed-seg button{font-size:13px;padding:8px 4px;}
.small-note{font-size:12px;color:#8fa39c;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">

<div class="browser-guide" id="browserGuide">
  <button id="guideClose" class="guide-close" aria-label="닫기">✕</button>
  📌 카카오톡 미리보기·문서뷰어에서는 저장/발음이 불안정할 수 있어요. Chrome·Safari로 열어주세요.
</div>

<!-- setup-screen -->
<section id="setup-screen">
  <h1>능률VOCA 고교필수편</h1>
  <h2>DAY 01~69 · 단어시험</h2>

  <div class="card">
    <label>이름</label>
    <input type="text" id="nameInput" placeholder="이름을 입력하세요">
  </div>

  <div class="card">
    <label>DAY 선택</label>
    <input type="hidden" id="day-select" value="01">
    <button type="button" id="dayBtn" class="day-trigger">DAY 01</button>
  </div>

  <div class="card">
    <label>시험 방식</label>
    <div class="seg" id="modeSeg">
      <button data-v="mix" class="active">영↔한 mix</button>
      <button data-v="e2k">영→한</button>
      <button data-v="k2e">한→영</button>
      <button data-v="wrongonly">저장된 오답만</button>
    </div>
  </div>

  <div class="card">
    <label>문항 수</label>
    <div class="seg" id="countSeg">
      <button data-v="all" class="active">DAY 전체</button>
      <button data-v="20">랜덤 20</button>
      <button data-v="30">랜덤 30</button>
      <button data-v="50">랜덤 50</button>
    </div>
  </div>

  <button type="button" class="big light" id="listenBtn">🔊 발음 먼저 듣기</button>
  <button type="button" class="big" id="startBtn">시험 시작</button>

  <div class="footer-link" id="teacherLink">선생님 모드</div>
</section>

<!-- listen-screen -->
<section id="listen-screen" class="hidden">
  <div class="progress"><div class="progress-bar" id="listenProgBar" style="width:0%"></div></div>
  <div id="listenProg" style="text-align:center;color:#5a6b66;font-size:13px;margin-bottom:10px;"></div>
  <div class="qcard">
    <div class="word" id="listenWord"></div>
    <div class="kor" id="listenKor"></div>
    <button id="speakBtn" type="button" class="light" style="margin-top:14px;width:auto;padding:10px 18px;">🔊 다시 듣기</button>
  </div>
  <div class="seg speed-seg" id="speedSeg">
    <button data-v="0.6">느리게</button>
    <button data-v="0.82" class="active">보통</button>
    <button data-v="1.0">빠르게</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <button id="prevBtn" type="button" class="secondary" style="flex:1;padding:12px;border:none;border-radius:10px;">◀ 이전</button>
    <button id="nextListenBtn" type="button" style="flex:1;padding:12px;border:none;border-radius:10px;background:var(--main);color:#fff;">다음 ▶</button>
  </div>
  <button id="backFromListenBtn" type="button" class="big secondary">돌아가기</button>
</section>

<!-- quiz-screen -->
<section id="quiz-screen" class="hidden">
  <div class="progress"><div class="progress-bar" id="quizProgBar" style="width:0%"></div></div>
  <div id="quizProg" style="text-align:center;color:#5a6b66;font-size:13px;margin-bottom:10px;"></div>
  <div class="qcard">
    <div class="direction-badge" id="directionBadge"></div>
    <div class="word" id="qWord"></div>
  </div>
  <div class="answer-row">
    <input type="text" id="answerInput" placeholder="정답 입력" autocomplete="off" autocapitalize="off" autocorrect="off">
    <button type="button" id="submitBtn">확인</button>
  </div>
  <div class="feedback" id="feedback"></div>
</section>

<!-- result-screen -->
<section id="result-screen" class="hidden">
  <h1 style="text-align:center;">시험 결과</h1>
  <div class="score-big" id="scoreBig">0 / 0</div>
  <div class="score-sub" id="scoreSub"></div>
  <div class="card">
    <label>오답 단어</label>
    <div class="wrong-list" id="wrongList"></div>
  </div>
  <div class="card">
    <label>카톡 복사용 결과</label>
    <textarea class="resultbox" id="resultText" readonly></textarea>
    <div class="small-note">복사 후 카카오톡에서 선생님께 붙여넣어 보내세요.</div>
  </div>
  <button type="button" class="big" id="copyBtn">📋 결과 복사하기</button>
  <button type="button" class="big secondary" id="retryWrongBtn">틀린 단어만 다시 풀기</button>
  <button type="button" class="big secondary" id="homeBtn">처음으로</button>
</section>

<!-- teacher-screen -->
<section id="teacher-screen" class="hidden">
  <h1>선생님 모드</h1>
  <div class="card">
    <label>학생 결과 붙여넣기 (여러 명 한번에 가능)</label>
    <textarea class="resultbox" id="teacherPaste" placeholder="학생이 보낸 결과 텍스트를 붙여넣으세요"></textarea>
    <button type="button" class="big" id="analyzeBtn">분석하기</button>
  </div>
  <div id="teacherResult"></div>
  <button type="button" class="big secondary" id="teacherBackBtn">돌아가기</button>
</section>

</div>

<!-- DAY bottom sheet -->
<div id="dayModal" class="modal hidden">
  <div class="modal-inner">
    <div class="modal-header"><span>DAY 선택 <span style="font-weight:400;font-size:12px;color:#8fa39c;">(여러 DAY 함께 선택 가능)</span></span><button id="dayModalClose" type="button">닫기</button></div>
    <div class="modal-body"><div id="dayList" class="day-grid"></div></div>
    <div style="padding:10px 18px 18px;border-top:1px solid #eef2f0;">
      <button type="button" id="dayConfirmBtn" class="big" style="margin-top:0;">선택 완료 (0개 DAY)</button>
    </div>
  </div>
</div>

<script>

function dayLabel(d){
  if(d==='all') return '전체 DAY';
  if(d==='wrong') return '저장된 오답';
  if(d==='wrong-retry') return '오답 재시험';
  if(Array.isArray(d)){
    const sorted = d.slice().sort((a,b)=>parseInt(a)-parseInt(b));
    if(sorted.length===1) return dayLabel(sorted[0]);
    let contiguous = true;
    for(let i=1;i<sorted.length;i++){
      if(parseInt(sorted[i]) !== parseInt(sorted[i-1])+1){ contiguous=false; break; }
    }
    if(contiguous) return `DAY ${sorted[0]}~${sorted[sorted.length-1]}`;
    if(sorted.length<=5) return 'DAY ' + sorted.join(',');
    return `DAY ${sorted.length}개 선택`;
  }
  return 'DAY ' + String(d).padStart(2,'0');
}

/* ================= 채점 엔진 ================= */
const PARTICLES = ["으로","에서","만큼","까지","부터","이나","라도","한테","께서","을","를","이","가","은","는","에","로","와","과","의","도","만"];

function stripTilde(s){ return s.replace(/[~～]/g,''); }

function expandBracketAlternatives(s){
  // "고발[고소]하다" -> ["고발하다","고소하다"]
  const m = s.match(/^(.*?)\[([^\]]+)\](.*)$/);
  if(!m) return [s];
  const [ , pre, alts, post ] = m;
  const altWords = alts.split(/[,\/·]/).map(x=>x.trim()).filter(Boolean);
  let results = [];
  const prevWord = pre.match(/([가-힣A-Za-z]+)$/);
  const prevMatch = prevWord ? prevWord[1] : '';
  for(const a of altWords){
    results.push((pre + a + post).trim());
  }
  results.push((pre + post).trim().replace(/\s{2,}/g,' '));
  return results;
}

function cleanKor(s){
  return stripTilde(s)
    .replace(/[()]/g,'')
    .replace(/[.．·…]/g,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}

function stripParticle(s){
  for(const p of PARTICLES){
    if(s.length>p.length && s.endsWith(p)) return s.slice(0, -p.length);
  }
  return s;
}

function splitMeanings(korFull){
  return korFull.split(/[;,、]|또는|혹은|및/).map(x=>x.trim()).filter(Boolean);
}

function buildCandidates(korFull){
  let cands = new Set();
  for(const seg of splitMeanings(korFull)){
    for(const alt of expandBracketAlternatives(seg)){
      const cleaned = cleanKor(alt);
      if(!cleaned) continue;
      cands.add(cleaned);
      const stripped = stripParticle(cleaned);
      if(stripped) cands.add(stripped);
    }
  }
  return Array.from(cands).filter(Boolean);
}

function isShortMeaningCase(candidates){
  return candidates.some(c=>c.length<=2);
}

function gradeE2K(item, userInput){
  const cleanedInput = stripParticle(cleanKor(userInput));
  if(!cleanedInput) return false;
  const candidates = buildCandidates(item.kor_full || item.kor);
  if(candidates.includes(cleanedInput)) return true;
  if(isShortMeaningCase(candidates)) return false;
  for(const c of candidates){
    if(c.length<2) continue;
    if(c.includes(cleanedInput) && cleanedInput.length>=2) return true;
    if(cleanedInput.includes(c) && c.length>=2) return true;
  }
  return false;
}

function normalizeEng(s){
  return s.toLowerCase().replace(/[.,!?'"]/g,'').replace(/\s{2,}/g,' ').trim();
}

const SYNONYM_GROUPS = [
  ['begin','start'],['show','display'],['buy','purchase']
];
function gradeK2E(item, userInput){
  const ans = normalizeEng(item.eng);
  const inp = normalizeEng(userInput);
  if(!inp) return false;
  if(inp===ans) return true;
  for(const grp of SYNONYM_GROUPS){
    if(grp.includes(ans) && grp.includes(inp)) return true;
  }
  return false;
}

    localStorage.setItem(LS_WRONGBANK, JSON.stringify(trimmed));
  }catch(e){}
}
function addToWrongbank(item){
  const bank = loadWrongbank();
  bank.push({eng:item.eng, kor:item.kor, kor_full:item.kor_full, day:item.day});
  saveWrongbank(bank);
}

/* ================= 큐 생성 ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function poolForDay(day){
  if(day==='all'){
    let all=[];
    for(const d of DAY_KEYS){
      VOCA[d].forEach(w=>all.push(Object.assign({day:d}, w)));
    }
    return all;
  }
  if(Array.isArray(day)){
    let all=[];
    day.forEach(d=>{
      (VOCA[d]||[]).forEach(w=>all.push(Object.assign({day:d}, w)));
    });
    return all;
  }
  return (VOCA[day]||[]).map(w=>Object.assign({day:day}, w));
}

function buildQueue(){
  let pool;
  if(state.mode==='wrongonly'){
    pool = loadWrongbank();
    if(pool.length===0){
      alert('저장된 오답이 없습니다. 먼저 일반 모드로 시험을 한 번 보세요.');
      return null;
    }
  } else {
    pool = poolForDay(state.day);
  }
  pool = shuffle(pool);
  if(state.count!=='all'){
    pool = pool.slice(0, parseInt(state.count));
  }
  const effectiveMode = (state.mode==='wrongonly') ? 'mix' : state.mode;
  return pool.map(w=>{
    let dir;
    if(effectiveMode==='mix') dir = Math.random()<0.5 ? 'e2k':'k2e';
    else dir = effectiveMode;
    return Object.assign({}, w, {direction:dir, isRetry:false});
  });
}

/* ================= 화면 전환 ================= */
function show(id){
  ['setup-screen','listen-screen','quiz-screen','result-screen','teacher-screen'].forEach(s=>{
    $(s).classList.toggle('hidden', s!==id);
  });
}

/* ================= 시험 시작/진행 ================= */
function startQuiz(){
  const name = $('nameInput').value.trim();
  if(!name){
    alert('이름을 입력한 뒤 시작해주세요.');
    return;
  }
  state.name = name;
  const q = buildQueue();
  if(!q) return;
  if(q.length===0){
    alert('출제할 단어가 없습니다.');
    return;
  }
  state.queue = q;
  state.originalTotal = q.length;
  state.idx = 0;
  state.firstTryCorrect = 0;
  state.everWrong = [];
  state.locked = false;
  state.answered = false;
  show('quiz-screen');
  renderQuestion();
}

function renderQuestion(){
  if(state.idx >= state.queue.length){
    showResult();
    return;
  }
  const item = state.queue[state.idx];
  $('quizProg').textContent = `${dayLabel(state.day)} · ${Math.min(state.idx+1,state.originalTotal)} / ${state.originalTotal}`;
  $('quizProgBar').style.width = Math.min(100, (state.idx/state.originalTotal)*100) + '%';
  $('directionBadge').textContent = item.direction==='e2k' ? '영어 → 한글 뜻' : '한글 뜻 → 영어';
  $('qWord').textContent = item.direction==='e2k' ? item.eng : item.kor;
  $('answerInput').value='';
  $('feedback').textContent='';
  $('feedback').className='feedback';
  unlockSubmit();
  $('answerInput').focus();
}

function lockSubmit(){
  state.locked = true;
  $('submitBtn').disabled = true;
  $('answerInput').readOnly = true;
}
function unlockSubmit(){
  state.locked = false;
  $('submitBtn').disabled = false;
  $('answerInput').readOnly = false;
}

function submitAnswer(){
  if(state.answered || state.locked) return;
  const ansInput = $('answerInput');
  const ans = ansInput.value.trim();
  if(!ans){
    $('feedback').textContent = '정답을 입력한 뒤 확인을 눌러주세요.';
    $('feedback').className = 'feedback bad';
    ansInput.focus();
    return;
  }
  lockSubmit();
  state.answered = true;
  const item = state.queue[state.idx];
  const correct = gradeAnswerV1(item, item.direction, ans);
  const correctDisplay = item.direction==='e2k' ? (item.kor) : item.eng;

  if(correct){
    $('feedback').textContent = '정답입니다! 🎉';
    $('feedback').className = 'feedback good';
    if(!item.isRetry) state.firstTryCorrect++;
    setTimeout(nextQuestion, 700);
  }else{
    $('feedback').textContent = `오답입니다. 정답: ${correctDisplay}`;
    $('feedback').className = 'feedback bad';
    if(!item.isRetry){
      state.everWrong.push(item);
      addToWrongbank(item);
    }
    state.queue.push(Object.assign({}, item, {isRetry:true}));
    setTimeout(nextQuestion, 1350);
  }
}

function nextQuestion(){
  state.idx++;
  state.answered = false;
  renderQuestion();
}

/* ================= 결과 화면 ================= */
function showResult(){
  show('result-screen');
  const pct = state.originalTotal>0 ? Math.round((state.firstTryCorrect/state.originalTotal)*100) : 0;
  $('scoreBig').textContent = `${state.firstTryCorrect} / ${state.originalTotal}`;
  $('scoreSub').textContent = `정답률 ${pct}%`;

  const uniqWrong = Array.from(new Map(state.everWrong.map(w=>[w.eng,w])).values());
  const wrongListEl = $('wrongList');
  if(uniqWrong.length===0){
    wrongListEl.innerHTML = '<div class="wrong-item">오답 없음 - 완벽합니다! 🏆</div>';
  }else{
    wrongListEl.innerHTML = uniqWrong.map(w=>`<div class="wrong-item"><b>${escapeHtml(w.eng)}</b> — ${escapeHtml(w.kor)}</div>`).join('');
  }

  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const wrongWordsStr = uniqWrong.length ? uniqWrong.map(w=>w.eng).join(', ') : '오답 없음 - 완벽합니다!';
  const resultStr = `[능률VOCA 고교필수편 단어시험 결과]
이름: ${state.name}
날짜: ${dateStr}
DAY: ${dayLabel(state.day)}
점수: ${state.firstTryCorrect} / ${state.originalTotal} (${pct}%)
오답 단어: ${wrongWordsStr}`;
  $('resultText').value = resultStr;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function copyResult(){
  const text = $('resultText').value.trim();
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    $('resultText').select();
    document.execCommand('copy');
  }
  alert('결과가 복사되었습니다. 카카오톡에서 선생님께 붙여넣어 보내세요.');
}

/* ================= 발음 듣기 ================= */
function prepareListen(){
  let pool = poolForDay(state.day);
  if(pool.length===0){ alert('들을 단어가 없습니다.'); return; }
  state.listenList = pool;
  state.listenIdx = 0;
  show('listen-screen');
  renderListen();
}
function renderListen(){
  const w = state.listenList[state.listenIdx];
  $('listenProg').textContent = `${dayLabel(state.day)} · ${state.listenIdx+1} / ${state.listenList.length}`;
  $('listenProgBar').style.width = ((state.listenIdx+1)/state.listenList.length*100)+'%';
  $('listenWord').textContent = w.eng;
  $('listenKor').textContent = w.kor;
  speak(w.eng);
}

/* ================= 선생님 모드 파싱 ================= */
function parseResults(text){
  const blocks = text.split(/(?=\[능률VOCA 고교필수편 단어시험 결과\])/).map(b=>b.trim()).filter(Boolean);
  const results = [];
  for(const b of blocks){
    if(!b.includes('[능률VOCA 고교필수편 단어시험 결과]')) continue;
    const nameM = b.match(/이름:\s*(.+)/);
    const dateM = b.match(/날짜:\s*(.+)/);
    const dayM = b.match(/DAY:\s*(.+)/);
    const scoreM = b.match(/점수:\s*(\d+)\s*\/\s*(\d+)\s*\((\d+)%\)/);
    const wrongM = b.match(/오답 단어:\s*(.+)/);
    if(!scoreM) continue;
    results.push({
      name: nameM ? nameM[1].trim() : '?',
      date: dateM ? dateM[1].trim() : '?',
      day: dayM ? dayM[1].trim() : '?',
      correct: parseInt(scoreM[1]), total: parseInt(scoreM[2]), pct: parseInt(scoreM[3]),
      wrong: wrongM ? wrongM[1].trim() : ''
    });
  }
  return results;
}

function analyze(){
  const raw = $('teacherPaste').value;
  const results = parseResults(raw);
  const el = $('teacherResult');
  if(results.length===0){
    el.innerHTML = '<div class="card">인식된 결과가 없습니다. 형식을 확인해주세요.</div>';
    return;
  }
  // 오답 빈도 분석
  const freq = {};
  results.forEach(r=>{
    if(r.wrong && !r.wrong.includes('완벽합니다')){
      r.wrong.split(',').map(x=>x.trim()).filter(Boolean).forEach(w=>{
        freq[w] = (freq[w]||0)+1;
      });
    }
  });
  const freqSorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,15);

  let rows = results.map(r=>{
    const cls = r.pct>=80?'score-good':(r.pct>=60?'score-mid':'score-bad');
    return `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.date)}</td><td>${escapeHtml(r.day)}</td><td class="${cls}">${r.correct}/${r.total} (${r.pct}%)</td></tr>`;
  }).join('');

  let freqRows = freqSorted.map(([w,c])=>`<tr><td>${escapeHtml(w)}</td><td>${c}</td></tr>`).join('');

  el.innerHTML = `
    <div class="card">
      <label>학생별 결과 (${results.length}명)</label>
      <table class="teacher-table"><thead><tr><th>이름</th><th>날짜</th><th>DAY</th><th>점수</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="card">
      <label>공통 오답 빈도 TOP 15</label>
      <table class="teacher-table"><thead><tr><th>단어</th><th>오답 횟수</th></tr></thead><tbody>${freqRows || '<tr><td colspan=2>오답 데이터 없음</td></tr>'}</tbody></table>
    </div>
  `;
}

/* ================= DAY 바텀시트 (다중 선택 지원) ================= */
let selectedDays = new Set(); // 임시 다중선택 상태 (모달 열려있는 동안만 사용)

function renderDayList(){
  const listEl = $('dayList');
  let html = '';
  html += `<button type="button" class="special" data-day="all">전체 DAY (1~69 총정리)</button>`;
  html += `<button type="button" class="special" data-day="wrong">저장된 오답만</button>`;
  for(const d of DAY_KEYS){
    html += `<button type="button" data-day="${d}">DAY ${String(d).padStart(2,'0')}</button>`;
  }
  listEl.innerHTML = html;

  listEl.querySelectorAll('button.special').forEach(btn=>{
    btn.onclick = ()=>{
      const d = btn.dataset.day;
      state.day = d;
      $('day-select').value = d;
      $('dayBtn').textContent = dayLabel(d);
      selectedDays.clear();
      $('dayModal').classList.add('hidden');
    };
  });

  listEl.querySelectorAll('button:not(.special)').forEach(btn=>{
    btn.onclick = ()=>{
      const d = btn.dataset.day;
      if(selectedDays.has(d)){
        selectedDays.delete(d);
        btn.classList.remove('sel');
      }else{
        selectedDays.add(d);
        btn.classList.add('sel');
      }
      updateDayConfirmBtn();
    };
  });
}

function updateDayConfirmBtn(){
  $('dayConfirmBtn').textContent = `선택 완료 (${selectedDays.size}개 DAY)`;
}

function openDayModal(){
  // 모달을 열 때 현재 state.day를 기준으로 선택 상태를 동기화
  selectedDays.clear();
  const listEl = $('dayList');
  listEl.querySelectorAll('button:not(.special)').forEach(b=>b.classList.remove('sel'));
  if(Array.isArray(state.day)){
    state.day.forEach(d=>selectedDays.add(d));
  }else if(state.day!=='all' && state.day!=='wrong'){
    selectedDays.add(state.day);
  }
  listEl.querySelectorAll('button:not(.special)').forEach(b=>{
    if(selectedDays.has(b.dataset.day)) b.classList.add('sel');
  });
  updateDayConfirmBtn();
  $('dayModal').classList.remove('hidden');
}

function confirmDaySelection(){
  if(selectedDays.size===0){
    alert('DAY를 하나 이상 선택해주세요.');
    return;
  }
  const arr = Array.from(selectedDays).sort((a,b)=>parseInt(a)-parseInt(b));
  state.day = arr.length===1 ? arr[0] : arr;
  $('day-select').value = arr.join(',');
  $('dayBtn').textContent = dayLabel(state.day);
  $('dayModal').classList.add('hidden');
}

/* ================= 이벤트 바인딩 ================= */
function bind(){
  if(localStorage.getItem(LS_GUIDE)) $('browserGuide').classList.add('hidden');
  $('guideClose').onclick = ()=>{
    $('browserGuide').classList.add('hidden');
    localStorage.setItem(LS_GUIDE,'1');
  };

  renderDayList();
  $('dayBtn').onclick = openDayModal;
  $('dayConfirmBtn').onclick = confirmDaySelection;
  $('dayModalClose').onclick = ()=>$('dayModal').classList.add('hidden');
  $('dayModal').onclick = e=>{ if(e.target.id==='dayModal') $('dayModal').classList.add('hidden'); };

  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.mode = b.dataset.v;
  });
  document.querySelectorAll('#countSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#countSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.count = b.dataset.v;
  });
  document.querySelectorAll('#speedSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#speedSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.speed = parseFloat(b.dataset.v);
    speak(state.listenList[state.listenIdx].eng);
  });

  $('listenBtn').onclick = prepareListen;
  $('startBtn').onclick = startQuiz;
  $('speakBtn').onclick = ()=>speak(state.listenList[state.listenIdx].eng);
  $('prevBtn').onclick = ()=>{ if(state.listenIdx>0){ state.listenIdx--; renderListen(); } };
  $('nextListenBtn').onclick = ()=>{ if(state.listenIdx<state.listenList.length-1){ state.listenIdx++; renderListen(); } else { show('setup-screen'); } };
  $('backFromListenBtn').onclick = ()=>{ speechSynthesis.cancel(); show('setup-screen'); };

  $('submitBtn').addEventListener('click', submitAnswer);
  $('answerInput').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); submitAnswer(); }
  });

  $('copyBtn').onclick = copyResult;
  $('retryWrongBtn').onclick = ()=>{
    const uniq = Array.from(new Map(state.everWrong.map(w=>[w.eng,w])).values());
    if(uniq.length===0){ alert('틀린 단어가 없습니다.'); return; }
    state.queue = uniq.map(w=>({...w, direction: Math.random()<0.5?'e2k':'k2e', isRetry:false}));
    state.originalTotal = state.queue.length;
    state.idx = 0; state.firstTryCorrect = 0; state.everWrong = []; state.answered=false;
    state.day = 'wrong-retry';
    show('quiz-screen');
    renderQuestion();
  };
  $('homeBtn').onclick = ()=>show('setup-screen');

  $('teacherLink').onclick = ()=>{
    const p = prompt('선생님 비밀번호를 입력하세요.');
    if(p === TEACHER_PW) show('teacher-screen');
  };
  $('analyzeBtn').onclick = analyze;
  $('teacherBackBtn').onclick = ()=>show('setup-screen');
}

document.addEventListener('DOMContentLoaded', bind);
</script>

/* ===== 단어 듣기 자동진행 패치 (제작가이드 §9-3 반영, 2026-07) ===== */
(function(){
  var listenAutoTimer=null, autoplayOn=true;
  function clearListenAutoTimer(){if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null}}
  function findListenNextBtn(){return document.getElementById('nextListenBtn')||document.getElementById('nextListenButton')||document.getElementById('listen-next-btn')}
  function findListenSection(){return document.getElementById('listen')||document.getElementById('listen-screen')}
  function scheduleListenAuto(){
    clearListenAutoTimer();
    if(!autoplayOn) return;
    var btn=findListenNextBtn(), sec=findListenSection();
    if(!btn||!sec||sec.classList.contains('hidden')) return;
    listenAutoTimer=setTimeout(function(){
      var s=findListenSection();
      if(s && !s.classList.contains('hidden')) btn.click();
    },2200);
  }
  function updateToggleLabel(toggle){toggle.textContent=autoplayOn?'⏸ 자동재생 정지':'▶ 자동재생 시작'}
  function attachAutoAdvance(){
    var sec=findListenSection(), btn=findListenNextBtn();
    if(!sec||!btn) return;
    var wordEl=sec.querySelector('.word');
    if(wordEl){
      var mo=new MutationObserver(function(){ if(!sec.classList.contains('hidden')) scheduleListenAuto(); });
      mo.observe(wordEl,{childList:true,characterData:true,subtree:true});
    }
    var mo2=new MutationObserver(function(){ if(!sec.classList.contains('hidden')) scheduleListenAuto(); else clearListenAutoTimer(); });
    mo2.observe(sec,{attributes:true, attributeFilter:['class']});
    sec.addEventListener('click', function(e){
      var id=(e.target && e.target.id)||'';
      if(/prev|next|speak/i.test(id)){ clearListenAutoTimer(); setTimeout(scheduleListenAuto,50); }
    });
    if(!document.getElementById('listenAutoToggle')){
      var toggle=document.createElement('button');
      toggle.type='button'; toggle.id='listenAutoToggle'; toggle.className='secondary';
      updateToggleLabel(toggle);
      toggle.onclick=function(){ autoplayOn=!autoplayOn; updateToggleLabel(toggle); if(autoplayOn) scheduleListenAuto(); else clearListenAutoTimer(); };
      var row=btn.closest('.row')||btn.parentElement;
      if(row && row.parentElement) row.parentElement.insertBefore(toggle,row);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', attachAutoAdvance);
  else attachAutoAdvance();
})();
</script>

(function(){
  function normEng(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');}
  function normKor(s){
    return String(s||'').toLowerCase()
      .replace(/[()[\]{}<>]/g,' ')
      .replace(/[,:;\/|·ㆍ~～\-]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function pieces(s){
    let raw=String(s||'')
      .replace(/\([^)]*\)/g,' ')
      .replace(/\[([^\]]+)\]/g,' $1 ')
      .split(/[;,\/|·ㆍ]/);
    let out=[];
    raw.forEach(x=>{
      let n=normKor(x); if(n) out.push(n);
      // bracket alternatives such as 소비[소모]하다 are also covered by the explicit cross-book DB.
    });
    return out;
  }
  function broadCorrect(eng,user){
    let e=normEng(eng), u=normKor(user);
    if(!e||!u)return false;
    let vals=SEOLDAE_CROSSBOOK_V18[e]||[];
    let cand=[];
    vals.forEach(v=>cand.push(...pieces(v)));
    // exact normalized match
    if(cand.includes(u)) return true;
    // common Korean spacing variation
    let us=u.replace(/\s/g,'');
    if(cand.some(c=>c.replace(/\s/g,'')===us)) return true;
    return false;
  }
  window.SEOLDAE_BROAD_V18={version:'18.0',correct:broadCorrect,db:SEOLDAE_CROSSBOOK_V18};

  // Wrap existing graders rather than replacing UI/day logic.
  function wrap3(name){
    let old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(ans,item,type){
      try{
        if(type==='e2k' && broadCorrect(item&&item.eng,ans)){
          let r=old.apply(this,arguments);
          if(r&&typeof r==='object') return Object.assign({},r,{correct:true,ok:true,status:'correct'});
          if(typeof r==='string') return 'correct';
          if(typeof r==='boolean') return true;
          return {correct:true,ok:true,status:'correct'};
        }
      }catch(e){}
      return old.apply(this,arguments);
    };
  }
  wrap3('gradeAnswer'); wrap3('gradeAnswerV5');

  if(typeof window.gradeAnswerV1==='function'){
    let old=window.gradeAnswerV1;
    window.gradeAnswerV1=function(item,direction,userInput){
      try{if(direction==='e2k'&&broadCorrect(item&&item.eng,userInput))return true;}catch(e){}
      return old.apply(this,arguments);
    };
  }

  ['gradeAnswerV22','gradeAnswerV31'].forEach(function(name){
    let old=window[name]; if(typeof old!=='function')return;
    window[name]=function(opts){
      try{
        let d=opts&&(opts.direction||opts.type);
        let e=opts&&(opts.eng||(opts.item&&opts.item.eng));
        let a=opts&&(opts.userAnswer||opts.answer||opts.ans);
        if(d==='e2k'&&broadCorrect(e,a))return {correct:true,ok:true,status:'correct'};
      }catch(e){}
      return old.apply(this,arguments);
    };
  });
})();
