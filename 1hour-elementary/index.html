  function eNorm(s){
    return BASE.nEng(s).replace(/\s+\d+\s*~?$/,'').replace(/\s+\d+$/,'').trim();
  }
  function kNorm(s){
    return String(s||'').toLowerCase().normalize('NFKC')
      .replace(/[~～]/g,'').replace(/[“”‘’'"`]/g,'')
      .replace(/[()（）\[\]{}<>]/g,'').replace(/[·•ㆍ,.;:!?，。]/g,'')

  }
  const V9_PN_PARTICLES=['에서','으로','부터','까지','에게','한테','로','에','을','를','이','가','은','는','와','과','의','도','만'];
  function v9PnStripToken(t){
    for(let i=0;i<V9_PN_PARTICLES.length;i++){const p=V9_PN_PARTICLES[i]; if(t.length>=p.length && t.endsWith(p)) return t.slice(0,-p.length);}
    return t;
  }
  function v9ParticleNormalizedJoin(raw){
    const cleaned=String(raw||'').toLowerCase().normalize('NFKC').trim()
      .replace(/[~～]/g,'').replace(/[“”‘’'"`]/g,'')
      .replace(/[()（）\[\]{}<>]/g,'').replace(/[·•ㆍ,.;:!?，。]/g,'');
    if(!cleaned) return '';
    const tokens=cleaned.split(/\s+/).filter(Boolean);
    if(tokens.length<2) return '';

  function kForms(s){

    out.add(seed);

    const pn=v9ParticleNormalizedJoin(s);
    if(pn) out.add(pn);
    const endings=[
      ["합니다","하다"],["합니다",""],["한다","하다"],["하는","하다"],["해서","하다"],["하여","하다"],["하게","하다"],["함","하다"],
      ["됩니다","되다"],["된다","되다"],["되는","되다"],["되어","되다"],["됨","되다"],
      ["있습니다","있다"],["있어요","있다"],["있는","있다"],["있고","있다"],
      ["없습니다","없다"],["없어요","없다"],["없는","없다"],
      ["입니다","이다"],["이다",""],
      ["적인",""],["적으로",""],["하게",""],["히",""]
    ];
    Array.from(out).forEach(x=>{
      endings.forEach(([a,b])=>{if(x.endsWith(a)){const y=x.slice(0,-a.length)+b;if(y)out.add(y);}});

      changed=false;
      KOR_GROUPS.forEach(g=>{
        const ng=g.map(kNorm);
        if(ng.some(x=>set.has(x))){
          g.forEach(v=>kForms(v).forEach(x=>{if(!set.has(x)){set.add(x);changed=true;}}));
        }
      });
    }
    return Array.from(set);
  }

    const e=eNorm(eng);

    const extra=EXTRA_BY_ENG[e]||EXTRA_BY_ENG[String(eng||'').toLowerCase().trim()]||[];
    return groupExpand(base.concat(extra));
  }
  function grade(opts){
    opts=opts||{};
    const base=BASE.grade(opts);
    if(base.correct || base.blank) return base;

    const dir=opts.direction||opts.type||'e2k';
    if(dir!=='e2k') return base;

    // 핵심 의미·품사·방향을 반드시 구별해야 하는 항목은 절대 확장하지 않는다.
    if(base.reason==='target_or_strict_mismatch' || base.reason==='strict_eng'){
      return base;
    }

    const userForms=groupExpand(kForms(opts.userAnswer||opts.answer||''));
    const cs=broadCandidates(opts.eng||'',opts.korFull||opts.kor_full||opts.kor||'');

    for(const u of userForms){
      for(const c of cs){
        if(u===c){
          return {correct:true,reason:'broad_semantic',label:'정답',acceptedBy:'broadSemantic'};
        }
      }
    }

    // 학생용 영→한은 3글자 이상이면 형태가 포함되는 자연스러운 설명형 답도 폭넓게 인정.
    for(const u of userForms){
      for(const c of cs){
        if(!u||!c||u.length<3||c.length<3) continue;
        if(u.includes(c)||c.includes(u)){
          return {correct:true,reason:'broad_partial_semantic',label:'정답',acceptedBy:'broadSemanticPartial'};
        }
      }
    }
    return base;
  }
  return {grade,broadCandidates,kForms};

    .replace(/[~…·ㆍ,.;:!?"'’“”]/g,' ')
    .replace(/-/g,' ')
    .replace(/\s+/g,'')
    .trim();
  x=x.replace(/(입니다|이에요|예요)$/,'');
  x=x.replace(/(은|는|을|를|와|과|의|에서|으로|부터|까지|에게|한테|께|도|만)$/,'');
  return x.trim();
};

function addEnhancedKorVariantsV32(set, phrase) {
  const p=String(phrase||'').trim(); if(!p) return;
  [p, normalizeKorean(p)].forEach(x=>{ if(x) set.add(x); });
  if(p.endsWith('하다')) [p.slice(0,-2)+'함',p.slice(0,-2)+'하기',p.slice(0,-2)+'해주다'].forEach(x=>set.add(x));
  if(p.endsWith('되다')) set.add(p.slice(0,-2)+'됨');
  p.replace(/\[([^\]]+)\]/g,(_,m)=>m.split(/[\/,.]/).forEach(v=>addEnhancedKorVariantsV32(set,v.trim())));
}
function enhancedKoreanCandidatesV32(item) {
  const out=new Set();
  splitKorMeaning(item.kor_full).concat(splitKorMeaning(item.kor)).forEach(x=>addEnhancedKorVariantsV32(out,x));
  (SIMILAR_KOR_MAP[item.eng]||[]).forEach(x=>addEnhancedKorVariantsV32(out,x));
  (EXTRA_SIMILAR_KOR_MAP[item.eng]||[]).forEach(x=>addEnhancedKorVariantsV32(out,x));
  let changed=true;
  while(changed){
    changed=false;
    GENERAL_KOR_SYNONYM_GROUPS.forEach(group=>{
      const normGroup=group.map(normalizeKorean);
      const hit=normGroup.some(g=>out.has(g));
      if(hit) group.forEach(x=>{ const before=out.size; addEnhancedKorVariantsV32(out,x); if(out.size!==before) changed=true; });
    });
  }
  return [...new Set([...out].map(normalizeKorean).filter(Boolean))];
}
koreanCandidates = function(item) { return enhancedKoreanCandidatesV32(item); };
gradeAnswer = function(ans,item,type) {
  if(!String(ans||'').trim()) return {correct:false,label:'답을 입력한 뒤 확인을 눌러주세요.',blank:true};
  if(type==='k2e') { const ok=englishAccepted(ans,item.eng); return {correct:ok,label:ok?'정답':'오답'}; }
  const a=normalizeKorean(ans); const cands=enhancedKoreanCandidatesV32(item);
  if(cands.includes(a)) return {correct:true,label:'정답',acceptedBy:'similarKor'};
  if(!STRICT_WORDS.has(item.eng)) for(const c of cands){ if(a.length>=2 && c.length>=2 && (a.includes(c)||c.includes(a))) return {correct:true,label:'정답',acceptedBy:'partialSimilarKor'}; }
  return {correct:false,label:'오답'};
};

<script>
/* ===== TTS 안정성 + 인앱브라우저 대응 패치 (제작가이드 §9, §11 반영, 2026-07) ===== */
(function(){
  var ttsVoice=null;
  function loadTtsVoice(){try{var voices=speechSynthesis.getVoices();ttsVoice=voices.find(function(v){return v.lang==='en-US'})||voices.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf('en')===0})||null}catch(e){}}
  if('speechSynthesis' in window){
    loadTtsVoice();
    if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=loadTtsVoice;
    try{
      var _origSpeak=speechSynthesis.speak.bind(speechSynthesis);
      speechSynthesis.speak=function(utterance){
        if(utterance && !utterance.voice && ttsVoice) utterance.voice=ttsVoice;
        return _origSpeak(utterance);
      };
    }catch(e){}
  }

  function detectEnv(){
    var ua=navigator.userAgent||'';
    var isKakao=/KAKAOTALK/i.test(ua);
    var isNaver=/NAVER\(/i.test(ua);
    var isLine=/Line\//i.test(ua);
    var isFB=/FBAN|FBAV/i.test(ua);
    var isInsta=/Instagram/i.test(ua);
    var isBand=/\bBand\//i.test(ua);
    var isInApp=isKakao||isNaver||isLine||isFB||isInsta||isBand;
    var isAndroid=/Android/i.test(ua);
    return {isInApp:isInApp,isKakao:isKakao,isAndroid:isAndroid};
  }
  function copyLinkAndInstruct(){
    try{navigator.clipboard.writeText(location.href);
      alert('링크가 복사되었습니다. 우측 상단 메뉴(≡ 또는 ···)에서 "다른 브라우저로 열기"를 눌러 Chrome/Safari에 붙여넣어 주세요.');
    }catch(e){prompt('아래 주소를 복사해서 Chrome/Safari에 붙여넣어 주세요.', location.href);}
  }
  function openExternal(){
    var env=detectEnv(); var url=location.href;
    if(env.isKakao){ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url); setTimeout(copyLinkAndInstruct,1200); return; }
    if(env.isAndroid){ var noProtocol=url.replace(/^https?:\/\//,''); location.href='intent://'+noProtocol+'#Intent;scheme=https;package=com.android.chrome;end'; return; }
    copyLinkAndInstruct();
  }

  function testSound(btn,diag){
    try{
      loadTtsVoice();
      if(!('speechSynthesis' in window)){if(btn)btn.textContent='⚠️ 이 브라우저는 음성 기능을 지원하지 않습니다';return}
      var voices=speechSynthesis.getVoices();
      if(diag)diag.textContent='감지된 음성 '+voices.length+'개 · 선택된 음성: '+(ttsVoice?(ttsVoice.name+' ('+ttsVoice.lang+')'):'없음(기본값 사용)');
      if(btn)btn.textContent='🔊 재생 중...';
      var u=new SpeechSynthesisUtterance('hello'); u.lang='en-US'; u.rate=.82;
      var done=false;
      u.onend=function(){done=true;if(btn)btn.textContent='✅ 소리 확인 완료 (다시 테스트하려면 탭)'};
      u.onerror=function(e){done=true;if(btn)btn.textContent='⚠️ 소리 재생 실패: '+(e&&e.error?e.error:'알 수 없음')};
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(function(){if(!done&&btn)btn.textContent='⚠️ 응답 없음 - 이 기기의 음성 엔진이 작동하지 않는 것 같습니다'},3000);
    }catch(e){if(btn)btn.textContent='⚠️ 오류: '+e.message}
  }

  function insertSoundTestButton(){
    if(document.getElementById('soundTestBtn')) return;
    var setupSection=document.getElementById('setup')||document.getElementById('setup-screen');
    if(!setupSection) return;
    var card=setupSection.querySelector('.card')||setupSection;
    var diag=document.createElement('div');
    diag.id='soundDiag'; diag.className='small'; diag.style.margin='0 0 10px';
    var btn=document.createElement('button');
    btn.type='button'; btn.id='soundTestBtn'; btn.className='light';
    btn.textContent='🔊 소리 확인 (시작 전 먼저 눌러보세요)';
    btn.onclick=function(){testSound(btn,diag)};
    card.insertBefore(diag, card.firstChild);
    card.insertBefore(btn, card.firstChild);
  }

  function ensureGuideElement(){
    var guide=document.getElementById('browserGuide');
    if(guide) return guide;
    var setupSection=document.getElementById('setup')||document.getElementById('setup-screen');
    if(!setupSection) return null;
    guide=document.createElement('div');
    guide.id='browserGuide';
    guide.style.cssText='position:relative;background:#fff4df;border:1px solid #f0c36b;color:#654000;border-radius:14px;padding:12px 38px 12px 12px;margin:10px 0 14px;font-size:13px;line-height:1.55;font-weight:700';
    var closeBtn=document.createElement('button');
    closeBtn.type='button'; closeBtn.id='guideCloseAuto'; closeBtn.setAttribute('aria-label','닫기');
    closeBtn.textContent='✕';
    closeBtn.style.cssText='position:absolute;right:8px;top:8px;width:26px;height:26px;padding:0;margin:0;border-radius:50%;background:#fff;color:#654000;border:1px solid #f0c36b;font-size:14px';
    var textDiv=document.createElement('div');
    textDiv.id='guideTextAuto';
    textDiv.textContent='📌 카카오톡 미리보기·문서뷰어에서는 저장/발음이 불안정할 수 있어요. Chrome·Safari로 열어주세요.';
    guide.appendChild(closeBtn); guide.appendChild(textDiv);
    if(localStorage.getItem('wm_guide_dismissed_auto')) guide.classList.add('hidden');
    closeBtn.onclick=function(){guide.classList.add('hidden');localStorage.setItem('wm_guide_dismissed_auto','1')};
    setupSection.insertBefore(guide, setupSection.firstChild);
    return guide;
  }
  function applyInAppBanner(){
    var env=detectEnv();
    var guide=ensureGuideElement();
    if(!guide) return;
    if(env.isInApp){
      guide.classList.remove('hidden');
      guide.style.background='#fdecea'; guide.style.borderColor='#e53935'; guide.style.color='#7a1a1a';
      if(!document.getElementById('openExternalBtn')){
        var warn=document.createElement('div');
        warn.style.marginTop='6px'; warn.style.fontWeight='800';
        warn.textContent='⚠️ 지금 카카오톡 등 인앱 브라우저로 열려 있어 발음(소리)이 재생되지 않습니다! 아래 버튼을 눌러 Chrome/Safari로 열어주세요.';
        var ob=document.createElement('button');
        ob.type='button'; ob.id='openExternalBtn';
        ob.textContent='↗ Chrome/Safari로 열기 (발음 재생 필수)';
        ob.style.cssText='margin-top:8px;background:#b45309;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:900;width:100%';
        ob.onclick=openExternal;
        guide.appendChild(warn); guide.appendChild(ob);
      }
    }
  }

  function initPatch(){ insertSoundTestButton(); applyInAppBanner(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initPatch);
  else initPatch();
})();
</script>
<script>
/* ===== 단어 듣기 자동진행 패치 (제작가이드 §9-3 반영, 2026-07) ===== */
(function(){
  var listenAutoTimer=null, autoplayOn=true;
  function clearListenAutoTimer(){if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null}}
  function findListenNextBtn(){return document.getElementById('nextListenBtn')||document.getElementById('nextListenButton')||document.getElementById('listen-next-btn')}
  function findListenSection(){return document.getElementById('listen')||document.getElementById('listen-screen')}
  function scheduleListenAuto(){
    clearListenAutoTimer();
    if(!autoplayOn) return;
    var btn=findListenNextBtn(), sec=findListenSection();
    if(!btn||!sec||sec.classList.contains('hidden')) return;
    listenAutoTimer=setTimeout(function(){
      var s=findListenSection();
      if(s && !s.classList.contains('hidden')) btn.click();
    },2200);
  }
  function updateToggleLabel(toggle){toggle.textContent=autoplayOn?'⏸ 자동재생 정지':'▶ 자동재생 시작'}
  function attachAutoAdvance(){
    var sec=findListenSection(), btn=findListenNextBtn();
    if(!sec||!btn) return;
    var wordEl=sec.querySelector('.word');
    if(wordEl){
      var mo=new MutationObserver(function(){ if(!sec.classList.contains('hidden')) scheduleListenAuto(); });
      mo.observe(wordEl,{childList:true,characterData:true,subtree:true});
    }
    var mo2=new MutationObserver(function(){ if(!sec.classList.contains('hidden')) scheduleListenAuto(); else clearListenAutoTimer(); });
    mo2.observe(sec,{attributes:true, attributeFilter:['class']});
    sec.addEventListener('click', function(e){
      var id=(e.target && e.target.id)||'';
      if(/prev|next|speak/i.test(id)){ clearListenAutoTimer(); setTimeout(scheduleListenAuto,50); }
    });
    if(!document.getElementById('listenAutoToggle')){
      var toggle=document.createElement('button');
      toggle.type='button'; toggle.id='listenAutoToggle'; toggle.className='secondary';
      updateToggleLabel(toggle);
      toggle.onclick=function(){ autoplayOn=!autoplayOn; updateToggleLabel(toggle); if(autoplayOn) scheduleListenAuto(); else clearListenAutoTimer(); };
      var row=btn.closest('.row')||btn.parentElement;
      if(row && row.parentElement) row.parentElement.insertBefore(toggle,row);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', attachAutoAdvance);
  else attachAutoAdvance();
})();
</script>

<script>
(function(){
  function applySDV8Hint(){
    try{
      var wordEl=document.getElementById('questionWord')||document.getElementById('qword')||document.getElementById('q-word')||document.getElementById('qword')||document.getElementById('q-word')||document.getElementById('q-word');
      var hintEl=document.getElementById('questionHint')||document.getElementById('qhint')||document.getElementById('q-hint');
      if(!wordEl||!hintEl)return;
      var e=SEOLDAE_V8.nEng(wordEl.textContent||''); var h=SDV8_HINT_BY_ENG[e];
      if(h && wordEl.offsetParent!==null) hintEl.textContent=h;
    }catch(_e){}
  }
  var obs=new MutationObserver(applySDV8Hint); obs.observe(document.body,{subtree:true,childList:true,characterData:true});
  setTimeout(applySDV8Hint,200);
})();
</script>
</body>
