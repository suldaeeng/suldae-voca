<div class="app">
<h1>설대영어 단어시험</h1><div class="sub">원아워 초등영단어 DAY 01~60 · 표준채점 v3.1</div>
<div class="browser-guide" id="browserGuide"><button id="guideClose" class="guide-close" aria-label="닫기">✕</button><div class="guide-title">📱 브라우저로 열어주세요</div><div><b>반드시 파일저장 후 크롬으로 열어야</b><br>발음·입력·저장이 안정적으로 작동합니다.</div><div class="small">카카오톡 미리보기·문서뷰어에서는 오류가 날 수 있습니다.</div></div>
<div class="toplink"><a href="#" id="teacherLink">선생님 모드</a></div>
<section id="setup"><div class="card"><label for="name">이름</label><input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="name"><label for="daySelect">DAY 선택</label><input type="hidden" id="daySelect" value=""><button type="button" id="dayBtn" class="day-trigger">DAY 선택</button><label for="mode">시험 방식</label><select id="mode"><option value="mix">영어→한글 / 한글→영어 랜덤</option><option value="e2k">영어→한글만</option><option value="k2e">한글→영어만</option><option value="wrong">저장된 오답만 복습</option></select><label for="countSelect">문항 수</label><select id="countSelect"><option value="all">선택 DAY 전체</option><option value="20">랜덤 20문항</option><option value="30">랜덤 30문항</option><option value="50">랜덤 50문항</option></select><div class="row"><button id="listenBtn" class="secondary" type="button">🔊 발음 듣기</button><button id="startBtn" type="button">시험 시작</button></div></div><div class="small">오답은 뒤에 다시 출제됩니다. 최종 점수는 첫 풀이 기준입니다.<br>Enter 키와 확인 버튼 모두 사용할 수 있습니다.</div></section>
<section id="listen" class="hidden"><div class="progress" id="listenProg"></div><div class="card qcard"><div class="word" id="listenWord"></div><div class="kor" id="listenKor"></div><button id="speakBtn" class="light" type="button">🔊 다시 듣기</button><label for="speed" style="text-align:left">발음 속도</label><input id="speed" type="range" min="0.5" max="1" step="0.1" value="0.8"><label style="display:flex;gap:6px;align-items:center"><input id="autoplay" type="checkbox" checked style="width:auto">자동재생</label></div><div class="row"><button id="prevBtn" class="secondary" type="button">◀ 이전</button><button id="nextListenBtn" type="button">다음 ▶</button></div><button id="backBtn" class="secondary" type="button">돌아가기</button></section>
<section id="quiz" class="hidden"><div class="progress" id="prog"></div><div class="card qcard"><div class="hint" id="qhint"></div><div class="word" id="qword"></div><input id="answer" class="answer" autocomplete="off" placeholder="정답 입력"><div id="fb" class="feedback"></div><div id="correct" class="small"></div></div><button id="submitBtn" type="button">확인</button><button id="nextBtn" class="secondary hidden" type="button">다음</button></section>

<section id="teacher" class="hidden"><div class="card"><b>학생 결과 붙여넣기</b><div class="small" style="text-align:left;margin:8px 0">학생들이 카톡으로 보낸 결과를 여러 개 붙여넣고 분석하세요.</div><textarea id="paste" placeholder="[설대영어 단어시험 결과]로 시작하는 결과를 붙여넣으세요"></textarea><button id="analyzeBtn" type="button">분석하기</button></div><div class="card hidden" id="analysisCard"><b>분석 결과</b><div id="tableWrap" style="overflow:auto"></div></div><button id="studentBtn" class="secondary" type="button">학생 화면으로</button></section>
</div>

const $=id=>document.getElementById(id);
const screenIds=['setup','listen','quiz','result','teacher'];
let app={name:'',day:'',items:[],queue:[],current:null,total:0,firstTry:0,wrong:[],log:[],answered:false,autoTimer:null,listenItems:[],listenIndex:0};
function showScreen(id){screenIds.forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function todayText(){const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function getAllItems(){return Object.keys(VOCA).sort((a,b)=>Number(a)-Number(b)).flatMap(d=>VOCA[d].map(x=>Object.assign({},x,{day:d})));}
function getSelectedItems(){if($('daySelect').value==='ALL')return getAllItems(); const d=$('daySelect').value; return (VOCA[d]||[]).map(x=>Object.assign({},x,{day:d}));}
function setDay(value,label){$('daySelect').value=value;$('dayBtn').textContent=label;$('dayBtn').classList.add('selected');$('dayModal').classList.add('hidden');}
function initDaySheet(){const list=$('dayList');list.innerHTML='';Object.keys(VOCA).sort((a,b)=>Number(a)-Number(b)).forEach(d=>{const b=document.createElement('button');b.type='button';b.textContent='DAY '+String(d).padStart(2,'0');b.addEventListener('click',()=>setDay(d,b.textContent));list.appendChild(b);});const all=document.createElement('button');all.type='button';all.className='all-day';all.textContent='전체 DAY 총정리';all.addEventListener('click',()=>setDay('ALL','전체 DAY 총정리'));list.appendChild(all);}
function loadWrongBank(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||'[]');}catch(e){return[];}}
function saveWrongBank(items){const old=loadWrongBank();const merged=[...items.map(x=>({eng:x.eng,kor:x.kor,kor_full:x.kor_full,day:x.day})),...old];const seen=new Set();const out=[];merged.forEach(x=>{const k=x.eng+'|'+x.kor_full;if(!seen.has(k)){seen.add(k);out.push(x);}});localStorage.setItem(WRONG_KEY,JSON.stringify(out.slice(0,160)));}

/* === SEOLDAE TTS STABILITY CORE 2026-09-02 === */
(function(){
  let seq=0, voice=null, lastText='', lastAt=0;

  function clean(t){
    return String(t||'').replace(/[~…]/g,' ').replace(/\s+/g,' ').trim();
  }
  function pickVoice(){
    try{
      if(!('speechSynthesis' in window))return null;
      const vs=window.speechSynthesis.getVoices()||[];
      const pref=['Google US English','Samsung English (United States)','Samantha','Ava','Allison','Susan','Karen','Moira','Microsoft Aria','Microsoft Jenny','English United States'];
      voice=vs.find(v=>/^en-US/i.test(v.lang)&&pref.some(n=>String(v.name).toLowerCase().includes(n.toLowerCase())))
        ||vs.find(v=>/^en-US/i.test(v.lang))
        ||vs.find(v=>/^en-/i.test(v.lang))
        ||vs.find(v=>/^en/i.test(v.lang))
        ||null;
      return voice;
    }catch(e){return null}
  }
  function reset(){
    try{
      if(!('speechSynthesis' in window))return;
      const s=window.speechSynthesis;
      try{s.cancel()}catch(e){}
      try{s.resume()}catch(e){}
    }catch(e){}
  }
  function robustSpeak(text,rate){
    try{
      if(!('speechSynthesis' in window))return false;
      const s=window.speechSynthesis, t=clean(text);
      if(!t)return false;
      const now=Date.now();
      if(t===lastText && now-lastAt<450)return true; // 중복 이벤트의 이중 발음 방지
      lastText=t; lastAt=now;
      const my=++seq;
      pickVoice();
      try{
        if(s.speaking||s.pending||s.paused)s.cancel();
        s.resume();
      }catch(e){}
      let began=false;
      function make(){
        const u=new SpeechSynthesisUtterance(t);
        u.lang='en-US'; u.rate=Number(rate)||.80; u.pitch=1; u.volume=1;
        const v=voice||pickVoice(); if(v)u.voice=v;
        u.onstart=()=>{if(my===seq)began=true;};
        u.onerror=()=>{
          if(my!==seq)return;
          setTimeout(()=>{
            if(my!==seq)return;
            try{reset();pickVoice();s.speak(make())}catch(e){}
          },140);
        };
        return u;
      }
      s.speak(make());
      [300,900].forEach(ms=>setTimeout(()=>{
        if(my!==seq||began)return;
        try{
          if(!s.speaking&&!s.pending){
            try{s.resume()}catch(e){}
            pickVoice(); s.speak(make());
          }
        }catch(e){}
      },ms));
      return true;
    }catch(e){return false}
  }

  window.__sdSpeak=robustSpeak;
  window.__sdTtsReset=reset;
  window.__sdTtsPrime=pickVoice;

  try{
    if(typeof window.speak==='function')window.speak=t=>robustSpeak(t,.80);
    if(typeof window.speakEnglish==='function')window.speakEnglish=t=>robustSpeak(t,.78);
    if(typeof window.speakWord==='function')window.speakWord=function(t){
      let r=.80;
      try{
        const e=document.getElementById('listen-speed')||document.getElementById('speed');
        if(e)r=parseFloat(e.value)||.80;
      }catch(x){}
      return robustSpeak(t,r);
    };
  }catch(e){}

  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.onvoiceschanged=pickVoice;
      setTimeout(pickVoice,50); setTimeout(pickVoice,500);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{window.speechSynthesis.resume()}catch(e){};pickVoice()}});
      window.addEventListener('pageshow',()=>{try{window.speechSynthesis.resume()}catch(e){};pickVoice()});
    }
  }catch(e){}
})();

(function(){

    try{
      if(typeof state!=='undefined' && state){
        const c=state.current || (state.queue && typeof state.idx==='number' ? state.queue[state.idx] : null);
        if(c){

      }
    }catch(e){}
    return {eng:'',dir:''};
  }

    if(info && info.eng && String(info.dir).toLowerCase()==='k2e'){
      setTimeout(()=>{try{window.__sdSpeak(info.eng,.78)}catch(e){}},90);
    }
  }

  function decorateWrongItems(root){
    const scope=root||document;
    scope.querySelectorAll('.wrong-item').forEach(function(row){
      if(row.querySelector('.sd-wrong-speak'))return;
      let wordEl=row.querySelector('.w')||row.querySelector('b')||row.querySelector('strong')||row.querySelector('span');

        try{window.__sdSpeak(eng,.78)}catch(e){}
      });
      row.appendChild(b);
    });
  }

  function install(){
    const submitIds=['submitBtn','submit-btn','checkBtn','check-btn'];
    submitIds.forEach(function(id){
      const b=document.getElementById(id);

        b.dataset.sdPronHook='1';
        b.addEventListener('click',postSubmitPronounce);
      }

    decorateWrongItems(document);
    const obs=new MutationObserver(function(ms){
      let need=false;
      ms.forEach(m=>{if(m.addedNodes&&m.addedNodes.length)need=true});
      if(need)decorateWrongItems(document);
    });
    obs.observe(document.body,{childList:true,subtree:true});
    document.querySelectorAll('#dayList button,#day-list button,[data-day]').forEach(function(b){
      b.addEventListener('click',function(){try{window.__sdTtsReset()}catch(e){}});
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();

      if(typeof appState!=='undefined'&&appState&&appState.queue&&typeof appState.idx==='number'){
        const q=appState.queue[appState.idx];
        if(q){const it=q.item||q;return {dir:q.type||q.direction,eng:it.eng||q.eng};}
      }
    }catch(e){}
    try{
      if(typeof state!=='undefined'&&state&&state.current){
        const c=state.current; return {dir:c.type||c.direction,eng:(c.item&&c.item.eng)||c.eng};
      }
    }catch(e){}
    try{
      if(typeof app!=='undefined'&&app&&app.current){
        return {dir:app.current.type||app.current.direction,eng:(app.current.item&&app.current.item.eng)||app.current.eng};
      }
    }catch(e){}
    try{
      if(typeof current!=='undefined'&&current){
        return {dir:current.type||current.direction,eng:(current.item&&current.item.eng)||current.eng};
      }
    }catch(e){}
    return {dir:'',eng:''};
  }

  function ensureBtn(){
    let b=document.getElementById('sdQuizSpeakBtn');
    if(!b){
      b=document.createElement('button');
      b.id='sdQuizSpeakBtn'; b.type='button';
      b.textContent='🔊 다시 듣기';
      b.style.cssText='display:none;margin:10px auto 0;padding:9px 14px;border-radius:10px;font-size:14px;width:auto;min-width:110px;';
      b.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        const x=info();
        if(String(x.dir).toLowerCase()==='e2k'&&x.eng){
          try{window.__sdSpeak(x.eng,.78)}catch(e){}
        }
      });
      const q=document.getElementById('questionWord')||document.getElementById('q-word')||document.getElementById('qword');
      if(q&&q.parentNode) q.parentNode.insertBefore(b,q.nextSibling);
      else document.body.appendChild(b);
    }
    return b;
  }
  function refresh(){
    const b=ensureBtn(), x=info();
    b.style.display=(String(x.dir).toLowerCase()==='e2k'&&x.eng)?'block':'none';
  }
  function install(){
    refresh();
    const mo=new MutationObserver(refresh);
    mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
    document.addEventListener('click',function(){setTimeout(refresh,0)},true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();

</script>
</body>
