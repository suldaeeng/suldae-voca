/* === SEOLDAE TTS STABILITY CORE 2026-09-02 === */
(function(){
  let seq=0, voice=null, lastText='', lastAt=0;

  function clean(t){
    return String(t||'').replace(/[~…]/g,' ').replace(/\s+/g,' ').trim();
  }
  function pickVoice(){
    try{
      if(!('speechSynthesis' in window))return null;
      const vs=window.speechSynthesis.getVoices()||[];
      const pref=['Google US English','Samsung English (United States)','Samantha','Ava','Allison','Susan','Karen','Moira','Microsoft Aria','Microsoft Jenny','English United States'];
      voice=vs.find(v=>/^en-US/i.test(v.lang)&&pref.some(n=>String(v.name).toLowerCase().includes(n.toLowerCase())))
        ||vs.find(v=>/^en-US/i.test(v.lang))
        ||vs.find(v=>/^en-/i.test(v.lang))
        ||vs.find(v=>/^en/i.test(v.lang))
        ||null;
      return voice;
    }catch(e){return null}
  }
  function reset(){
    try{
      if(!('speechSynthesis' in window))return;
      const s=window.speechSynthesis;
      try{s.cancel()}catch(e){}
      try{s.resume()}catch(e){}
    }catch(e){}
  }
  function robustSpeak(text,rate){
    try{
      if(!('speechSynthesis' in window))return false;
      const s=window.speechSynthesis, t=clean(text);
      if(!t)return false;
      const now=Date.now();
      if(t===lastText && now-lastAt<450)return true; // 중복 이벤트의 이중 발음 방지
      lastText=t; lastAt=now;
      const my=++seq;
      pickVoice();
      try{
        if(s.speaking||s.pending||s.paused)s.cancel();
        s.resume();
      }catch(e){}
      let began=false;
      function make(){
        const u=new SpeechSynthesisUtterance(t);
        u.lang='en-US'; u.rate=Number(rate)||.80; u.pitch=1; u.volume=1;
        const v=voice||pickVoice(); if(v)u.voice=v;
        u.onstart=()=>{if(my===seq)began=true;};
        u.onerror=()=>{
          if(my!==seq)return;
          setTimeout(()=>{
            if(my!==seq)return;
            try{reset();pickVoice();s.speak(make())}catch(e){}
          },140);
        };
        return u;
      }
      s.speak(make());
      [300,900].forEach(ms=>setTimeout(()=>{
        if(my!==seq||began)return;
        try{
          if(!s.speaking&&!s.pending){
            try{s.resume()}catch(e){}
            pickVoice(); s.speak(make());
          }
        }catch(e){}
      },ms));
      return true;
    }catch(e){return false}
  }

  window.__sdSpeak=robustSpeak;
  window.__sdTtsReset=reset;
  window.__sdTtsPrime=pickVoice;

  try{
    if(typeof window.speak==='function')window.speak=t=>robustSpeak(t,.80);
    if(typeof window.speakEnglish==='function')window.speakEnglish=t=>robustSpeak(t,.78);
    if(typeof window.speakWord==='function')window.speakWord=function(t){
      let r=.80;
      try{
        const e=document.getElementById('listen-speed')||document.getElementById('speed');
        if(e)r=parseFloat(e.value)||.80;
      }catch(x){}
      return robustSpeak(t,r);
    };
  }catch(e){}

  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.onvoiceschanged=pickVoice;
      setTimeout(pickVoice,50); setTimeout(pickVoice,500);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{window.speechSynthesis.resume()}catch(e){};pickVoice()}});
      window.addEventListener('pageshow',()=>{try{window.speechSynthesis.resume()}catch(e){};pickVoice()});
    }
  }catch(e){}
})();

    diag.textContent='시험 전 소리가 잘 들리는지 확인하세요.';

    wrap.appendChild(btn);

    card.appendChild(wrap);

  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installSoundCheck);
  else installSoundCheck();

/* === SEOLDAE POST-ANSWER AUDIO GUARANTEE v5 ===
   iPhone/Safari 대응:
   1) 답 제출 탭 이벤트 안에서 즉시 TTS 실행
   2) 다음 문제로 넘어가기 전 발음 시간을 충분히 확보
   3) 제출 후 '🔊 정답 발음' 버튼을 보여 수동 재생도 가능
*/
(function(){
  function activeEnglish(){
    try{
      if(typeof appState!=='undefined' && appState && appState.queue && typeof appState.idx==='number'){
        const q=appState.queue[appState.idx]; if(q){const it=q.item||q; return it.eng||q.eng||'';}
      }
    }catch(e){}
    try{
      if(typeof state!=='undefined' && state && state.current){
        return (state.current.item&&state.current.item.eng)||state.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof app!=='undefined' && app && app.current){
        return (app.current.item&&app.current.item.eng)||app.current.eng||'';
      }
    }catch(e){}
    try{
      if(typeof current!=='undefined' && current){
        return (current.item&&current.item.eng)||current.eng||'';
      }
    }catch(e){}
    return '';
  }

  function answerSubmitted(){
    try{
      if(typeof appState!=='undefined' && appState) return !!appState.answered;
      if(typeof state!=='undefined' && state) return !!state.answered;
      if(typeof app!=='undefined' && app) return !!app.answered;
      if(typeof answered!=='undefined') return !!answered;
    }catch(e){}
    return false;
  }

  function ensure(){
    let b=document.getElementById('sdAnswerSpeakBtn');
    if(b)return b;
    b=document.createElement('button');
    b.id='sdAnswerSpeakBtn';
    b.type='button';
    b.textContent='🔊 정답 발음';
    b.style.cssText='display:none;margin:10px auto 0;padding:9px 14px;border-radius:10px;font-size:14px;width:auto;min-width:110px;';
    b.addEventListener('click',function(ev){
      ev.preventDefault(); ev.stopPropagation();
      const eng=activeEnglish();
      if(eng){try{window.__sdSpeak(eng,.86)}catch(e){}}
    });
    const fb=document.getElementById('feedback')||document.getElementById('fb');
    if(fb&&fb.parentNode)fb.parentNode.insertBefore(b,fb.nextSibling);
    else document.body.appendChild(b);
    return b;
  }

  function refresh(){
    const b=ensure();
    const eng=activeEnglish();
    b.style.display=(answerSubmitted()&&eng)?'block':'none';
  }

  function install(){
    refresh();
    const mo=new MutationObserver(refresh);
    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','disabled','readonly']});
    document.addEventListener('click',function(){setTimeout(refresh,0)},true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);
  else install();
})();








/* === SEOLDAE TTS CORE v13 — FAST START / STALL RECOVERY ===
   목적:
   - therapist처럼 평범한 단어도 음성이 늦게 시작되거나 무음이 되는 현상 방지
   - 가능하면 기기 내장(localService) 영어 음성을 우선 사용
   - pending 상태가 오래 걸리면 자동으로 stale queue를 정리하고 재시도
   - 괄호/대괄호가 있는 학습용 표제어는 실제 발음형으로 변환
*/
(function(){
  if(!('speechSynthesis' in window)) return;

  const synth = window.speechSynthesis;
  let voice = null;
  let held = [];
  let seq = 0;

  function spokenHeadword(raw){
    let s=String(raw||'').trim();
    if(!s) return s;

    /* judg(e)ment -> judgement */
    s=s.replace(/([A-Za-z])\(([A-Za-z]+)\)(?=[A-Za-z])/g,'$1$2');

    /* 선택 요소는 자연스러운 대표형으로 */
    s=s.replace(/\(to\)/gi,' to ')
       .replace(/\(with\)/gi,' with ')
       .replace(/\(for\)/gi,' for ')
       .replace(/\(up\)/gi,' up ')
       .replace(/\(also\)/gi,' also ');

    /* arrive at[in] -> arrive at / until[up to] now -> until now */
    s=s.replace(/([A-Za-z]+)\[([A-Za-z ]+)\]/g,'$1');

    /* 학습용 기호 정리 */
    s=s.replace(/[()[\]]/g,' ')
       .replace(/[~…]/g,' ')
       .replace(/\s+/g,' ')
       .trim();
    return s;
  }

  function pickVoice(){
    try{
      const vs=synth.getVoices()||[];
      const english=vs.filter(v=>/^en(?:-|$)/i.test(v.lang||''));
      const local=english.filter(v=>v.localService===true);

      voice =
        local.find(v=>/^en-US$/i.test(v.lang) && /Samantha|Ava|Siri|Microsoft|English/i.test(v.name)) ||
        local.find(v=>/^en-US/i.test(v.lang)) ||
        local[0] ||
        english.find(v=>/^en-US$/i.test(v.lang) && /Samantha|Ava|Siri|Google|Microsoft|English/i.test(v.name)) ||
        english.find(v=>/^en-US/i.test(v.lang)) ||
        english[0] ||
        null;
    }catch(e){ voice=null; }
    return voice;
  }

  function hold(u){
    held.push(u);
    if(held.length>18) held=held.slice(-18);
    const done=function(){
      const i=held.indexOf(u);
      if(i>=0) held.splice(i,1);
    };
    u.onend=done;
    u.onerror=done;
  }

  function makeUtt(text,rate,useVoice){
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';
    u.rate=Number(rate)||0.86;
    u.pitch=1.0;
    u.volume=1.0;
    if(useVoice){
      const v=voice||pickVoice();
      if(v) u.voice=v;
    }
    hold(u);
    return u;
  }

  function prime(){
    try{
      synth.resume();
      pickVoice();
      if(!synth.speaking && !synth.pending){
        const u=new SpeechSynthesisUtterance('');
        u.lang='en-US'; u.rate=1; u.volume=1;
        hold(u);
        synth.speak(u);
      }
      return true;
    }catch(e){ return false; }
  }

  function launch(text,rate,mySeq,useVoice,retryLevel){
    if(mySeq!==seq) return false;
    let started=false;
    let u;
    try{
      synth.resume();
      u=makeUtt(text,rate,useVoice);
      const oldEnd=u.onend, oldErr=u.onerror;

      u.onstart=function(){ started=true; };
      u.onend=function(ev){ started=true; if(oldEnd) oldEnd.call(this,ev); };
      u.onerror=function(ev){ if(oldErr) oldErr.call(this,ev); };

      synth.speak(u);
    }catch(e){ return false; }

    const wait = retryLevel===0 ? 420 : 900;
    setTimeout(function(){
      if(mySeq!==seq) return;

      /* 실제로 시작했거나 현재 말하고 있으면 건드리지 않는다. */
      if(started || synth.speaking) return;

      /* pending만 오래 지속되는 경우가 therapist 같은 '한참 뒤 발음'의 핵심 원인 */
      try{ synth.cancel(); }catch(e){}
      try{ synth.resume(); }catch(e){}

      if(retryLevel===0){
        /* 첫 재시도: 짧게 비운 뒤 같은 로컬 영어 음성 */
        setTimeout(function(){
          if(mySeq!==seq) return;
          launch(text,rate,mySeq,true,1);
        },110);
      }else if(retryLevel===1){
        /* 두 번째 재시도: 특정 voice 지정 없이 브라우저 기본 영어 TTS 사용 */
        setTimeout(function(){
          if(mySeq!==seq) return;
          launch(text,rate,mySeq,false,2);
        },130);
      }
    },wait);
    return true;
  }

  function speakNow(raw,rate){
    const text=spokenHeadword(raw);
    if(!text) return false;
    const mySeq=++seq;
    try{
      /* v17: 모바일 Safari에서는 사용자 탭 이벤트 안에서 speak()가 즉시 호출되어야 한다.
         cancel() 뒤 setTimeout으로 미루면 사용자 활성화가 풀려 무음이 될 수 있다. */
      synth.resume();
      pickVoice();
      try{ synth.cancel(); }catch(e){}
      const u=makeUtt(text,rate,true);
      let started=false;
      u.onstart=function(){ started=true; };
      synth.speak(u);
      /* 드문 stalled queue만 보조 재시도. 정상 재생 중이면 절대 취소하지 않는다. */
      setTimeout(function(){
        if(mySeq!==seq || started || synth.speaking) return;
        try{ synth.cancel(); synth.resume(); }catch(e){}
        try{ synth.speak(makeUtt(text,rate,false)); }catch(e){}
      },700);
      return true;
    }catch(e){ return false; }
  }

  function reset(){
    seq++;
    try{
      if(synth.pending && !synth.speaking) synth.cancel();
      synth.resume();
      pickVoice();
    }catch(e){}
  }

  window.__sdSpokenHeadword=spokenHeadword;
  window.__sdPrimeAudio=prime;
  window.__sdSpeak=speakNow;
  window.__sdSpeakNow=speakNow;
  window.__sdSpeakFresh=speakNow;
  window.__sdTtsReset=reset;
  window.__sdTtsPrime=pickVoice;
  window.SEOLDAE_TTS_VERSION='13-fast-start';

  try{
    synth.onvoiceschanged=pickVoice;
    pickVoice();
    setTimeout(pickVoice,80);
    setTimeout(pickVoice,400);
    setTimeout(pickVoice,1200);
  }catch(e){}

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) reset();
  });
  window.addEventListener('pageshow',reset);

  /* 시험 시작/확인/다시듣기 등의 실제 터치 순간 TTS 세션을 미리 깨운다. */
  document.addEventListener('pointerdown',function(ev){if(window.__SD_MP3_AUDIO)return;
    const b=ev.target&&ev.target.closest?ev.target.closest('button'):null;
    if(!b) return;
    const txt=(b.textContent||'').trim();
    if(/확인|제출|시험 시작|시작|다시 듣기|정답 발음|소리 확인/.test(txt) ||
       /submit|start|sound|speak/i.test(b.id||'')){
      prime();
    }
  },true);

  /* 오답 다시 듣기 */
  document.addEventListener('click',function(ev){
    const b=ev.target&&ev.target.closest?ev.target.closest('.sd-wrong-speak'):null;
    if(!b) return;
    ev.preventDefault();
    ev.stopPropagation();
    const eng=(b.dataset.eng||'').trim();
    if(eng){
      try{
        const a=document.activeElement;
        if(a&&/INPUT|TEXTAREA/.test(a.tagName)) a.blur();
      }catch(e){}
      prime();
      speakNow(eng,0.86);
    }
  },true);

  function normEng(s){

  function cleanKor(s){

  /* [ ]를 두 가지 실제 표현으로 펼친다.
     감명[감동]을 받은 -> 감명을 받은 / 감동을 받은
     해외에[로] -> 해외에 / 해외로
     외국에[으로] -> 외국에 / 외국으로
     소비[소모]하다 -> 소비하다 / 소모하다 */
  function expandSquare(raw){
    let out=[String(raw||'')];
    for(let guard=0;guard<10;guard++){
      let changed=false, next=[];
      out.forEach(str=>{
        const m=str.match(/\[([^\]]+)\]/);
        if(!m){ next.push(str); return; }
        changed=true;
        const idx=m.index, whole=m[0], inside=m[1];
        const before=str.slice(0,idx), after=str.slice(idx+whole.length);
        const alts=inside.split(/[\/,，;、]/).map(x=>x.trim()).filter(Boolean);
        /* 원래 표기(괄호 부분 삭제) */
        next.push(before+after);

        const wm=before.match(/([가-힣]+)$/);
        const word=wm?wm[1]:'';
        const prefix=wm?before.slice(0,before.length-word.length):before;
        alts.forEach(alt=>{
          /* v25: 대괄호 펼치기 규칙 수정
             - 조사 바꾸기: 해외에[로]→해외로, 외국에[으로]→외국으로, 어딘가에[에서]→어딘가에서
             - 어미 바꾸기: 유포되다[하다]→유포하다
             - 한 글자: 인용구[문]→인용문  (예전엔 '문'만 만들어짐)
             - 두 글자 이상: 참가[참여]하다→참여하다, 돌아가다[오다]→돌아오다
               (예전엔 '가'를 조사로 오인해 '참참여하다'를 만들어 '참여하다'가 오답 처리됨) */
          const reps=new Set();
          const PART=/^(으로|로|에|에서|에게|으로서|로서|의|을|를|이|가|은|는|와|과|도|만|까지|부터)$/;
          const ENDS=['시키다','하다','되다','하는','되는','한','된','적인','적'];
          if(!word){ reps.add(alt); }
          else if(PART.test(alt)){
            if(PARTICLE_LAST.has(word.slice(-1))||/[에의로을를]$/.test(word)) reps.add(word.slice(0,-1)+alt);
            if(word.endsWith('에서')&&word.length>2) reps.add(word.slice(0,-2)+alt);
            reps.add(word+alt);
          }else if(ENDS.includes(alt) && ENDS.some(en=>word.endsWith(en)&&word.length>en.length)){
            const en=ENDS.find(en=>word.endsWith(en)&&word.length>en.length);
            reps.add(word.slice(0,-en.length)+alt);
          }else if(alt.length===1){
            reps.add(word.slice(0,-1)+alt);
          }else{
            reps.add(alt);
            if(word.length>alt.length) reps.add(word.slice(0,-alt.length)+alt);
          }
          if(!reps.size) reps.add(alt);
          reps.forEach(r=>next.push(prefix+r+after));
        });
      });
      out=[...new Set(next)];
      if(!changed) break;
    }
    return out;
  }

  function stripParenNotes(s){
    /* 괄호 안은 보충설명인 경우가 많으므로 '있는 버전/없는 버전'을 모두 만든다. */
    const raw=String(s||'');
    const a=raw.replace(/\([^)]*\)/g,' ');
    const b=raw.replace(/[()]/g,' ');
    return [a,b];
  }

  function splitMeanings(full){
    let set=new Set();
    expandSquare(full).forEach(v=>{
      stripParenNotes(v).forEach(x=>{
        if(x.trim()) set.add(x.trim());
        x.split(/[\/,;,，、]|\d+\s*\./).forEach(p=>{
          p=p.trim(); if(!p) return; set.add(p);
          /* OCR/원자료에서 품사 뜻 사이 구분자가 빠진 경우:
             '쑤시다 아픔', '나가다 출구'처럼 -다 뒤 새 뜻을 분리한다. */
          const m=p.match(/^(.+?다)\s+(.+)$/);
          if(m){ set.add(m[1].trim()); set.add(m[2].trim()); }
        });
      });
    });
    return [...set];
  }

  function posOfKor(raw){
    const s=cleanKor(raw);
    if(!s) return null;
    if(/(하다|되다|시키다|주다|받다|먹다|가다|오다|보다|듣다|읽다|쓰다|말하다|돕다|잃다|얻다|만들다)$/.test(s)) return 'verb';
    if(/(받은|되는|된|하는|한|있는|없는|로운|스러운|적인|같은|많은|적은|좋은|나쁜|큰|작은|긴|짧은|높은|낮은|빠른|느린|의)$/.test(s)) return 'adj';
    if(/(하게|히|없이|도록|적으로|에서|으로|로|에)$/.test(s)) return 'adv';
    return 'noun';

  function forms(raw){
    const c=cleanKor(raw);
    const set=new Set();
    if(!c) return [];
    set.add(c);
    set.add(dropInnerParticles(c));
    /* 한국어 의미어근 후보:
       근처의 / 근처에 / 근처에서 → 근처
       해외의 / 해외에 / 해외로 → 해외
       단, 최종 판정에서는 기존 품사 안전장치를 유지한다. */
    let stem=c;
    for(const pt of PARTICLES){
      if(stem.length>pt.length+1 && stem.endsWith(pt)){
        stem=stem.slice(0,-pt.length);
        break;
      }
    }
    if(stem.length>=2) set.add(stem);
    set.add(c.replace(/(을|를)(?=받은|하는|하다|되다|된|시키다)/g,''));
    set.add(c.replace(/(이|가|은|는)(?=있는|없는|되는|된|하다|하는)/g,''));
    /* 하다류는 명사어근도 후보로 보존하되, 최종 판정에서 품사를 확인한다. */
    if(c.length>=3){
      set.add(c.replace(/하다$/,''));
      set.add(c.replace(/되다$/,''));
      set.add(c.replace(/시키다$/,''));
      /* 활용형 표면문자열이 달라도 핵심 의미어근을 후보로 보존 */
      set.add(c.replace(/(받은|되는|된|하는|한|있는|없는|로운|스러운|적인|같은|많은|적은|좋은|나쁜|큰|작은|긴|짧은|높은|낮은|빠른|느린)$/,''));
    }
    return [...set].filter(Boolean);
  }

  function canonKor(s){
    let x=dropInnerParticles(s);
    for(let i=0;i<KOR_GROUPS.length;i++){
      const g=KOR_GROUPS[i];
      for(let j=0;j<g.length;j++){
        const k=cleanKor(g[j]);
        if(x===k) return '#g'+i;
        if(k.length>=2 && x.indexOf(k)>=0) return x.replace(k,'#g'+i);
      }
    }
    return x;
  }

  function multiMeaningAnswerOK(userAnswer,candidates){
    /* 학생이 '설명 묘사', '조작자 기사'처럼 정답 의미를 2개 이상
       공백으로 함께 쓴 경우도 인정한다. 단, '큰 소리로' 같은 하나의 구는
       기존 전체문자열 판정을 먼저 통과시키므로 여기서는 보조 판정만 한다. */
    const raw=String(userAnswer||'').trim();
    if(!/\s/.test(raw)) return false;
    const parts=raw.split(/\s+/).map(x=>x.trim()).filter(x=>x.length>=1);
    if(parts.length<2) return false;
    const candCanon=new Set();
    candidates.forEach(c=>{ forms(c).forEach(f=>{candCanon.add(f);candCanon.add(canonKor(f));}); });
    return parts.every(p=>{
      const pf=forms(p);
      return pf.some(f=>candCanon.has(f)||candCanon.has(canonKor(f)));
    });
  }

  function koreanGrade(userAnswer,full,eng){
    const userForms=forms(userAnswer);
    if(!userForms.length) return {correct:false,reason:'blank',label:'미입력'};

    const e=normEng(eng);
    if(STRICT_PRONOUNS[e]){
      const allowed=[];
      STRICT_PRONOUNS[e].forEach(v=>forms(v).forEach(x=>allowed.push(x)));
      const own=[];splitMeanings(full).forEach(p=>{const c=cleanKor(p);if(c){own.push(c);own.push(dropInnerParticles(c));}});const ok=userForms.some(u=>allowed.includes(u)||own.includes(u)); /* v23: 교재에 적힌 대명사 뜻(예: I=나, he=그 남자, mine=광산)은 그대로 정답 */
      return {correct:ok,reason:ok?'strict-pronoun':'strict-pronoun-wrong',label:ok?'정답':'대명사 형태가 다릅니다'};
    }

    const candidates=meaningCandidates(full,eng);

    /* 1. 정확/조사·띄어쓰기 차이 */
    for(const u of userForms){
      for(const c of candidates){
        if(!u||!c) continue;
        if(u===c) return {correct:true,reason:'exact',label:'정답'};
      }
    }

    /* 1-1. 정답 의미를 여러 개 공백으로 함께 쓴 답도 인정 */
    if(multiMeaningAnswerOK(userAnswer,candidates)){
      return {correct:true,reason:'multi-meaning',label:'정답'};

    /* 2. 의미군 동의어. 품사가 맞을 때만 인정 */

 const ne=s=>String(s||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
 function engVariants(eng){
   let out=[String(eng||'').replace(/~/g,' ')];
   for(let g=0;g<6;g++){
     const nx=[];let changed=false;
     out.forEach(s=>{
       let m=s.match(/\(([^)]*)\)/);
       if(m){changed=true;nx.push(s.replace(m[0],' '));nx.push(s.replace(m[0],' '+m[1]+' '));return;}

       nx.push(s);

     out=[...new Set(nx)];if(!changed)break;
   }

 }

     const eng=(a&&typeof a==='object'&&item===undefined)?a.eng:(item&&item.eng);
     const u=ne(ans);
     if(u&&engVariants(eng).has(u)){
       if(typeof r==='string')return 'correct';
       return Object.assign({},r||{},{correct:true,reason:'english-optional',label:'정답'});
     }
     return r;
   };
 }

(function(){

 function lev(a,b){a=a.toLowerCase();b=b.toLowerCase();const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}

     return `<button class="${cls}" data-d="${esc(d)}">${dayLabel(d)}<small>${sub}</small></button>`;}).join('');
   r.innerHTML=`<div class="w"><div class="hd"><b>📚 학습 모드</b><button class="x" data-a="close">닫기</button></div>
   <div class="help">① <b>카드</b>로 단어와 뜻을 보고 발음을 들어요.<br>② <b>4지선다</b>로 뜻 고르기 → 영어 고르기<br>③ 마지막에 뜻을 보고 <b>영어를 직접 써요.</b><br>틀리면 한 단계 내려가서 조금 뒤에 다시 나와요.</div>
   <div class="days">${tiles}</div></div>`;
   r.onclick=e=>{const t=e.target.closest('[data-a],[data-d]');if(!t)return;if(t.dataset.a==='close')close();else if(t.dataset.d)startDay(t.dataset.d);};
 }

 function startDay(d){
   prime();
   const words=(VOCA[d]||[]).map((it,i)=>Object.assign(it,{_day:d,_i:i}));
   const saved=store.get('d'+d,null);
   if(saved&&saved.lv&&saved.lv.length===words.length&&saved.lv.some(x=>x>0)&&saved.lv.some(x=>x<4)&&!S){
     const r=shell();
     r.innerHTML=`<div class="w"><div class="hd"><b>${dayLabel(d)}</b><button class="x" data-a="home">← DAY 목록</button></div><div class="card"><div class="kor">지난번에 하던 학습이 있어요.<br>(${Math.round(saved.pct||0)}% 진행)</div><button class="btn" data-a="resume">이어서 하기</button><button class="btn sec" data-a="new">처음부터 다시</button></div></div>`;
     r.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='home')openHome();if(a.dataset.a==='resume')begin(d,words,saved);if(a.dataset.a==='new'){store.del('d'+d);begin(d,words,null);}};
     return;
   }
   begin(d,words,null);
 }

 function begin(d,words,saved,onlyIdx){
   const n=words.length;
   S={day:d,words,lv:saved?saved.lv.slice():Array(n).fill(0),miss:saved?saved.miss.slice():Array(n).fill(0),
      due:Array(n).fill(0),turn:0,last:-1,order:shuffle([...Array(n).keys()]),active:[],only:onlyIdx||null};
   if(onlyIdx){S.lv=S.lv.map((v,i)=>onlyIdx.includes(i)?1:4);S.miss=Array(n).fill(0);}
   S.order=S.order.filter(i=>S.lv[i]<4);
   S.active=S.order.filter(i=>S.lv[i]>0).slice(0,7);
   next();
 }
 function save(){if(!S||S.only)return;const tot=S.words.length*4,cur=S.lv.reduce((a,b)=>a+Math.min(4,b),0);store.set('d'+S.day,{lv:S.lv,miss:S.miss,pct:cur/tot*100});}
 function pct(){const tot=S.words.length*4;return S.lv.reduce((a,b)=>a+Math.min(4,b),0)/tot*100;}

 function pick(){
   S.active=S.active.filter(i=>S.lv[i]<4);
   /* 새 단어는 진행 중인 단어가 6개보다 적을 때 하나씩 소개 */
   if(S.active.length<6){const nx=S.order.find(i=>S.lv[i]===0&&!S.active.includes(i));if(nx!==undefined){S.active.push(nx);return nx;}}
   if(!S.active.length){const rest=S.order.find(i=>S.lv[i]<4&&!S.active.includes(i));if(rest===undefined)return -1;S.active.push(rest);}
   let cands=S.active.filter(i=>i!==S.last);if(!cands.length)cands=S.active;
   cands.sort((a,b)=>(S.due[a]-S.due[b])||(S.lv[a]-S.lv[b]));
   const ready=cands.filter(i=>S.due[i]<=S.turn);
   return (ready.length?ready:cands)[0];
 }

 function frame(inner,tag){
   const r=shell();const p=pct();const left=S.lv.filter(x=>x<4).length;
   r.innerHTML=`<div class="w"><div class="hd"><b>${dayLabel(S.day)} 학습${S.only?' · 어려운 단어':''}</b><button class="x" data-a="quit">그만하기</button></div>
   <div class="bar"><i style="width:${p.toFixed(1)}%"></i></div><div class="meta"><span>${tag||''}</span><span>남은 단어 ${left} / ${S.words.length}</span></div>${inner}</div>`;
   r.onclick=null;
   r.querySelector('[data-a="quit"]').onclick=()=>{save();openHome();S=null;};
   return r;
 }
 function lvDots(i){return `<div class="lv">${[1,2,3,4].map(k=>`<i class="${S.lv[i]>=k?'on':''}"></i>`).join('')}</div>`;}

 function next(){
   if(!S)return;
   S.turn++;save();
   const i=pick();
   if(i<0)return finish();
   S.last=i;const it=S.words[i];const L=S.lv[i];
   if(L===0)return showCard(i,it);
   if(L===1)return showMC(i,it,'e2k');
   if(L===2)return showMC(i,it,'k2e');
   return showType(i,it);
 }
 function result(i,ok){
   if(ok){S.lv[i]=Math.min(4,S.lv[i]+1);S.due[i]=S.turn+3;}
   else{S.miss[i]++;S.lv[i]=Math.max(1,S.lv[i]-1);S.due[i]=S.turn+2;}
 }

 function showCard(i,it){
   const r=frame(`<div class="card"><div class="tag">새 단어</div><div class="eng">${esc(showEng(it.eng))}</div><button class="spk" data-a="spk">🔊 발음 듣기</button><div class="kor">${esc(fullKor(it))}</div><button class="btn" data-a="go">외웠어요 →</button></div>`,'① 카드 보기');
   speak(it.eng);
   r.querySelector('[data-a="spk"]').onclick=()=>speak(it.eng);
   r.querySelector('[data-a="go"]').onclick=()=>{S.lv[i]=1;S.due[i]=S.turn+2;next();};
 }

 function showMC(i,it,mode){
   const ds=distractors(it,mode);
   const opts=shuffle([it].concat(ds));
   const q=mode==='e2k'?`<div class="tag">뜻 고르기</div><div class="eng">${esc(showEng(it.eng))}</div><button class="spk" data-a="spk">🔊</button>`
                       :`<div class="tag">영어 고르기</div><div class="kor" style="font-size:21px;font-weight:700">${esc(fullKor(it))}</div>`;
   const r=frame(`<div class="card">${q}<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(mode==='e2k'?shortKor(o):showEng(o.eng))}</button>`).join('')}</div><div class="fb"></div><div class="ans"></div>${lvDots(i)}</div>`,mode==='e2k'?'② 4지선다 (영→한)':'③ 4지선다 (한→영)');
   if(mode==='e2k')speak(it.eng);
   const sp=r.querySelector('[data-a="spk"]');if(sp)sp.onclick=()=>speak(it.eng);
   let done=false;
   r.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
     if(done)return;done=true;const o=opts[+b.dataset.k];const ok=o===it;
     r.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.k]===it)x.classList.add('ok');});
     const fb=r.querySelector('.fb');
     if(ok){fb.className='fb ok';fb.textContent='정답! 👍';}
     else{b.classList.add('bad');fb.className='fb bad';fb.textContent='아쉬워요. 조금 뒤에 다시 나와요.';r.querySelector('.ans').textContent=showEng(it.eng)+' = '+fullKor(it);}
     if(mode==='k2e'||!ok)speak(it.eng);
     result(i,ok);
     if(ok)setTimeout(next,850);
     else{const nb=document.createElement('button');nb.className='btn';nb.textContent='확인했어요 →';nb.onclick=next;r.querySelector('.card').appendChild(nb);}
   });
 }

 function showType(i,it){
   const r=frame(`<div class="card"><div class="tag">직접 쓰기</div><div class="kor" style="font-size:21px;font-weight:700">${esc(fullKor(it))}</div>
     <input class="ty" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="영어로 쓰세요"><button class="btn" data-a="chk">확인</button><button class="btn sec" data-a="hint">첫 글자 힌트</button><div class="fb"></div><div class="ans"></div>${lvDots(i)}</div>`,'④ 직접 쓰기 (한→영)');
   const inp=r.querySelector('input.ty');setTimeout(()=>{try{inp.focus();}catch(e){}},60);
   let stage='answer',hinted=false;
   const target=showEng(it.eng).replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/\s+/g,' ').trim();
   /* 같은 뜻을 가진 다른 단어(reject/refuse 등)가 있으면 구별 힌트를 미리 보여 주고, 그 단어를 써도 오답 처리하지 않음 */
   const mine=new Set(kparts(it));
   const twins=pool(it._day).filter(x=>x!==it&&x.eng.toLowerCase()!==it.eng.toLowerCase()&&kparts(x).some(p=>mine.has(p)));
   if(twins.length){
     const tl=target.toLowerCase();let k=1;
     while(k<tl.length&&twins.some(x=>x.eng.toLowerCase().startsWith(tl.slice(0,k))))k++;
     const hb=document.createElement('div');hb.className='ans';hb.style.cssText='margin-top:6px;color:#8a6d1a';
     hb.innerHTML='💡 같은 뜻의 단어가 또 있어요. 힌트: <b>'+esc(target.slice(0,k))+'…</b> ('+target.replace(/[^A-Za-z]/g,'').length+'글자)';
     r.querySelector('.kor').after(hb);
   }
   r.querySelector('[data-a="hint"]').onclick=()=>{if(stage!=='answer')return;hinted=true;inp.placeholder=target.slice(0,1)+' _ _ _ ('+target.replace(/[^A-Za-z]/g,'').length+'글자)';inp.focus();};
   const go=()=>{
     const v=inp.value.trim();if(!v)return;
     const fb=r.querySelector('.fb');
     if(stage==='answer'){
       const tw=twins.find(x=>isRight(x,v)&&!isRight(it,v));
       if(tw){fb.className='fb';fb.style.color='#8a6d1a';fb.textContent='\u2018'+showEng(tw.eng)+'\u2019도 같은 뜻이지만, 여기서는 다른 단어예요. 힌트를 보고 다시 써 보세요.';inp.select();return;}
       const ok=isRight(it,v);speak(it.eng);
       if(ok){fb.className='fb ok';fb.textContent=hinted?'정답! (힌트 사용)':'정답! 완벽해요 🎉';result(i,!hinted);if(hinted){S.lv[i]=3;}inp.disabled=true;setTimeout(next,950);}
       else{result(i,false);fb.className='fb bad';fb.textContent='정답 철자를 보고 한 번 따라 써 보세요.';r.querySelector('.ans').innerHTML='정답: <b>'+esc(showEng(it.eng))+'</b>';inp.value='';inp.placeholder=target;stage='copy';inp.focus();}
     }else if(stage==='copy'){
       if(isRight(it,v)){fb.className='fb ok';fb.textContent='좋아요! 조금 뒤에 다시 나와요.';inp.disabled=true;stage='done';setTimeout(next,800);}
       else{fb.className='fb bad';fb.textContent='철자를 다시 확인해 보세요.';inp.select();}
     }
   };
   r.querySelector('[data-a="chk"]').onclick=go;
   inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
 }

 function finish(){
   const hard=S.words.map((w,i)=>({w,m:S.miss[i],i})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m);
   if(!S.only){const dn=store.get('done',{});dn[S.day]=Date.now();store.set('done',dn);store.del('d'+S.day);addHist(S.day,'learn');}
   const r=shell();const d=S.day;const words=S.words;const n=words.length;
   r.innerHTML=`<div class="w"><div class="hd"><b>${dayLabel(d)} 학습 완료 🎉</b><button class="x" data-a="home">DAY 목록</button></div>
   <div class="card"><div class="kor">${n}개 단어를 모두 외웠어요!</div>
   ${hard.length?`<div class="tag" style="margin-top:12px">틀렸던 단어 ${hard.length}개</div><ul class="hard">${hard.slice(0,15).map(x=>`<li><b>${esc(showEng(x.w.eng))}</b> ${esc(shortKor(x.w))} <span style="color:#c2453a">×${x.m}</span></li>`).join('')}</ul>
   <button class="btn" data-a="hard">틀렸던 단어만 다시 학습</button>`:'<div class="ans">한 번도 틀리지 않았어요. 대단해요!</div>'}
   <button class="btn sec" data-a="test">바로 ${dayLabel(d)} 시험 보기 →</button></div></div>`;
   const hardIdx=hard.map(x=>x.i);
   r.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;
     if(a.dataset.a==='home'){S=null;openHome();}
     if(a.dataset.a==='hard'){S=null;begin(d,words,null,hardIdx);}
     if(a.dataset.a==='test'){close();renderBanner();hostStart(d);}};
 }

 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addEntry);else addEntry();
 window.SEOLDAE_LEARN_MODE='v2';
})();

</script>
</body></html>
